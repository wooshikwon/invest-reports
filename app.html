<body>
<div id="top-glass"></div>
<div id="past"></div>
<div id="issue-bar"></div>
<main>
  <div id="berth"></div><div id="masthead"><header><p id="day"></p><p id="dated"></p><h1 id="title">투자 판단 리포트</h1></header><p id="moves"></p></div>
  <article id="report"><p class="status">리포트를 불러오는 중이다.</p></article>
</main>
<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  // 텔레그램 앱 안에서만 기기를 진동시킨다. 이슈 상자·달력 단추·달력 날짜·지수 전환 단추·바로가기 단추를 누르거나 접기 상자를 펼치면 가벼운 충격 진동을 낸다.
  // 접기, 목록으로 돌아가기, 밀어서 넘기기는 진동하지 않는다. 1개월 지수 방향 예측의 날짜 레버로 고른 날짜,
  // 미국 거시 지표에서 보는 지표, 다가오는 이벤트에서 보는 날짜가 바뀔 때마다 선택 변경 진동을 낸다.
  // 브라우저에서는 진동하지 않는다.
  const haptic = (tg && tg.initData && tg.HapticFeedback) || null;
  const feelPress = () => haptic?.impactOccurred("light");
  const feelSlide = () => haptic?.selectionChanged();
  if (tg && tg.initData) {
    tg.ready();
    // 리포트를 처음부터 시트를 끝까지 올린 높이로 연다.
    tg.expand();
    // 휴대폰에서는 전체화면으로 연다. 데스크톱 텔레그램은 거절하고 시트 그대로 둔다.
    if (tg.requestFullscreen && tg.isVersionAtLeast?.("8.0") && !tg.isFullscreen) tg.requestFullscreen();
    if (tg.setBackgroundColor) tg.setBackgroundColor("#171719");
    if (tg.setHeaderColor) tg.setHeaderColor("#171719");
    // 좌우로 넘기는 몸짓이 조금 기울어도 시트가 내려가지 않게, 세로로 끌어 닫는 동작을 끈다.
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    // 낮은 시트에서도 웹뷰는 시트를 끝까지 올린 높이로 그려지고 위쪽만 화면에 보인다. 보이는 높이는 `viewportStableHeight`이므로
    // 웹뷰 높이와의 차이를 `--offscreen`에 적고, 시트 높이가 바뀔 때마다 다시 적는다.
    const offscreen = () => {
      const hidden = tg.viewportStableHeight ? Math.max(0, innerHeight - tg.viewportStableHeight) : 0;
      document.documentElement.style.setProperty("--offscreen", `${hidden}px`);
    };
    offscreen();
    tg.onEvent("viewportChanged", offscreen);
    window.addEventListener("resize", offscreen);
  }
  const query = new URLSearchParams(location.search);
  // 달력과 지수 전환 단추로 고른 리포트는 주소의 `r`로 다시 연다. 텔레그램은 다시 연 뒤에도 처음 받은 `start_param`을 그대로 주므로 `r`을 먼저 읽는다.
  // 홈 화면 바로가기는 `start_param` 없이 미니 앱을 열므로, 키가 없으면 리포트를 받기 전에 `r/index.json`에서 키를 정한다.
  // 주소에 `issue`가 있으면 리포트 대신 그 번호의 이슈 하나를 보이는 이슈 화면을 그리고, `at`이 있으면 히스토리에서 그 날짜 항목을 고른다.
  if (query.get("issue")) document.documentElement.classList.add("issue");
  let key = query.get("r") || (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || query.get("tgWebAppStartParam") || "";
  const report = document.getElementById("report");
  // 머리 상자가 화면 위에 붙어 있으면 `stuck`을 단다. 문서 맨 위에서는 달지 않는다.
  // 붙었는지는 머리 상자 바로 위의 빈 띠(`#berth`)의 아래 끝이 머리 상자가 붙는 높이보다 위로 올라갔는지로 정한다. iOS는 코드가 화면을 옮긴 직후 붙는 상자의 위치를 옮기기 전 화면 기준으로 알려 주므로 머리 상자의 위치로 정하지 않는다.
  const masthead = document.getElementById("masthead");
  const berth = document.getElementById("berth");
  const stick = () => masthead.classList.toggle("stuck", scrollY > 0 && berth.getBoundingClientRect().bottom <= parseFloat(getComputedStyle(masthead).top) + .5);
  addEventListener("scroll", stick, { passive: true });
  // 화면이 움직일 때마다 내용의 위쪽으로 8px 넘게 올라갔는지(`rising`), 아래쪽으로 8px 넘게 내려갔는지(`falling`) 정한다.
  // 올라간 거리는 마지막으로 올라간 뒤 가장 깊이 내려간 위치부터, 내려간 거리는 마지막으로 내려간 뒤 가장 얕게 올라간 위치부터 잰다. 문서 양 끝을 넘어 튕긴 위치는 문서 끝으로 센다.
  // 머리 상자와 절 바로가기 알약은 같은 규칙으로 감추고 띄운다. 화면이 `STILL`ms 동안 움직이지 않으면 서서히 감추는 `idle`을, `falling`이면 바로 감추는 `idle fall`을 달고, 감춘 뒤에는 `rising`일 때와 뒤로 가기로 돌아온 페이지가 `reveal`을 보낼 때만 다시 띄운다.
  // 이슈를 넘길 때처럼 코드가 화면을 옮기는 동안은 사용자가 옮긴 것이 아니므로 `rising`과 `falling`을 모두 끄고, 옮긴 뒤의 위치부터 거리를 다시 잰다.
  // `hush`는 코드가 화면을 옮기기 시작할 때 부르고, 돌려받은 함수는 옮기기를 마치거나 사용자가 화면을 만져 멈출 때 부른다. 마지막 이동의 스크롤 사건까지 빼도록 두 프레임 뒤에 판정을 다시 켠다.
  const STILL = 1200;
  let deepest = scrollY, shallowest = scrollY, rising = false, falling = false, hushing = 0;
  const hush = () => {
    let held = true;
    hushing++;
    return () => {
      if (!held) return;
      held = false;
      requestAnimationFrame(() => requestAnimationFrame(() => hushing--));
    };
  };
  addEventListener("scroll", () => {
    const y = Math.max(0, Math.min(scrollY, document.documentElement.scrollHeight - innerHeight));
    if (hushing) {
      deepest = shallowest = y;
      rising = falling = false;
      return;
    }
    deepest = Math.max(deepest, y);
    shallowest = Math.min(shallowest, y);
    rising = y < deepest - 8;
    falling = y > shallowest + 8;
    if (rising) deepest = y;
    if (falling) shallowest = y;
  }, { passive: true });
  // 머리 상자는 붙어 있을 때만 `idle`을 단다.
  let still = 0;
  addEventListener("scroll", () => {
    if (falling && masthead.classList.contains("stuck")) {
      clearTimeout(still);
      masthead.classList.add("idle", "fall");
      return;
    }
    if (masthead.classList.contains("idle") && !rising) return;
    wakeMasthead();
  }, { passive: true });
  // 머리 상자를 띄우고 `STILL`ms 뒤에 감춘다. 뒤로 가기로 돌아온 페이지가 보내는 `reveal`에도 띄운다.
  const wakeMasthead = () => {
    masthead.classList.remove("idle", "fall");
    clearTimeout(still);
    still = setTimeout(() => masthead.classList.toggle("idle", stick()), STILL);
  };
  addEventListener("reveal", wakeMasthead);
  // 붙어 있는 머리 상자를 누르면 문서 맨 위로 올라간다. 지수 전환 단추·달력 단추와 달력 창을 누르면 그 단추의 동작만 한다.
  masthead.addEventListener("click", (event) => {
    if (!masthead.classList.contains("stuck") || event.target.closest("button, .cal-layer")) return;
    feelPress();
    scrollTo({ top: 0, behavior: motion.matches ? "instant" : "smooth" });
  });
  // 소제목 위 말머리와 이벤트 시각은 지수마다 리포트 그림의 판단 색 계열에서 채도를 낮춘 색으로 쓴다(conviction_chart.py JUDGMENT_COLORS).
  // 두 번째 색은 그라데이션이 끝나는 색으로, 지수색에서 색상환을 따라 보라 쪽으로 조금 옮긴 색이다.
  const INDEX = { nasdaq: ["#8FBCE6", "#AFA6EC"], biotech: ["#AE9CE6", "#E09DCB"] };
  const paint = () => {
    const tint = INDEX[key.split("-")[1]];
    if (!tint) return;
    document.documentElement.style.setProperty("--index", tint[0]);
    document.documentElement.style.setProperty("--index-to", tint[1]);
  };
  // `listing`은 `r/index.json`이다. `index` 지수의 리포트 가운데 날짜가 가장 늦은 리포트의 키를 돌려주고, 그 지수의 리포트가 없으면 빈 글자를 돌려준다.
  const latest = (listing, index) => Object.keys(listing).filter((name) => listing[name].index === index)
    .sort((a, b) => listing[b].date.localeCompare(listing[a].date))[0] || "";
  // 미니 앱 안에서 다른 리포트로 옮기면 주소의 `r`을 바꿔 페이지를 다시 열므로 브라우저 기록이 하나씩 쌓인다. 기록마다 처음 연 리포트에서
  // 몇 번 옮겨 왔는지(`depth`)를 `history.state`에 적는다. 옮기기 직전에 다음 깊이를 `sessionStorage`에 두고, 새 페이지가 그 값을 읽어 자기 기록에 적는다.
  // 뒤로 가기로 돌아온 페이지는 자기 기록에 적힌 깊이를 그대로 쓴다.
  const depth = history.state?.depth ?? (+sessionStorage.getItem("depth") || 0);
  sessionStorage.removeItem("depth");
  history.replaceState({ ...history.state, depth }, "");
  // 옮기기 직전의 화면 위치(`y`)도 자기 기록에 적는다. 브라우저는 리포트를 받아 그리기 전에 화면 위치를 되돌리려다 실패하므로, 되돌리기는 페이지가 맡는다.
  history.scrollRestoration = "manual";
  // 이슈 화면(`issue`, `at`)은 `more`로 줄 때만 주소에 적고, 다른 리포트로 옮길 때는 지운다.
  const visit = (target, more = {}) => {
    history.replaceState({ ...history.state, y: scrollY }, "");
    sessionStorage.setItem("depth", depth + 1);
    const params = new URLSearchParams(location.search);
    params.delete("issue");
    params.delete("at");
    params.set("r", target);
    Object.entries(more).forEach(([name, value]) => params.set(name, value));
    location.search = params.toString();
  };
  const fail = (message) => { report.innerHTML = `<p class="status">${message}</p>`; };
  // 좌우로 넘기는 동작은 모두 `--glide`와 같은 0.3초, 같은 감속 곡선(cubic-bezier(.33, 1, .68, 1))으로 움직인다.
  // `glide`는 값을 `from`에서 `to`까지 그 곡선으로 바꾸며 매 프레임 `set`을 부르고, 다 바꾸면 `done`을 부른다. 멈추는 함수를 돌려준다.
  const motion = matchMedia("(prefers-reduced-motion: reduce)");
  const GLIDE = 300, EASE = "cubic-bezier(.33, 1, .68, 1)";
  const glide = (from, to, set, done) => {
    const begin = performance.now(), span = motion.matches ? 0 : GLIDE;
    let frame;
    const tick = (now) => {
      const t = span ? Math.min(1, Math.max(0, (now - begin) / span)) : 1;
      set(from + (to - from) * (1 - (1 - t) ** 3));
      if (t < 1) frame = requestAnimationFrame(tick);
      else done?.();
    };
    frame = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(frame);
  };

  // 슬라이드마다 노드 목록을 받아 좌우로 넘기는 묶음을 만들고 `after` 뒤에 둔다. 묶음 상자를 돌려준다.
  // `fit`이면 넘기기가 멈춘 뒤와 슬라이드 높이가 바뀐 뒤 묶음 높이를 보고 있는 슬라이드에 맞춘다. `change`가 있으면 보고 있는
  // 슬라이드가 바뀔 때마다 그 번호로 `change`를 부른다. `start`번 슬라이드부터 보여 준다.
  // `feel`이면 보고 있는 슬라이드가 바뀔 때마다 선택 변경 진동을 낸다. 상자의 `go(i)`는 i번 슬라이드로 넘긴다.
  function slider(slides, after, { fit = false, start = 0, change = null, name = "", area = null, feel = false } = {}) {
    const box = document.createElement("div");
    box.className = ["carousel", fit && "fit", name].filter(Boolean).join(" ");
    box.innerHTML = '<div class="track"></div>';
    const track = box.querySelector(".track");
    slides.forEach((nodes) => {
      const slide = document.createElement("div");
      slide.className = "slide";
      nodes.forEach((node) => slide.appendChild(node));
      track.appendChild(slide);
    });
    after.after(box);
    const step = () => (slides.length > 1 ? track.children[1].offsetLeft - track.children[0].offsetLeft : 1);
    const current = () => Math.min(slides.length - 1, Math.max(0, Math.round(track.scrollLeft / step())));
    const fitHeight = () => { if (fit) track.style.height = `${track.children[current()].offsetHeight}px`; };
    // 손가락을 뗀 뒤 넘기기가 멈추면, 손을 댄 장에서 민 방향으로 지나간 장의 폭 1/5을 넘긴 만큼 장을 넘기고, 1/5을 넘기지 못하면
    // 손을 댄 장으로 맞춘다. 맞추는 동안 손을 다시 대면 맞추기를 그 위치에서 멈추고 새로 민 거리로 다시 정한다.
    let timer, shown = start, felt = start, from = null, touching = false, aligning = null;
    // 장을 옮기는 동안에는 한 장씩 멈추기를 끄고 `glide`로 옮긴다. 켜 두면 브라우저가 매 프레임 가까운 장으로 끌어당긴다.
    const stop = () => { aligning?.(); aligning = null; track.style.scrollSnapType = ""; };
    const slide = (i) => {
      stop();
      track.style.scrollSnapType = "none";
      aligning = glide(track.scrollLeft, i * step(), (left) => (track.scrollLeft = left), () => { aligning = null; track.style.scrollSnapType = ""; });
    };
    track.addEventListener("touchstart", () => {
      touching = true;
      stop();
      from = current();
    }, { passive: true });
    const settle = () => {
      if (touching) return;
      const goal = target();
      if (Math.abs(track.scrollLeft - goal * step()) > 1) {
        from = goal;
        if (!aligning) slide(goal);
        return;
      }
      from = null;
      fitHeight();
    };
    const wait = () => { clearTimeout(timer); timer = setTimeout(settle, 150); };
    const release = () => { touching = false; wait(); };
    track.addEventListener("touchend", release, { passive: true });
    track.addEventListener("touchcancel", release, { passive: true });
    const target = () => {
      const at = track.scrollLeft / step(), base = from ?? current();
      if (Math.abs(at - base) < 0.2) return base;
      const goal = at > base ? Math.ceil(at - 0.2) : Math.floor(at + 0.2);
      return Math.min(slides.length - 1, Math.max(0, goal));
    };
    // `fit`이면 넘기는 동안 화면에 걸친 두 장 가운데 더 높은 장만큼 묶음 높이를 바로 늘려, 들어오는 장의 아래가 잘리지 않게 한다.
    // 줄이는 것은 넘기기가 멈춘 뒤에 한다.
    const reveal = () => {
      const at = track.scrollLeft / step(), last = slides.length - 1;
      const need = Math.max(...[Math.floor(at), Math.ceil(at)].map((i) => track.children[Math.min(last, Math.max(0, i))].offsetHeight));
      if (need <= track.offsetHeight) return;
      track.style.transition = "none";
      track.style.height = `${need}px`;
      track.offsetHeight;
      track.style.transition = "";
    };
    track.addEventListener("scroll", () => {
      if (fit) reveal();
      const now = current();
      if (feel && now !== felt) { felt = now; feelSlide(); }
      if (change && now !== shown) change((shown = now));
      wait();
    }, { passive: true });
    // 화면 폭이 바뀌거나 슬라이드 안의 표식·그림이 나중에 자리를 잡아 슬라이드 높이가 바뀌어도 묶음 높이를 다시 맞춘다.
    if (fit) {
      const watch = new ResizeObserver(fitHeight);
      [...track.children].forEach((slide) => watch.observe(slide));
    }
    box.go = (i) => slide(Math.min(slides.length - 1, Math.max(0, i)));
    // 절 제목 `area`를 받으면 그 제목부터 다음 절 제목 앞까지(마지막 절이면 문서 끝까지)를 넘기기 영역으로 쓴다. 넘기기 묶음과 날짜 띠 밖에서
    // 가로로 40px 넘게, 세로 이동의 1.5배 넘게 밀고 손을 떼면 민 방향의 다음 장으로 넘긴다.
    if (area) {
      let begin = null;
      document.addEventListener("touchstart", (event) => {
        begin = null;
        const { target, touches } = event;
        if (touches.length !== 1 || track.contains(target) || target.closest(".viewer, .help-card, .cal-layer, .cal, .days, .back-edge, .frozen, input")) return;
        let next = area.nextElementSibling;
        while (next && next.tagName !== "H2") next = next.nextElementSibling;
        const y = touches[0].clientY;
        if (y < area.getBoundingClientRect().top || (next && y >= next.getBoundingClientRect().top)) return;
        begin = { x: touches[0].clientX, y };
      }, { passive: true });
      document.addEventListener("touchend", (event) => {
        if (!begin) return;
        const touch = event.changedTouches[0], dx = touch.clientX - begin.x, dy = touch.clientY - begin.y;
        begin = null;
        if (Math.abs(dx) > 40 && Math.abs(dx) > 1.5 * Math.abs(dy)) box.go(current() - Math.sign(dx));
      }, { passive: true });
    }
    track.scrollLeft = start * step();
    if (change) change(start);
    fitHeight();
    return box;
  }

  // 요약의 Outlook 그림 자리에 12M + Predictions, Montecarlo, Outlook 순서로 넘기는 묶음을 둔다.
  // Montecarlo는 원래 다가오는 이벤트 절에 있으므로 그 자리에서는 뺀다. 12M + Predictions가 없는 리포트는 두 장을 넘긴다.
  // 묶음 위에는 그림 이름 탭을 둔다. 탭을 누르면 그 그림으로 넘기고, 넘기면 보고 있는 그림의 탭을 밝힌다.
  // 그림 카드 값(`build.py`가 리포트 끝에 둔 `#cards`)이 있는 리포트는 그림 대신 같은 이름의 카드 세 장을 넘긴다.
  function figures(date) {
    const data = report.querySelector("#cards");
    if (data) {
      data.remove();
      const set = summaryCards(JSON.parse(data.textContent), date);
      const bar = document.createElement("div");
      bar.className = "tabs";
      set.names.forEach((name, i) => {
        const button = Object.assign(document.createElement("button"), { textContent: name });
        button.addEventListener("click", () => box.go(i));
        bar.appendChild(button);
      });
      const change = (i) => [...bar.children].forEach((button, j) => button.classList.toggle("on", i === j));
      const box = slider(set.slides, report.querySelector("h2"), { change, name: "cards" });
      box.prepend(bar);
      cardRewind(box, date, set);
      return;
    }
    const pick = (name) => [...report.querySelectorAll("img")].find((img) => img.getAttribute("src").includes(`/${name}-`));
    const chart = pick("chart"), tree = pick("tree"), predict = pick("predict");
    if (!chart || !tree) return;
    const shown = [[predict, "주가와 예측"], [tree, "몬테카를로"], [chart, "권장 추종 배율"]].filter(([img]) => img);
    shown.forEach(([img]) => (img.closest("p") || img).remove());
    const bar = document.createElement("div");
    bar.className = "tabs";
    shown.forEach(([, name], i) => {
      const button = Object.assign(document.createElement("button"), { textContent: name });
      button.addEventListener("click", () => box.go(i));
      bar.appendChild(button);
    });
    const change = (i) => [...bar.children].forEach((button, j) => button.classList.toggle("on", i === j));
    const box = slider(shown.map(([img]) => [img]), report.querySelector("h2"), { change });
    box.prepend(bar);
  }

  // 되감기 슬라이더가 보여 주는 날짜 수와, 리포트 날짜 `date`에서 그 앞 30일의 첫날을 0으로 센 `day`의 자리.
  const REWIND_SPAN = 30, rewindOffset = (day, date) => Math.round((Date.parse(day) - Date.parse(date)) / 864e5) + REWIND_SPAN;

  // 그림 묶음 아래에 지난 판단 날짜를 고르는 슬라이더를 둔다. `days`는 고를 수 있는 날짜(오름차순)이고 `start`번 날짜에서 시작한다.
  // 슬라이더는 리포트 날짜와 그 앞 30일을 늘 같은 폭으로 보여 주고, 레버는 `days`의 날짜에만 선다. 레버가 선 날짜가 정해질 때마다 그 번호로 `pick`을 부른다.
  function dial(box, date, days, start, pick) {
    const offset = (day) => rewindOffset(day, date);
    const control = document.createElement("div");
    control.className = "rewind";
    control.innerHTML = `<input type="range" min="0" max="${REWIND_SPAN}" step="1" value="${REWIND_SPAN}"><span></span>`;
    const [range, shown] = control.children;
    const first = offset(days[0]);
    range.style.setProperty("--from", first / REWIND_SPAN);
    let wanted = start;
    // 레버를 잡고 있는 동안 레버 위에 날짜 말풍선을 띄운다. 레버 폭 18px를 빼고 남은 폭에서 레버 중심을 찾고,
    // 말풍선은 슬라이더 폭 안에 두되 꼬리는 레버 중심을 가리킨다.
    const show = (i) => {
      wanted = i;
      range.value = offset(days[i]);
      shown.textContent = `${days[i].slice(5, 7)}/${days[i].slice(8, 10)}`;
      const half = shown.offsetWidth / 2, at = 9 + offset(days[i]) / REWIND_SPAN * (range.clientWidth - 18);
      shown.style.left = `${Math.min(range.clientWidth - half, Math.max(half, at))}px`;
      shown.style.setProperty("--tail", `${at - Math.min(range.clientWidth - half, Math.max(half, at))}px`);
      pick(i);
    };
    // 레버를 첫 날짜보다 왼쪽으로 옮기면 첫 날짜에 세우고, 그 밖에는 가장 가까운 날짜로 붙인다. 붙는 날짜가 바뀔 때마다 진동을 낸다.
    const nearest = () => {
      const at = Math.max(first, +range.value);
      return days.reduce((best, day, i) => (Math.abs(offset(day) - at) <= Math.abs(offset(days[best]) - at) ? i : best), 0);
    };
    range.addEventListener("input", () => {
      const i = nearest();
      if (i !== wanted) feelSlide();
      show(i);
    });
    const hold = (on) => () => { control.classList.toggle("held", on); if (on) show(nearest()); };
    range.addEventListener("pointerdown", hold(true));
    ["pointerup", "pointercancel", "change", "blur"].forEach((type) => range.addEventListener(type, hold(false)));
    box.appendChild(control);
    show(start);
  }

  // 요약 절의 그림 카드 세 장(주가와 예측, Montecarlo, 권장 추종 배율)을 만든다. `data`는 `build.py` `summary_cards`의 값이다.
  // 돌려준 `show(frame)`은 되감기 슬라이더가 고른 날짜의 판단(`cards.json`의 프레임)으로 세 장을 다시 그린다.
  // 주가와 예측의 종가 바탕(날짜·종가·지난 예측)은 늘 리포트 날짜의 값이고, 고른 날짜의 판단만 그 위에 바꿔 그린다.
  function summaryCards(data, date) {
    // 세 카드는 같은 높이(`H`)의 그림에 같은 높이(`B`)의 가로축을 긋는다.
    const color = data.color, so = data.start_offset, dates = data.dates, hist = data.history, W = 320, H = 236, B = 212;
    const tint = (a) => `rgba(${[1, 3, 5].map((k) => parseInt(color.slice(k, k + 2), 16)).join(", ")}, ${a})`;
    const fmt = (v) => `$${Math.round(v).toLocaleString("en-US")}`;
    const signed = (v, digits = 1) => `${v > 0 ? "+" : v < 0 ? "\u2212" : ""}${Math.abs(v).toFixed(digits)}`;
    const md = (day) => `${day.slice(5, 7)}/${day.slice(8, 10)}`;
    const path = (points) => `M${points.map(([x, y]) => `${x} ${y}`).join("L")}`;
    const last = dates.length - 1;
    // 카드 틀. 위 줄 맥락 글씨, 가운데 줄 값과 상태, 그림 칸, 그림 아래 줄을 둔다. 맥락 글씨는 지난 날짜를 고르면 그 리포트 날짜를 앞에 붙인다.
    // 값은 글씨나 노드 목록으로 받고, 상태 글씨가 없으면 상태 칸을 숨긴다. 맥락 글씨를 따로 받으면 카드를 만들 때의 맥락 글씨 대신 쓴다.
    const card = (ctx) => {
      const box = Object.assign(document.createElement("div"), { className: "gauge summary" });
      box.style.setProperty("--card-color", color);
      box.innerHTML = '<div class="top"><span class="ctx"></span></div><div class="val"><b></b><span class="state"><i></i><span></span></span></div><div class="fig"></div><div class="foot"></div>';
      const [label, value, state] = [box.querySelector(".ctx"), box.querySelector(".val b"), box.querySelector(".state")];
      const svg = box.querySelector(".fig").appendChild(shape("svg", { viewBox: `0 0 ${W} ${H}` }));
      const head = (frame, text, big, context = ctx) => {
        label.textContent = frame.day === date ? context : `${md(frame.day)} 리포트, ${context}`;
        value.replaceChildren(...[big].flat());
        state.querySelector("span").textContent = text;
        state.hidden = !text;
      };
      return { box, svg, head, foot: box.querySelector(".foot") };
    };

    // 주가와 예측: 그림 아래 −·+ 단추로 고른 기간의 종가와 고른 날짜 판단의 25~75% 범위, 50% 선을 그린다. 회색 점선과 면은 지난 리포트의 예측이다.
    // 기간은 3년, 2년, 1년, 6개월, 3개월 다섯 단계이고, +는 한 단계 짧게, −는 한 단계 길게 바꾼다.
    // 고른 날짜가 리포트 날짜보다 앞이면 종가 선은 그날 판단의 출발점에서 다시 이어 리포트 날짜 판단의 기준 가격 날짜 종가까지 그리고,
    // 그 오른쪽 `start_offset` 거래일에 리포트 날짜 판단의 기준 가격을 점으로 찍어 점선으로 잇는다.
    const predict = (() => {
      const c = card("25거래일 뒤 예측"), s = c.svg;
      const L = 4, R = W - 4, T = 22, xmax = last + so + 25;
      const SPAN = [756, 504, 252, 126, 63].map((days) => Math.max(0, last - days));
      let span = 2, frame = null, raf = 0;
      const zoom = c.foot.appendChild(Object.assign(document.createElement("div"), { className: "zoom" }));
      zoom.innerHTML = `<button type="button" aria-label="기간 늘리기">\u2212</button><span class="steps">${"<i></i>".repeat(SPAN.length)}</span><button type="button" aria-label="기간 줄이기">+</button>`;
      const [wider, narrower] = zoom.querySelectorAll("button");
      const level = () => {
        wider.disabled = span === 0;
        narrower.disabled = span === SPAN.length - 1;
        zoom.querySelectorAll(".steps i").forEach((dot, i) => dot.classList.toggle("on", i === span));
      };
      level();
      const past = data.past.map(([x, lo, mid, hi]) => ({ x, lo, mid, hi }));
      const at = (f) => dates.indexOf(f.base_date);
      const end = (f, q) => f.predict[q][f.predict[q].length - 1];
      // 기간마다 세로 범위: 보이는 종가·예측 면·지난 예측을 담고, 최저 점 아래에 글씨가 들어갈 20px을 비운다.
      const range = (x0) => {
        const shown = hist.slice(x0, last + 1);
        let lo = Math.min(...shown, ...frame.predict.q25, ...past.map((p) => p.lo));
        const hi = Math.max(...shown, ...frame.predict.q75, ...past.map((p) => p.hi));
        const low = Math.min(...shown);
        lo = Math.min(lo, low - (hi - low) * 20 / (B - T - 20));
        return [lo, hi];
      };
      // `x0`는 그림 왼쪽 끝의 거래일 번호다. 기간을 옮기는 동안에는 소수 값을 받아 두 기간 사이를 이어 그린다.
      const draw = (x0, lo, hi, marks) => {
        s.replaceChildren();
        const f = frame, fx = at(f), p = f.predict;
        const X = (i) => L + (i - x0) / (xmax - x0) * (R - L), Y = (v) => B - (v - lo) / (hi - lo) * (B - T);
        const clip = shape("clipPath", { id: "predict-clip" });
        clip.append(shape("rect", { x: L, y: 0, width: R - L, height: B }));
        s.append(clip);
        const g = s.appendChild(shape("g", { "clip-path": "url(#predict-clip)" }));
        // 달 이름은 6월·12월, 분기 달, 나머지 달 순서로 남긴다. 이름 사이 간격이 42px보다 좁아지면 아래 단계의 달 이름부터 흐리게 지운다.
        const perMonth = 21 * (R - L) / (xmax - x0), fade = (months) => Math.max(0, Math.min(1, (months * perMonth - 30) / 12));
        let month = "";
        dates.forEach((d, i) => {
          if (d.slice(0, 7) === month) return;
          month = d.slice(0, 7);
          const x = X(i), m = +d.slice(5, 7), opacity = fade(m % 6 === 0 ? 6 : m % 3 === 0 ? 3 : 1);
          if (x >= L + 12 && opacity > 0) s.append(shape("text", { x, y: B + 17, "font-size": 11, fill: DIMS, "text-anchor": "middle", opacity }, `${m}월`));
        });
        s.append(shape("line", { x1: L, x2: R, y1: B, y2: B, stroke: DIMS, "stroke-width": 1 }));
        if (past.length) {
          g.append(shape("path", { d: `${path(past.map((q) => [X(q.x), Y(q.lo)]))}L${past.slice().reverse().map((q) => `${X(q.x)} ${Y(q.hi)}`).join("L")}Z`, fill: "rgba(167, 171, 176, .16)" }));
          g.append(shape("path", { d: path(past.map((q) => [X(q.x), Y(q.mid)])), fill: "none", stroke: "#A7ABB0", "stroke-width": 1.2, "stroke-dasharray": "2 3", opacity: .8 }));
        }
        const xs = p.q50.map((_, k) => X(fx + (k ? k + so : so))), origin = [xs[0], Y(f.base)];
        g.append(shape("path", { d: `${path(xs.map((x, k) => [x, Y(p.q25[k])]))}L${xs.slice().reverse().map((x, k) => `${x} ${Y(p.q75[xs.length - 1 - k])}`).join("L")}Z`, fill: color, opacity: .22 }));
        const i0 = Math.max(0, Math.floor(x0)), width = 1.4 - .4 * Math.max(0, Math.min(1, (last - x0 - 63) / 693));
        const stroke = { fill: "none", stroke: PRICE, "stroke-width": width, "stroke-linejoin": "round" };
        g.append(shape("path", { d: path(hist.slice(i0, fx + 1).map((v, k) => [X(i0 + k), Y(v)])), ...stroke }));
        g.append(shape("path", { d: path([[X(fx), Y(hist[fx])], origin]), ...stroke, "stroke-dasharray": "2 2" }));
        const today = [X(last + so), Y(data.base)];
        if (last > fx) {
          g.append(shape("path", { d: path([origin, ...hist.slice(fx + 1).map((v, k) => [X(fx + 1 + k), Y(v)])]), ...stroke }));
          g.append(shape("path", { d: path([[X(last), Y(hist[last])], today]), ...stroke, "stroke-dasharray": "2 2" }));
        }
        s.append(shape("path", { d: path(xs.map((x, k) => [x, Y(p.q50[k])])), fill: "none", stroke: color, "stroke-width": 1.4, "stroke-linejoin": "round" }));
        // 최고·최저 글씨는 기간이 정해진 뒤에만 그리고, 오른쪽 값이 차지하는 그림 오른쪽 끝 34px을 비운다.
        if (marks) {
          const group = s.appendChild(shape("g", { class: "marks" }));
          const shown = hist.slice(i0, last + 1);
          [[i0 + shown.indexOf(Math.max(...shown)), -7, "최고"], [i0 + shown.indexOf(Math.min(...shown)), 15, "최저"]].forEach(([i, dy, text]) => {
            group.append(shape("circle", { cx: X(i), cy: Y(hist[i]), r: 2.5, fill: PRICE }));
            group.append(shape("text", { x: Math.min(Math.max(X(i), L + 30), R - 64), y: Y(hist[i]) + dy, "font-size": 11, fill: DIMS, "text-anchor": "middle" }, `${text} ${fmt(hist[i])}`));
          });
        }
        // 오른쪽 값은 중앙값을 머리 줄에 크게 적으므로 75% 값과 25% 값만 그림 오른쪽 끝에 맞춰 적는다. 75% 값은 면 위쪽 가장자리 위에,
        // 25% 값은 아래쪽 가장자리 아래에 두고, 선 위에서도 읽히게 배경색 테두리를 두른다.
        [["q75", -5], ["q25", 13]].forEach(([q, dy]) => s.append(shape("text", { x: R, y: Y(end(f, q)) + dy, "font-size": 11, fill: color, "text-anchor": "end",
          stroke: "#171719", "stroke-width": 3, "stroke-linejoin": "round", "paint-order": "stroke" }, fmt(end(f, q)))));
        if (last > fx) s.append(shape("circle", { cx: today[0], cy: today[1], r: 2.5, fill: PRICE }));
        s.append(shape("circle", { cx: origin[0], cy: origin[1], r: 2.5, fill: "#EAEAEA", stroke: "#171719", "stroke-width": 1 }));
      };
      // `from` 기간에서 `to` 기간으로 가는 도중 `t`(0~1) 지점의 그림. 왼쪽 끝과 세로 범위를 같은 곡선으로 옮기고, 넓히는 동안 새로 들어온
      // 과거 종가가 범위 밖이면 범위를 그만큼 먼저 넓혀 선이 가로축 아래로 내려가지 않게 한다.
      const ease = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
      const tween = (from, to, t) => {
        const e = ease(t), [a0, a1] = range(SPAN[from]), [b0, b1] = range(SPAN[to]);
        const x0 = SPAN[from] + (SPAN[to] - SPAN[from]) * e, [c0, c1] = range(Math.max(0, Math.floor(x0)));
        draw(x0, Math.min(a0 + (b0 - a0) * e, c0), Math.max(a1 + (b1 - a1) * e, c1), t >= 1);
      };
      const move = (by) => {
        const from = span;
        span = Math.max(0, Math.min(SPAN.length - 1, span + by));
        if (span === from) return;
        level();
        cancelAnimationFrame(raf);
        const duration = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 550, t0 = performance.now();
        const step = (now) => { const t = duration ? Math.min(1, (now - t0) / duration) : 1; tween(from, span, t); if (t < 1) raf = requestAnimationFrame(step); };
        raf = requestAnimationFrame(step);
      };
      wider.addEventListener("click", () => move(-1));
      narrower.addEventListener("click", () => move(1));
      return {
        box: c.box,
        show(f) {
          frame = f;
          cancelAnimationFrame(raf);
          c.head(f, `중앙값 ${signed((end(f, "q50") / f.base - 1) * 100)}%`, fmt(end(f, "q50")));
          tween(span, span, 1);
        },
      };
    })();

    // Montecarlo: 등락률 분위수의 10~90% 옅은 면과 25~75% 면, 50% 실선을 주가와 예측 카드와 같은 판단 색으로 그린다. 위쪽 번호는 이슈 일정이 있는 날이고,
    // 마지막 거래일에는 일정이 없어도 번호를 달고, 처음에는 마지막 번호를 고른다. 번호를 누르면 위 값을 그날의 25~75% 등락률로 바꾸고
    // 세로선과 범위 끝이 만나는 곳에 그날의 등락률을 적는다. 그림 아래 줄 가운데에는 고른 일정의 날짜와 이름을 적고, 이름이 줄을 넘으면 말줄임표로 줄인다.
    // 그 줄 양옆의 꺽쇠를 누르면 앞뒤 일정을 고른다. 지난 날짜를 고르면 그날 기준 가격 뒤의 실제 종가 등락률을 흰 선으로 그린다.
    const tree = (() => {
      const c = card("25거래일 뒤 등락률 예측"), s = c.svg;
      const L = 4, R = W - 4, T = 38;
      const box = c.foot.appendChild(Object.assign(document.createElement("div"), { className: "evbox" }));
      const chevron = (d, label) => Object.assign(document.createElement("button"), { type: "button", ariaLabel: label,
        innerHTML: `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>` });
      const prev = chevron("M10 3 5 8l5 5", "이전 일정"), next = chevron("M6 3l5 5-5 5", "다음 일정");
      const line = Object.assign(document.createElement("span"), { className: "t" });
      box.append(prev, line, next);
      let frame = null, pick = null, events = [], scale = null;
      prev.addEventListener("click", () => { if (pick > 0) { pick -= 1; mark(); } });
      next.addEventListener("click", () => { if (pick < events.length - 1) { pick += 1; mark(); } });
      const percent = (v) => [signed(v), Object.assign(document.createElement("small"), { textContent: "%" })];
      const mark = () => {
        s.querySelectorAll("[data-ev]").forEach((node) => {
          const on = +node.dataset.ev === pick;
          if (node.tagName === "line") node.setAttribute("stroke", on ? tint(.7) : "rgba(122, 130, 140, .35)");
          else if (node.tagName === "circle") node.setAttribute("fill", on ? color : "#2A2D33");
          else node.setAttribute("fill", on ? "#0b1a24" : "#EAEAEA");
        });
        const [d, names, day] = events[pick], pct = frame.tree.pct, { X, Y, values } = scale;
        // 고른 세로선이 10~90%와 25~75% 범위의 위아래 끝과 만나는 네 곳에 작은 점을 찍고 그날의 등락률을 회색으로 적는다. 10~90% 범위의 점과 값은 더 연하게 그린다. 글씨는 세로선이 그림 왼쪽 반에 있으면
        // 오른쪽에, 오른쪽 반에 있으면 왼쪽에 둔다. 위아래 글씨가 12px보다 가까우면 네 글씨의 평균 높이를 지키며 12px 간격으로 벌린다.
        const right = X(d) < (L + R) / 2, ys = ["90", "75", "25", "10"].map((q) => Y(pct[q][d]) + 4);
        const at = ys.reduce((out, y) => [...out, out.length ? Math.max(y, out[out.length - 1] + 12) : y], []);
        const shift = (ys.reduce((a, b) => a + b) - at.reduce((a, b) => a + b)) / at.length;
        const ink = (q) => q === "25" || q === "75" ? "#A7ABB0" : "#45494F";
        values.replaceChildren(...["90", "75", "25", "10"].map((q) => shape("circle", { cx: X(d), cy: Y(pct[q][d]), r: 1.6, fill: ink(q) })),
          ...["90", "75", "25", "10"].map((q, k) => shape("text", { x: X(d) + (right ? 5 : -5), y: at[k] + shift, "font-size": 11, fill: ink(q),
          "text-anchor": right ? "start" : "end", stroke: "#171719", "stroke-width": 3, "stroke-linejoin": "round", "paint-order": "stroke" }, `${signed(pct[q][d])}%`)));
        c.head(frame, "", [...percent(pct["25"][d]), Object.assign(document.createElement("span"), { className: "sep", textContent: "~" }), ...percent(pct["75"][d])],
          `${d}거래일 뒤 등락률 예측`);
        line.replaceChildren(Object.assign(document.createElement("span"), { className: "d", textContent: day }),
          names.length ? names.join(", ") : "예측 마지막 날");
        prev.disabled = pick === 0;
        next.disabled = pick === events.length - 1;
      };
      const draw = () => {
        s.replaceChildren();
        const f = frame, pct = f.tree.pct, n = pct["50"].length - 1;
        events = f.tree.events.at(-1)?.[0] === n ? f.tree.events : [...f.tree.events, [n, [], f.days[n].slice(5).split("-").map(Number).join("/")]];
        pick ??= events.length - 1;
        const actual = f.day === date ? [] : f.tree.actual.slice(0, (f.days.indexOf(data.base_date) + 1) || undefined);
        // 지난 날짜에서 실제 종가가 리포트 날짜 판단의 기준 가격 날짜까지 모두 있으면, 그 오른쪽 `start_offset` 거래일에 리포트 날짜 판단의 기준 가격을 놓고 점선으로 잇는다.
        const tail = actual.length && f.days[actual.length - 1] === data.base_date ? [actual.length - 1 + so, (data.base / f.base - 1) * 100] : null;
        const reach = Math.max(15, ...[pct["10"], pct["90"], actual].flat().map(Math.abs), tail ? Math.abs(tail[1]) : 0);
        const top = Math.ceil(reach / 5) * 5;
        const X = (d) => L + d / n * (R - L), Y = (v) => B - (Math.max(-top, Math.min(top, v)) + top) / (2 * top) * (B - T);
        const band = (a, b, opacity) => shape("path", { d: `${path(pct[a].map((v, d) => [X(d), Y(v)]))}L${pct[b].slice().reverse().map((v, d) => `${X(n - d)} ${Y(v)}`).join("L")}Z`, fill: color, opacity });
        s.append(band("10", "90", .14));
        s.append(shape("line", { x1: L, x2: R, y1: Y(0), y2: Y(0), stroke: "rgba(122, 130, 140, .55)" }));
        // 이웃 번호와 16px보다 가까운 번호는 한 줄 위에 그린다.
        let before = -99, row = 0;
        const hits = [];
        events.forEach(([d], i) => {
          row = X(d) - before < 16 && row === 0 ? 1 : 0;
          before = X(d);
          const cy = T - 9 - row * 17;
          s.append(shape("line", { x1: X(d), x2: X(d), y1: cy, y2: B, "stroke-width": 1, "stroke-dasharray": "2 3", "data-ev": i }));
          s.append(shape("circle", { cx: X(d), cy, r: 7.5, "data-ev": i }));
          s.append(shape("text", { x: X(d), y: cy + 3.5, "font-size": 9.5, "font-weight": 600, "text-anchor": "middle", "pointer-events": "none", "data-ev": i }, i + 1));
          // 번호 원과 그 아래 세로선 양옆 7px까지를 누르면 그 일정을 고른다. 누르는 면은 범위 띠에 가리지 않게 맨 마지막에 붙인다.
          const touch = { fill: "transparent", style: "cursor:pointer" };
          [shape("circle", { cx: X(d), cy, r: 13, ...touch }), shape("rect", { x: X(d) - 7, y: cy, width: 14, height: B - cy, ...touch })].forEach((hit) => {
            hit.addEventListener("click", () => { pick = i; mark(); });
            hits.push(hit);
          });
        });
        s.append(shape("line", { x1: L, x2: R, y1: B, y2: B, stroke: DIMS }));
        f.tree.ticks.forEach(([t, day]) => s.append(shape("text", { x: X(t), y: B + 17, "font-size": 11, fill: DIMS, "text-anchor": t === 0 ? "start" : t === n ? "end" : "middle" }, day)));
        s.append(shape("path", { d: `${path(pct["25"].map((v, d) => [X(d), Y(v)]))}L${pct["75"].slice().reverse().map((v, d) => `${X(n - d)} ${Y(v)}`).join("L")}Z`, fill: color, opacity: .22 }));
        s.append(shape("path", { d: path(pct["50"].map((v, d) => [X(d), Y(v)])), fill: "none", stroke: color, "stroke-width": 1.4, "stroke-linejoin": "round" }));
        if (actual.length) {
          const points = actual.map((v, d) => [X(d), Y(v)]), lineStyle = { fill: "none", "stroke-linejoin": "round", "stroke-linecap": "round" };
          s.append(shape("path", { d: path(points), ...lineStyle, stroke: "rgba(0, 0, 0, .6)", "stroke-width": 3.2 }));
          s.append(shape("path", { d: path(points), ...lineStyle, stroke: PRICE, "stroke-width": 1.6 }));
          const dot = tail ? [X(tail[0]), Y(tail[1])] : points[points.length - 1];
          if (tail) s.append(shape("path", { d: path([points[points.length - 1], dot]), ...lineStyle, stroke: PRICE, "stroke-width": 1.6, "stroke-dasharray": "2 2" }));
          s.append(shape("circle", { cx: dot[0], cy: dot[1], r: 2.5, fill: PRICE }));
        }
        s.append(shape("text", { x: L, y: Y(0) - 4, "font-size": 11, fill: DIMS, "pointer-events": "none" }, "0%"));
        scale = { X, Y, values: s.appendChild(shape("g", { "pointer-events": "none" })) };
        s.append(...hits);
        mark();
      };
      return {
        box: c.box,
        show(f) {
          if (frame?.day !== f.day) pick = null;
          frame = f;
          draw();
        },
      };
    })();

    // 권장 추종 배율: 경로마다의 평균 배율 분포를 오늘 판단(판단 색)과 이슈가 없을 때의 기준(회색)으로 그리고, 평균 배율에 세로선을 긋는다.
    const chart = (() => {
      const c = card("지수 추종 = 1.0"), s = c.svg;
      const L = 6, R = W - 6, T = 22;
      return {
        box: c.box,
        show(f) {
          const den = f.chart, n = den.points, m = 1 + den.mean;
          c.head(f, "", m.toFixed(3));
          const xs = Array.from({ length: n }, (_, i) => 1 + den.low + (den.high - den.low) * i / (n - 1));
          const X = (v) => L + (v - xs[0]) / (xs[n - 1] - xs[0]) * (R - L), peak = Math.max(...den.today, ...den.quiet);
          const Y = (v) => B - v / peak * (B - T);
          const curve = (values) => path(values.map((v, i) => [X(xs[i]), Y(v)]));
          const area = (values) => `M${X(xs[0])} ${B}L${values.map((v, i) => `${X(xs[i])} ${Y(v)}`).join("L")}L${X(xs[n - 1])} ${B}Z`;
          s.replaceChildren();
          s.append(shape("path", { d: area(den.quiet), fill: "rgba(167, 171, 176, .14)" }));
          s.append(shape("path", { d: curve(den.quiet), fill: "none", stroke: "rgba(167, 171, 176, .5)", "stroke-width": 1 }));
          s.append(shape("path", { d: area(den.today), fill: color, opacity: .2 }));
          s.append(shape("path", { d: curve(den.today), fill: "none", stroke: color, "stroke-width": 1.4, "stroke-linejoin": "round" }));
          s.append(shape("line", { x1: X(1), x2: X(1), y1: T, y2: B, stroke: "#A7ABB0", "stroke-width": 1, "stroke-dasharray": "2 3" }));
          s.append(shape("line", { x1: X(m), x2: X(m), y1: T, y2: B, stroke: color, "stroke-width": 1.6 }));
          s.append(shape("line", { x1: L, x2: R, y1: B, y2: B, stroke: DIMS }));
          [[0.5, "E 큰 하락"], [0.75, "D 하락"], [1, "C 횡보"], [1.25, "B 상승"], [1.5, "A 큰 상승"]].forEach(([v, text]) => {
            s.append(shape("line", { x1: X(v), x2: X(v), y1: B, y2: B + 4, stroke: DIMS }));
            s.append(shape("text", { x: X(v), y: B + 18, "font-size": 11, fill: Math.abs(v - m) < 0.125 ? "#EAEAEA" : DIMS, "text-anchor": "middle" }, text));
          });
        },
      };
    })();

    const parts = [predict, tree, chart];
    const show = (frame) => parts.forEach((part) => part.show(frame));
    show(data);
    return { names: ["주가와 예측", "몬테카를로", "권장 추종 배율"], slides: parts.map((part) => [part.box]), show };
  }

  // 그림 카드 묶음 아래에 지난 판단 날짜로 되감는 슬라이더를 둔다(build.py `r/rewind-{지수}/cards.json`). 리포트 날짜와 그 앞 날짜만
  // 고를 수 있고, 리포트 날짜가 되감기 범위에 없으면 슬라이더를 두지 않는다. 날짜를 고르면 그날 판단으로 카드 세 장을 다시 그린다.
  function cardRewind(box, date, set) {
    fetch(`r/rewind-${key.split("-")[1]}/cards.json`, { cache: "no-cache" }).then((r) => (r.ok ? r.json() : null)).then((data) => {
      if (!data) return;
      const frames = data.frames.filter((frame) => frame.day <= date && rewindOffset(frame.day, date) >= 0);
      const start = frames.findIndex((frame) => frame.day === date);
      if (start < 0) return;
      let drawn = start, frame = 0;
      const draw = () => { frame = 0; set.show(frames[drawn]); };
      dial(box, date, frames.map((f) => f.day), start, (i) => {
        if (i === drawn) return;
        drawn = i;
        if (!frame) frame = requestAnimationFrame(draw);
      });
    }).catch(() => {});
  }

  // 이슈 제목의 방향 표식을 가려내 칠하고, 나머지 표식인 이벤트 중요도는 지운다. 중요도는 `build.py`가 소제목에 단 `data-level`로 그린다.
  const TONES = { "상승 요인": "tone-up", "하락 요인": "tone-down", "양방향": "tone-both" };
  function toneTags(scope) {
    scope.querySelectorAll("h3 code").forEach((tag) => {
      const tone = TONES[tag.textContent.trim()];
      if (tone) tag.classList.add(tone);
      else tag.remove();
    });
  }
  // 소제목의 방향 표식은 제목 끝으로 옮긴다.
  function trail(h3) {
    const codes = [...h3.querySelectorAll("code")];
    if (codes.length) {
      const tags = document.createElement("span");
      tags.className = "tags";
      tags.append(...codes);
      h3.append(Object.assign(document.createElement("span"), { className: "gap", textContent: " " }), tags);
    }
    h3.normalize();
    h3.childNodes.forEach((node) => { if (node.nodeType === 3) node.textContent = node.textContent.replace(/\s+$/, ""); });
  }

  // 상세 이슈 해설을 이슈 목록으로 바꾼다. 이슈는 `###` 제목부터 다음 `###`·`##` 앞까지다.
  // 템플릿이 검토했지만 비중을 낮춘 이슈를 번호 이슈 뒤에 두므로, 그 항목은 목록 끝의 "비중이 낮은 이슈 N건" 상자가 된다.
  // 상자를 누르면 주소의 `issue`에 그 이슈 번호를 적어 이슈 화면을 새 페이지로 연다. 이슈 번호는 소제목 앞 번호이고, 번호가 없는 상자는 목록 순서다.
  // `focus`가 있으면 이슈 화면이다. 그 번호의 이슈 내용과 절 제목만 남기고 리포트의 다른 절은 지운다. 그 번호의 이슈가 없으면 리포트 화면을 다시 연다.
  // 절 제목 오른쪽의 돌아가는 단추를 누르면 앞 페이지로 돌아가고, 앞 페이지가 없으면 같은 리포트의 리포트 화면을 연다.
  // `at`이 있으면 히스토리에서 그 날짜 항목을 고른 채로 연다.
  // 검토했지만 비중을 낮춘 이슈를 보는 동안에는 절 제목을 "검토했지만 비중을 낮춘 이슈"로 바꾼다.
  function section(title, focus = 0, at = null) {
    const head = [...report.querySelectorAll("h2")].find((h) => h.textContent.trim() === title);
    if (!head) return;
    const name = head.textContent.trim();
    // 절 제목 글자만 바꾸도록 글자를 따로 감싼다.
    const label = Object.assign(document.createElement("span"), { textContent: name });
    head.replaceChildren(label);
    const items = [];
    for (let node = head.nextElementSibling; node && node.tagName !== "H2"; node = node.nextElementSibling) {
      if (node.tagName === "H3") {
        items.push([node]);
      } else if (items.length) {
        items[items.length - 1].push(node);
      }
    }
    if (!items.length) return;
    // 이슈 제목 앞의 번호를 지운다.
    const unnumber = (h3) => {
      const text = [...h3.childNodes].find((node) => node.nodeType === 3 && node.textContent.trim());
      if (text) text.textContent = text.textContent.replace(/^\s*\d+\.\s*/, "");
    };
    const numbers = items.map(([h3], i) => +h3.textContent.match(/^\s*(\d+)\./)?.[1] || i + 1);
    items.forEach(([h3]) => unnumber(h3));
    const other = "검토했지만 비중을 낮춘 이슈", reviewed = items[items.length - 1][0].textContent.trim() === other;
    if (reviewed) items[items.length - 1].shift().remove();
    // 방향 표식의 등락 화살표. 선의 끝 방향으로 화살촉을 단다.
    const tip = ([x0, y0], [x, y]) => {
      const a = Math.atan2(y - y0, x - x0), wing = (t) => `${(x - 4.2 * Math.cos(a + t)).toFixed(2)} ${(y - 4.2 * Math.sin(a + t)).toFixed(2)}`;
      return `M${wing(0.6)} L${x} ${y} L${wing(-0.6)}`;
    };
    const arrows = {
      "tone-up": `M2 15 L6.5 8 L10 11 L16 3 ${tip([10, 11], [16, 3])}`,
      "tone-down": `M2 3 L6.5 10 L10 7 L16 15 ${tip([10, 7], [16, 15])}`,
      "tone-both": `M2 9 H6 C9.5 9 11 3.5 16 3.5 M6 9 C9.5 9 11 14.5 16 14.5 ${tip([12.5, 3.9], [16, 3.5])} ${tip([12.5, 14.1], [16, 14.5])}`,
    };
    const arrow = (tone) => `<svg class="${tone}" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="${arrows[tone]}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    // `step`은 이슈 화면에서 이웃 이슈로 넘기는 함수이고, `busy`는 넘기는 동안 켠다.
    let busy = false, step = null;
    const box = document.createElement("div");
    box.className = "issue-box";
    const list = box.appendChild(document.createElement("div"));
    list.className = "issue-list";
    const pages = items.map((nodes, i) => {
      const image = nodes.find((node) => node.matches?.("figure.issue-image"));
      const pick = list.appendChild(document.createElement("div"));
      const text = document.createElement("div");
      text.className = "text";
      if (reviewed && i === items.length - 1) {
        pick.className = "pick more";
        const names = [...(nodes[0]?.querySelectorAll("li") ?? [])].map((li) => (li.querySelector("strong") ?? li).textContent.trim());
        text.append(Object.assign(document.createElement("h3"), { textContent: `비중이 낮은 이슈 ${names.length}건` }));
        text.append(Object.assign(document.createElement("p"), { textContent: names.slice(0, 3).join(", ") + (names.length > 3 ? "\u00a0등" : "") }));
        pick.append(Object.assign(document.createElement("div"), { className: "lead" }));
        pick.lastChild.append(Object.assign(document.createElement("span"), { className: "num" }), text);
      } else {
        pick.className = "pick";
        if (nodes[0].dataset.event) pick.dataset.event = nodes[0].dataset.event;
        const title = nodes[0].cloneNode(true);
        title.removeAttribute("id");
        text.append(title);
        const now = nodes.map((node) => (node.tagName === "H4" ? node : node.querySelector?.("h4"))).find((h4) => ["이슈 해설", "현재 상태"].includes(h4?.querySelector("mark")?.textContent.trim()));
        if (now) text.append(Object.assign(document.createElement("p"), { textContent: [...now.childNodes].filter((n) => n.nodeName !== "MARK").map((n) => n.textContent).join("").trim() }));
        // 이슈 해설의 소제목은 목록 상자에만 쓰고, 이슈 문단에서는 말머리만 남긴다. 현재 상태 소제목은 접는 문단의 제목이므로 그대로 둔다.
        if (now?.querySelector("mark").textContent.trim() === "이슈 해설") [...now.childNodes].filter((n) => n.nodeName !== "MARK").forEach((n) => n.remove());
        const num = Object.assign(document.createElement("span"), { className: "num", textContent: i + 1 });
        const tone = [...title.querySelectorAll("code")].map((code) => Object.keys(arrows).find((t) => code.classList.contains(t))).find(Boolean);
        title.querySelectorAll("code").forEach((code) => code.remove());
        if (tone) num.insertAdjacentHTML("beforeend", arrow(tone));
        pick.append(Object.assign(document.createElement("div"), { className: "lead" }));
        pick.lastChild.append(num, text);
        if (image?.dataset.thumb) pick.append(Object.assign(document.createElement("img"), { className: "thumb", src: image.dataset.thumb, alt: "" }));
      }
      // 이슈 상자를 누르고 있는 동안 상자를 3% 줄인다. 손을 떼면 원래 크기로 돌리고, 누름으로 판정되면 진동을 내고 그 이슈를 연다.
      // 누른 채 화면을 밀어 누름이 취소되거나 손가락이 상자 밖으로 나가면 원래 크기로 돌린다.
      pick.addEventListener("pointerdown", () => pick.classList.add("pressed"), { passive: true });
      ["pointerup", "pointercancel", "pointerleave"].forEach((type) => pick.addEventListener(type, () => pick.classList.remove("pressed"), { passive: true }));
      pick.addEventListener("click", () => {
        feelPress();
        visit(key, { issue: numbers[i] });
      });
      const page = box.appendChild(document.createElement("div"));
      page.className = "issue-page";
      page.append(...nodes);
      const past = nodes.find((node) => node.matches?.("template.issue-history"));
      if (past) Object.assign(page, chronicle(page, past));
      return page;
    });
    // 이슈 문단마다 끝에 앞 이슈와 다음 이슈로 가는 칸을 붙인다. 검토했지만 비중을 낮춘 이슈 묶음은 이어 읽는 이슈에 넣지 않는다.
    // 칸에는 그 이슈의 그림과 목록 상자의 제목을 쓰고, 그림이 없는 이슈는 같은 크기의 빈 띠를 두고, 그림이 하나도 없는 리포트는 꼬리표와 제목만 쓴다. 칸을 누르면 진동을 내고 그 이슈로 넘긴다.
    const chain = reviewed ? pages.length - 1 : pages.length;
    const framed = pages.slice(0, chain).some((page) => page.querySelector(":scope > figure.issue-image img"));
    const pass = (i, k, side) => {
      if (k < 0 || k >= chain) return document.createElement("span");
      const cell = document.createElement("button");
      cell.type = "button";
      cell.className = side;
      const tag = Object.assign(document.createElement("span"), { className: "tag", textContent: side === "prev" ? "‹ 이전" : "다음 ›" });
      const src = pages[k].querySelector(":scope > figure.issue-image img")?.getAttribute("src");
      if (framed) {
        const shot = cell.appendChild(Object.assign(document.createElement("div"), { className: "shot" }));
        if (src) shot.append(Object.assign(document.createElement("img"), { className: "thumb", src, alt: "", loading: "lazy" }));
        shot.append(tag);
      } else {
        cell.append(tag);
      }
      cell.append(Object.assign(document.createElement("span"), { className: "title", textContent: list.children[k].querySelector("h3").textContent.trim() }));
      cell.addEventListener("pointerdown", () => cell.classList.add("pressed"), { passive: true });
      ["pointerup", "pointercancel", "pointerleave"].forEach((type) => cell.addEventListener(type, () => cell.classList.remove("pressed"), { passive: true }));
      cell.addEventListener("click", () => {
        if (busy) return;
        feelPress();
        step(i, k);
      });
      return cell;
    };
    pages.slice(0, chain).forEach((page, i) => {
      const nav = page.appendChild(document.createElement("nav"));
      nav.className = "step";
      nav.append(pass(i, i - 1, "prev"), pass(i, i + 1, "next"));
    });
    // 이슈 해설 말머리 앞에 히스토리 상자를 넣는다. `build.py`가 넣은 `issue-history` 템플릿에는 같은 이슈를 다룬 앞 날짜 리포트의 이슈 조각과
    // 날짜마다 이슈 해설 소제목이 날짜 순으로 들고, 마지막 항목이 오늘이다. 상자에는 날짜와 소제목을 오늘부터 앞 날짜 순으로 한 줄씩 쓰고 보고 있는 날짜의 줄을 굵게 쓴다.
    // 최근 세 줄 아래의 앞선 줄은 접어 두고, 상자 아래 끝의 펼침 단추를 누르면 다섯 줄과 여섯째 줄 윗부분까지 펼친 뒤 나머지 줄은 목록 안에서 스크롤하게 한다.
    // 최근 세 줄을 누르면 앞선 줄을 다시 접고, 앞선 줄을 누르면 펼친 채 둔다.
    // 줄을 누르면 진동을 내고, 상자 위의 제목·그림과 상자 아래의 해설·그래프를 그날 내용으로 바꿔 서서히 보이며 화면을 맨 위로 옮긴다.
    // 돌려준 `restore`는 이슈 문단을 오늘 내용으로 돌리고 앞선 줄을 다시 접으며, 이슈를 열 때마다 부른다.
    // 돌려준 `recall`은 `day` 날짜 항목을 고른다. 그 줄이 접힌 앞선 줄이면 목록을 펼치고 목록 안에서 그 줄이 보이게 스크롤한다.
    function chronicle(page, template) {
      const entries = [...template.content.children], today = entries.length - 1;
      const isLead = (node) => node.tagName === "H4" && node.querySelector("mark")?.textContent.trim() === "이슈 해설";
      // 날짜마다 내용을 상자 위에 둘 노드와 상자 아래에 둘 노드로 나눈다. 이슈 해설 말머리부터 상자 아래에 둔다.
      const split = (nodes) => {
        const cut = nodes.findIndex(isLead);
        return cut < 0 ? [nodes, []] : [nodes.slice(0, cut), nodes.slice(cut)];
      };
      const contents = entries.map((_, k) => (k === today ? split([...page.children].filter((node) => node !== template)) : null));
      const day = (k) => `${+entries[k].dataset.day.slice(5, 7)}/${+entries[k].dataset.day.slice(8)}`;
      const prepare = (k) => {
        const part = document.importNode(entries[k], true);
        toneTags(part);
        const h3 = part.querySelector("h3");
        if (h3) { unnumber(h3); trail(h3); }
        const lead = [...part.children].find(isLead);
        if (lead) [...lead.childNodes].filter((n) => n.nodeName !== "MARK").forEach((n) => n.remove());
        part.querySelectorAll("figure.issue-chart[data-card]").forEach((figure) => figure.append(gauge(JSON.parse(figure.dataset.card))[0]));
        part.querySelectorAll("img").forEach((img) => img.addEventListener("click", () => viewer(img)));
        return split([...part.children]);
      };
      const heading = document.createElement("h4");
      heading.className = "history";
      heading.append(Object.assign(document.createElement("mark"), { textContent: "히스토리" }));
      const shelf = document.createElement("div");
      shelf.className = "history";
      const list = shelf.appendChild(Object.assign(document.createElement("div"), { className: entries.length > 3 ? "rows shut" : "rows" }));
      let current = today;
      // 펼친 목록의 높이. 여섯 줄이 넘으면 여섯째 줄의 윗부분까지만 보인다.
      const PEEK = 22;
      const reach = () => (list.children.length > 6 ? list.children[5].offsetTop + PEEK : list.scrollHeight);
      // 앞선 줄을 다시 접고 펼침 단추를 보인다. 펼쳐 둔 상태에서 최근 세 줄을 누르면 목록을 맨 위로 돌리고 높이를 서서히 줄인 뒤 앞선 줄을 감춘다.
      const fold = (move) => {
        if (!list.classList.contains("open")) return;
        const from = list.offsetHeight;
        list.scrollTop = 0;
        list.classList.remove("open");
        list.style.height = "";
        unfold.hidden = false;
        if (!move || motion.matches) return list.classList.add("shut");
        list.animate([{ height: `${from}px` }, { height: `${list.children[3].offsetTop}px` }], { duration: GLIDE, easing: EASE })
          .finished.then(() => list.classList.contains("open") || list.classList.add("shut"));
      };
      const show = (k, move) => {
        contents[k] ??= prepare(k);
        contents[current].flat().forEach((node) => node.remove());
        heading.before(...contents[k][0]);
        shelf.after(...contents[k][1]);
        rows[current].classList.remove("on");
        rows[k].classList.add("on");
        current = k;
        if (!move) return;
        const options = { duration: motion.matches ? 0 : GLIDE, easing: EASE };
        contents[k].flat().forEach((node) => node.animate([{ opacity: 0 }, { opacity: 1 }], options));
        const release = hush();
        const cancel = () => { stop(); release(); removeEventListener("touchstart", cancel); removeEventListener("wheel", cancel); };
        const stop = glide(scrollY, 0, (top) => scrollTo(0, top), cancel);
        addEventListener("touchstart", cancel, { passive: true });
        addEventListener("wheel", cancel, { passive: true });
      };
      const rows = entries.map((entry, k) => {
        const row = document.createElement("button");
        row.type = "button";
        row.className = k === today ? "entry on" : "entry";
        row.append(Object.assign(document.createElement("span"), { className: "day", textContent: day(k) }),
                   Object.assign(document.createElement("span"), { className: "title", textContent: entry.dataset.title }));
        row.addEventListener("pointerdown", () => row.classList.add("pressed"), { passive: true });
        ["pointerup", "pointercancel", "pointerleave"].forEach((type) => row.addEventListener(type, () => row.classList.remove("pressed"), { passive: true }));
        row.addEventListener("click", () => {
          if (busy || k === current) return;
          feelPress();
          if (k > today - 3) fold(true);
          show(k, true);
        });
        return row;
      });
      // 오늘부터 앞 날짜 순으로 줄을 쌓는다. 접어 둔 목록은 넷째 줄부터 감춘다.
      list.append(...[...rows].reverse());
      const unfold = entries.length > 3 && shelf.appendChild(document.createElement("button"));
      if (unfold) {
        unfold.type = "button";
        unfold.className = "unfold";
        unfold.innerHTML = `이전 해설 ${today - 2}개 펼치기<svg width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
        unfold.addEventListener("click", () => {
          feelPress();
          const from = list.offsetHeight;
          open();
          list.animate([{ height: `${from}px` }, { height: `${reach()}px` }], { duration: motion.matches ? 0 : GLIDE, easing: EASE });
        });
      }
      // 앞선 줄을 펼치고 목록 높이를 펼친 높이로 둔다.
      const open = () => {
        list.classList.remove("shut");
        list.classList.add("open");
        unfold.hidden = true;
        list.style.height = `${reach()}px`;
      };
      contents[today][0].at(-1).after(heading, shelf);
      return {
        restore: () => {
          if (current !== today) show(today, false);
          fold(false);
        },
        recall: (day) => {
          const k = entries.findIndex((entry) => entry.dataset.day === day);
          if (k < 0) return;
          if (k <= today - 3) {
            open();
            list.scrollTop += rows[k].getBoundingClientRect().top - list.getBoundingClientRect().top - (list.clientHeight - rows[k].offsetHeight) / 2;
          }
          if (k !== current) show(k, false);
        },
      };
    }
    head.classList.add("issues");
    head.after(box);
    if (!focus) return;
    const shown = numbers.indexOf(focus);
    if (shown < 0) {
      const params = new URLSearchParams(location.search);
      params.delete("issue");
      params.delete("at");
      location.replace(`?${params}`);
      return;
    }
    [...report.children].forEach((node) => node === head || node === box || node.remove());
    const back = head.appendChild(document.createElement("button"));
    back.className = "back";
    back.innerHTML = '<svg width="8" height="12" viewBox="0 0 8 12" aria-hidden="true"><path d="M6.5 1 1.5 6l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    // 절 제목 글자로 절을 찾는 곳이 있으므로 단추 이름은 글자 대신 CSS로 쓴다.
    back.setAttribute("aria-label", "이슈 목록");
    back.addEventListener("click", () => {
      feelPress();
      if (depth > 0) return history.back();
      const params = new URLSearchParams(location.search);
      params.delete("issue");
      params.delete("at");
      location.replace(`?${params}`);
    });
    // 단추 가운데를 절 제목 글자 획의 위아래 가운데에 맞춘다. 글꼴마다 글자 줄 안에서 획이 놓이는 높이가 달라서, 기준선 위치와 그 글꼴로 잰 획의 높이로 정한다.
    const ink = document.createElement("canvas").getContext("2d");
    const align = () => {
      const probe = label.appendChild(Object.assign(document.createElement("i"), { style: "display: inline-block; width: 0; height: 0" }));
      const base = probe.getBoundingClientRect().bottom;
      probe.remove();
      const style = getComputedStyle(label);
      ink.font = `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
      const { actualBoundingBoxAscent: up, actualBoundingBoxDescent: down } = ink.measureText(label.textContent);
      const rect = back.getBoundingClientRect(), now = parseFloat(back.style.getPropertyValue("--shift")) || 0;
      back.style.setProperty("--shift", `${now + base - (up - down) / 2 - (rect.top + rect.height / 2)}px`);
    };
    new ResizeObserver(align).observe(head);
    document.fonts?.ready.then(align);
    const bar = document.getElementById("issue-bar");
    const rename = (next) => {
      if (label.textContent === next) return;
      label.textContent = next;
      label.animate([{ opacity: 0 }, { opacity: 1 }], { duration: motion.matches ? 0 : GLIDE });
    };
    // `i`번째 이슈 문단을 보이고, 히스토리를 오늘 내용으로 돌리고 접기 상자를 모두 닫는다.
    const enter = (i) => {
      pages.forEach((page, j) => page.classList.toggle("on", i === j));
      pages[i].restore?.();
      pages[i].querySelectorAll("details.fold").forEach((fold) => {
        fold.anim?.cancel();
        fold.want = undefined;
        fold.open = false;
        fold.lastElementChild.style.overflow = "";
      });
      rename(reviewed && i === pages.length - 1 ? other : name);
      align();
      // 위쪽 한 줄 띠에는 이슈 제목만 쓰고 방향 표식은 뺀다. 비중을 낮춘 이슈 묶음은 묶음 이름을 쓴다.
      const title = reviewed && i === pages.length - 1 ? other : (() => {
        const copy = items[i][0].cloneNode(true);
        copy.querySelectorAll("code, .tags").forEach((node) => node.remove());
        return copy.textContent.trim();
      })();
      if (bar.textContent !== title) {
        bar.textContent = title;
        bar.animate([{ opacity: 0 }, { opacity: 1 }], { duration: motion.matches ? 0 : GLIDE });
      }
      return pages[i];
    };
    box.classList.add("inside");
    head.classList.add("inside");
    enter(shown);
    if (at) pages[shown].recall?.(at);
    // 보고 있는 `i`번째 이슈에서 `k`번째 이슈로 넘기고 주소의 이슈 번호를 바꾼다. 다음 이슈는 오른쪽에서, 앞 이슈는 왼쪽에서 들어온다.
    // 나가는 이슈와 들어오는 이슈를 장 사이 10px을 두고 나란히 옮기며, 동시에 화면을 맨 위로 옮긴다. 옮기는 동안 묶음 높이를 지금 높이 아래로 줄이지 않아 화면이 튀지 않는다.
    // 화면 옮기기와 묶음 높이 되돌리기가 모두 끝나야 방향 판정을 다시 켠다.
    step = (i, k) => {
      if (busy) return;
      busy = true;
      const dir = k > i ? 1 : -1, out = pages[i];
      const params = new URLSearchParams(location.search);
      params.set("issue", numbers[k]);
      params.delete("at");
      history.replaceState(history.state, "", `?${params}`);
      box.style.minHeight = `${box.offsetHeight}px`;
      box.classList.add("moving");
      out.classList.add("leaving");
      const shown = enter(k);
      const options = { duration: motion.matches ? 0 : GLIDE, easing: EASE };
      out.animate([{ transform: "none" }, { transform: `translateX(calc(${-dir} * (100% + 10px)))` }], options);
      shown.animate([{ transform: `translateX(calc(${dir} * (100% + 10px)))` }, { transform: "none" }], options);
      const release = hush();
      let left = 2;
      const settle = () => --left || release();
      const cancel = () => { stop(); release(); removeEventListener("touchstart", cancel); removeEventListener("wheel", cancel); };
      const stop = glide(scrollY, 0, (top) => scrollTo(0, top), settle);
      addEventListener("touchstart", cancel, { passive: true });
      addEventListener("wheel", cancel, { passive: true });
      setTimeout(() => {
        out.classList.remove("leaving");
        box.classList.remove("moving");
        box.style.minHeight = "";
        removeEventListener("touchstart", cancel);
        removeEventListener("wheel", cancel);
        busy = false;
        settle();
      }, options.duration);
    };
  }

  // 절 안의 `###`(depth 3)이나 `####`(depth 4) 소제목마다 접기 상자를 만든다. 말머리가 `keep`에 든 소제목은 접지 않는다.
  const level = (node) => (/^H\d$/.test(node.tagName) ? +node.tagName[1] : 9);
  function fold(title, depth = 3, keep = []) {
    const head = [...report.querySelectorAll("h2")].find((h) => h.textContent.trim() === title);
    if (!head) return;
    const heads = [];
    for (let node = head.nextElementSibling; node && node.tagName !== "H2"; node = node.nextElementSibling) {
      if (level(node) === depth && !keep.includes(node.querySelector("mark")?.textContent.trim())) heads.push(node);
    }
    wrap(heads, depth);
  }
  // 소제목마다 소제목만 보이는 접기 상자를 만들고, 같은 깊이나 더 얕은 다음 소제목 앞까지의 노드를 그 안에 넣는다.
  function wrap(heads, depth) {
    heads.forEach((h3) => {
      const box = document.createElement("details");
      box.className = "fold";
      const summary = document.createElement("summary");
      h3.before(box);
      let node = h3.nextElementSibling;
      summary.appendChild(h3);
      const body = Object.assign(document.createElement("div"), { className: "body" });
      box.append(summary, body);
      while (node && level(node) > depth) {
        const next = node.nextElementSibling;
        body.appendChild(node);
        node = next;
      }
      summary.addEventListener("click", (event) => {
        event.preventDefault();
        setFold(box, !(box.want ?? box.open));
      });
      // 펼친 내용을 누르면 접는다. 그림과 링크를 누른 경우, 누른 채 10px 넘게 움직인 경우, 글자를 고른 경우는 접지 않는다.
      // 소제목이 머리 상자 띠 밑으로 지나가 있으면 접기 전에 소제목을 띠 바로 아래로 옮긴다.
      let down = null;
      body.addEventListener("pointerdown", (event) => { down = [event.clientX, event.clientY]; }, { passive: true });
      body.addEventListener("click", (event) => {
        const moved = down && Math.hypot(event.clientX - down[0], event.clientY - down[1]) > 10;
        down = null;
        if (moved || event.target.closest("img, a, button") || String(getSelection()).trim()) return;
        const cover = masthead.getBoundingClientRect().bottom + 9, above = summary.getBoundingClientRect().top - cover;
        if (above < 0) scrollBy({ top: above, behavior: motion.matches ? "instant" : "smooth" });
        setFold(box, false);
      });
    });
  }
  // 접기 상자의 내용 높이와 투명도를 지금 값에서 목표 값까지 이어서 바꾼다. 움직이는 중에 다시 누르면 그 자리에서 방향을 바꾸고,
  // 다 닫힌 뒤에야 상자를 닫는다. 넘기는 묶음 안에서는 움직이는 동안 묶음 높이가 매 프레임 내용 높이를 따라가게 한다.
  function setFold(box, open) {
    if ((box.want ?? box.open) === open) return;
    if (open) feelPress();
    box.want = open;
    const body = box.lastElementChild, carousel = box.closest(".carousel.fit");
    const start = box.open ? body.getBoundingClientRect().height : 0;
    box.anim?.cancel();
    box.open = true;
    const full = body.scrollHeight, end = open ? full : 0;
    body.style.overflow = "hidden";
    carousel?.classList.add("folding");
    const anim = (box.anim = body.animate(
      [{ height: `${start}px`, opacity: full ? start / full : 1 }, { height: `${end}px`, opacity: open ? 1 : 0 }],
      { duration: motion.matches ? 0 : 280, easing: "cubic-bezier(.25, .8, .25, 1)" },
    ));
    anim.onfinish = () => {
      box.anim = null;
      body.style.overflow = "";
      if (!open) box.open = false;
      carousel?.classList.remove("folding");
    };
  }
