<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
<title>투자 판단 리포트</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* 리포트 그림과 같은 검은 바탕으로 그리고, 텔레그램 테마 색은 쓰지 않는다. 글자는 눈부시지 않게 채도를 낮춘 색을 쓴다. */
  :root {
    color-scheme: dark;
    --bg: #000000;
    --text: #e7edf3;
    --hint: #7d8b99;
    --accent: #8fb8e8;
    --line: #3A3F4A;
    --soft: #111318;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 15px/1.7 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    word-break: keep-all; overflow-wrap: anywhere; -webkit-text-size-adjust: 100%;
  }
  /* `--offscreen`은 낮은 시트에서 화면 아래로 나가 있는 웹뷰 높이다. 문서 끝에 그만큼 여백을 더해 마지막 줄까지 내려 볼 수 있게 한다. */
  main { max-width: 720px; margin: 0 auto; padding: 16px 16px calc(40px + var(--offscreen, 0px)); }
  header h1 { font-size: 19px; line-height: 1.4; margin: 4px 0 2px; color: var(--accent); }
  header p { margin: 0; font-size: 12.5px; color: var(--hint); }
  /* 날짜 줄 아래 등락률 줄은 같은 회색 글씨로 쓰고, 제목과 날짜 줄 사이만큼 띄운다. 등락률만 오르면 빨강, 내리면 파랑으로 칠한다. 첫 절 제목과는 조금 더 띄운다. */
  header #moves { margin-top: 1.5px; }
  header #moves:empty { display: none; }
  header #moves b { font-weight: 700; margin-left: 4px; }
  header #moves .up { color: #ff5c5c; }
  header #moves .down { color: #5b9bff; }
  header #moves .sep { margin-left: 12px; }
  header:has(#moves:not(:empty)) + #report > h2:first-child { margin-top: 36px; }
  h2 { font-size: 17px; color: var(--accent); margin: 40px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  #report > h2:first-child { margin-top: 28px; }
  h3 { font-size: 15.5px; line-height: 1.5; margin: 22px 0 6px; color: var(--accent); }
  p { margin: 0 0 12px; }
  ul { padding-left: 1.2em; margin: 0 0 12px; }
  li { margin-bottom: 6px; }
  strong { color: var(--accent); }
  img { display: block; width: 100%; height: auto; margin: 12px 0; border-radius: 10px; background: var(--bg); cursor: zoom-in; }
  .viewer { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; overflow: hidden; touch-action: none;
            background: rgba(0, 0, 0, .94); }
  .viewer img { margin: 0; border-radius: 0; transform-origin: 0 0; cursor: zoom-out; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; line-height: 1.55; margin: 8px 0 16px; }
  th, td { text-align: left; vertical-align: top; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--hint); font-weight: 600; font-size: 12.5px; }
  table.events td.branch { width: 34%; font-weight: 600; }
  table.events td.chance { width: 3.2em; text-align: right; font-weight: 700; color: var(--accent); white-space: nowrap; }
  table.events td.chance small.delta { display: block; font-size: 0.68em; font-weight: 600; line-height: 1.2; margin-top: 1px; }
  table.events td.chance small.up { color: #ff5c5c; }
  table.events td.chance small.down { color: #5b9bff; }
  table.events td.chance small.flat { color: #9aa0a6; font-weight: 500; }
  .status { color: var(--hint); text-align: center; padding: 48px 0; }
  /* 요약 소제목과 이슈 문단 앞 말머리는 이벤트 발표 시각과 같은 회색 글자로 제목·문단 위 한 줄에 둔다.
     소제목의 표식은 제목 아래 한 줄에 모아, 방향 표식은 색을 채운 스티커, 중요도 표식은 바탕 없는 테두리 스티커로 그린다.
     제목과 표식 줄 사이는 말머리·발표 시각과 제목 사이만큼 띄운다. */
  mark { display: block; background: none; color: var(--hint); font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  h3 code { font-family: inherit; font-size: 10.5px; font-weight: 700; color: #8b95a1; background: none; border: 1px solid;
            border-radius: 999px; padding: 0.5px 7px; margin-right: 5px; white-space: nowrap; }
  h3 .tags { display: block; line-height: 1; margin: 2.5px 0 14px; }
  h3 code.lv-high { color: #d1495b; }
  h3 code.lv-mid { color: #d98e04; }
  h3 code.tone-up, h3 code.tone-down, h3 code.tone-both { color: #fff; border: 0; padding: 1.5px 8px; }
  h3 code.tone-up { background: #d1495b; }
  h3 code.tone-down { background: #5b9bff; }
  h3 code.tone-both { background: #8b95a1; }
  .carousel { margin: 12px 0 4px; }
  /* 한 번 넘기면 한 장씩 멈추고, 세로 움직임은 페이지가 받는다. */
  .carousel .track { display: flex; gap: 10px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory;
                     overscroll-behavior-x: contain; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .carousel .track::-webkit-scrollbar { display: none; }
  .carousel .slide { flex: 0 0 100%; scroll-snap-align: start; scroll-snap-stop: always; }
  .carousel .slide img { margin: 0; }
  .carousel .dots { display: flex; justify-content: center; gap: 6px; margin-top: 8px; }
  .carousel .dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
  .carousel .dots span.on { background: var(--accent); }
  .carousel .slide canvas.live { display: block; width: 100%; height: auto; border-radius: 10px; background: var(--bg); cursor: zoom-in; }
  .carousel .rewind { position: relative; margin-top: 12px; }
  .carousel .rewind + .dots { margin-top: 12px; }
  .carousel .rewind input { display: block; width: 100%; height: 20px; margin: 0; background: none; -webkit-appearance: none; appearance: none; }
  .carousel .rewind input { --track: linear-gradient(to right, rgba(58, 63, 74, .35) calc(9px + var(--from, 0) * (100% - 18px)), var(--line) 0); }
  .carousel .rewind input::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--track); }
  .carousel .rewind input::-moz-range-track { height: 4px; border-radius: 2px; background: var(--track); }
  .carousel .rewind input::-webkit-slider-thumb { width: 18px; height: 10px; margin-top: -3px; border: 0; border-radius: 5px; background: var(--accent); -webkit-appearance: none; appearance: none; }
  .carousel .rewind input::-moz-range-thumb { width: 18px; height: 10px; border: 0; border-radius: 5px; background: var(--accent); }
  .carousel .rewind span { position: absolute; bottom: calc(100% + 4px); padding: 3px 8px; border-radius: 6px; background: rgba(72, 78, 90, .72); color: #FFFFFF;
    font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; transform: translateX(-50%);
    opacity: 0; transition: opacity .15s ease; pointer-events: none; }
  .carousel .rewind span::after { content: ""; position: absolute; top: 100%; left: calc(50% + var(--tail, 0px)); margin-left: -5px; border: 5px solid transparent; border-top-color: rgba(72, 78, 90, .72); }
  .carousel .rewind.held span { opacity: 1; }
  /* 절 제목 아래 첫 요소는 절 제목의 아래 여백만큼 띄우고, 절 안의 항목 사이는 30px씩 띄운다.
     1개월 지수 방향 예측 절의 세 소제목 사이는 이슈 문단 사이만큼 띄운다. */
  /* 1개월 지수 방향 예측 절의 세 문단은 소제목만 보이고, 소제목을 누르면 문단이 펼쳐진다.
     펼친 소제목과 문단 사이는 표식이 없는 소제목의 아래 여백(다가오는 이벤트의 소제목과 표 사이)만큼 띄운다. */
  details.fold > summary { list-style: none; cursor: pointer; }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold { margin-top: 15.5px; }
  .carousel + details.fold { margin-top: 30px; }
  details.fold > summary h3 { margin: 0; }
  details.fold[open] > summary h3 { margin-bottom: 6px; }
  details.fold > :not(summary) { margin-top: 0; }
  /* 주요 이슈 해설과 다가오는 이벤트는 항목 하나씩 넘기고, 넘기기가 멈추면 높이를 그 항목에 맞춘다. */
  .carousel.fit .track { align-items: flex-start; transition: height .2s ease; }
  .carousel.fit .slide h3:first-child { margin-top: 0; }
  /* 다가오는 이벤트는 발표일마다 한 장이고, 위 날짜 띠에서 보고 있는 날짜만 흰색이다. 날짜 띠가 화면 폭을 넘으면
     보고 있는 날짜가 화면 안에 들어오도록 띠를 옆으로 민다. */
  .days { position: relative; overflow: hidden; }
  .days .strip { display: flex; gap: 6px; width: max-content; transition: transform .2s ease; }
  .days button { appearance: none; border: 0; background: none; font: inherit; flex: 0 0 auto; min-width: 50px;
                 padding: 2px 4px; text-align: center; line-height: 1.25; color: var(--hint); cursor: pointer; }
  .days button b { display: block; font-size: 14px; }
  .days button small { display: block; font-size: 11px; }
  .days button.on { color: #fff; }
  /* 날짜 위 점은 그날 이벤트의 중요도를 높음·보통·낮음 순서로 하나씩 찍는다. 5개를 넘으면 중요도마다 점 하나와 개수를 적는다. */
  .days button i { display: flex; justify-content: center; align-items: center; gap: 2px; height: 8px; margin-bottom: 2px;
                   font-style: normal; font-size: 8px; line-height: 1; color: var(--hint); }
  .days button i span { width: 4px; height: 4px; border-radius: 50%; }
  .days button i em { font-style: normal; margin: 0 2px 0 -1px; }
  .days button i .lv-high { background: #d1495b; }
  .days button i .lv-mid { background: #d98e04; }
  .days button i .lv-low { background: #8b95a1; }
  h2.events, h2.issues { scroll-margin-top: 12px; }
  .carousel.events .slide { display: flow-root; }
  .carousel.events .slide h3 { margin: 30px 0 6px; }
  .carousel.events.fit .slide > :first-child { margin-top: 30px; }
  .carousel.events table { margin: 0; }
  h3 .when { display: block; margin-bottom: 2px; font-size: 13px; font-weight: 600; color: var(--hint); }
  /* 지난 이벤트의 표는 실제로 일어난 갈래 줄만 또렷하게 보이고 나머지 줄은 흐리다. */
  table.judged tbody tr { opacity: .28; }
  table.judged tbody tr.hit .outcome { color: var(--accent); }
  table.judged tbody tr.hit { opacity: 1; background: color-mix(in srgb, var(--accent) 13%, transparent);
                              box-shadow: inset 3px 0 0 var(--accent); }
  .empty { border: 1px dashed var(--line); border-radius: 12px; padding: 22px 14px; text-align: center;
           color: var(--hint); font-size: 14px; }
</style>
</head>
<body>
<main>
  <header><h1 id="title">투자 판단 리포트</h1><p id="dated"></p><p id="moves"></p></header>
  <article id="report"><p class="status">리포트를 불러오는 중이다.</p></article>
</main>
<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg && tg.initData) {
    tg.ready();
    // 리포트를 처음부터 시트를 끝까지 올린 높이로 연다.
    tg.expand();
    if (tg.setBackgroundColor) tg.setBackgroundColor("#000000");
    if (tg.setHeaderColor) tg.setHeaderColor("#000000");
    // 좌우로 넘기는 몸짓이 조금 기울어도 시트가 내려가지 않게, 세로로 끌어 닫는 동작을 끈다.
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    // 낮은 시트에서도 웹뷰는 시트를 끝까지 올린 높이로 그려지고 위쪽만 화면에 보인다. 보이는 높이는 `viewportStableHeight`이므로
    // 웹뷰 높이와의 차이를 `--offscreen`에 적고, 시트 높이가 바뀔 때마다 다시 적는다.
    const offscreen = () => {
      const hidden = tg.viewportStableHeight ? Math.max(0, innerHeight - tg.viewportStableHeight) : 0;
      document.documentElement.style.setProperty("--offscreen", `${hidden}px`);
    };
    offscreen();
    tg.onEvent("viewportChanged", offscreen);
    window.addEventListener("resize", offscreen);
  }
  const query = new URLSearchParams(location.search);
  const key = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || query.get("tgWebAppStartParam") || query.get("r") || "";
  const report = document.getElementById("report");
  // 강조색은 지수마다 리포트 그림의 판단 색 계열에서 채도를 낮춘 색을 쓴다(conviction_chart.py JUDGMENT_COLORS).
  const ACCENT = { nasdaq: "#94B8E0", biotech: "#B79BE0" };
  const accent = ACCENT[key.split("-")[1]];
  if (accent) document.documentElement.style.setProperty("--accent", accent);
  const fail = (message) => { report.innerHTML = `<p class="status">${message}</p>`; };

  // 슬라이드마다 노드 목록을 받아 좌우로 넘기는 묶음을 만들고 `after` 뒤에 둔다. 묶음 상자를 돌려준다.
  // `fit`이면 넘기기가 멈춘 뒤와 슬라이드 높이가 바뀐 뒤 묶음 높이를 보고 있는 슬라이드에 맞춘다. `change`가 있으면 아래 점 대신
  // 보고 있는 슬라이드가 바뀔 때마다 그 번호로 `change`를 부르고, `start`번 슬라이드부터 보여 준다.
  // `moved`가 있으면 넘기기가 멈춘 뒤 보고 있는 슬라이드가 바뀌었을 때 그 번호로 부른다.
  // 상자의 `go(i)`는 i번 슬라이드로 넘긴다.
  function slider(slides, after, { fit = false, start = 0, change = null, moved = null, name = "" } = {}) {
    const box = document.createElement("div");
    box.className = ["carousel", fit && "fit", name].filter(Boolean).join(" ");
    box.innerHTML = change ? '<div class="track"></div>' : '<div class="track"></div><div class="dots"></div>';
    const track = box.querySelector(".track"), dots = box.querySelector(".dots");
    slides.forEach((nodes, i) => {
      const slide = document.createElement("div");
      slide.className = "slide";
      nodes.forEach((node) => slide.appendChild(node));
      track.appendChild(slide);
      if (dots) dots.appendChild(Object.assign(document.createElement("span"), { className: i ? "" : "on" }));
    });
    after.after(box);
    const step = () => (slides.length > 1 ? track.children[1].offsetLeft - track.children[0].offsetLeft : 1);
    const current = () => Math.min(slides.length - 1, Math.max(0, Math.round(track.scrollLeft / step())));
    const fitHeight = () => { if (fit) track.style.height = `${track.children[current()].offsetHeight}px`; };
    let timer, shown = start, settled = start;
    track.addEventListener("scroll", () => {
      const now = current();
      if (dots) [...dots.children].forEach((dot, i) => dot.classList.toggle("on", i === now));
      if (change && now !== shown) change((shown = now));
      clearTimeout(timer);
      timer = setTimeout(() => {
        fitHeight();
        if (moved && current() !== settled) moved((settled = current()));
      }, 150);
    }, { passive: true });
    // 화면 폭이 바뀌거나 슬라이드 안의 표식·그림이 나중에 자리를 잡아 슬라이드 높이가 바뀌어도 묶음 높이를 다시 맞춘다.
    if (fit) {
      const watch = new ResizeObserver(fitHeight);
      [...track.children].forEach((slide) => watch.observe(slide));
    }
    box.go = (i) => track.scrollTo({ left: i * step(), behavior: "smooth" });
    track.scrollLeft = start * step();
    if (change) change(start);
    fitHeight();
    return box;
  }

  // 절 제목을 화면 위로 옮긴다. 제목이 이미 화면 위에 있으면 화면을 움직이지 않는다.
  function toTop(head) {
    const gap = head.getBoundingClientRect().top - parseFloat(getComputedStyle(head).scrollMarginTop);
    if (Math.abs(gap) > 2) head.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  // 요약의 Outlook 그림 자리에 6M + Predictions, Montecarlo, Outlook 순서로 넘기는 묶음을 둔다.
  // Montecarlo는 원래 다가오는 이벤트 절에 있으므로 그 자리에서는 뺀다. 6M + Predictions가 없는 리포트는 두 장을 넘긴다.
  function figures(date) {
    const pick = (name) => [...report.querySelectorAll("img")].find((img) => img.getAttribute("src").includes(`/${name}-`));
    const chart = pick("chart"), tree = pick("tree"), predict = pick("predict");
    if (!chart || !tree) return;
    const shown = [predict, tree, chart].filter(Boolean);
    shown.forEach((img) => (img.closest("p") || img).remove());
    const box = slider(shown.map((img) => [img]), report.querySelector("h2"));
    rewind(box, date, { predict, tree, chart });
  }

  // 그림 묶음 아래에 지난 판단 날짜로 되감는 슬라이더를 둔다(build.py `r/rewind-{지수}/frames.json`). 리포트 날짜와 그 앞
  // 날짜만 고를 수 있고, 리포트 날짜가 되감기 범위에 없으면 슬라이더를 두지 않는다.
  // 6M + Predictions는 가장 늦은 리포트의 종가 바탕 위에 고른 날짜의 출발점·50% 선·25~75% 범위를 그린다.
  // Montecarlo는 고른 날짜의 그림 위에 그날 기준 가격 뒤의 실제 종가 수익률을 흰 선으로 그리고, 권장 추종 배율은 그날 그림으로 바꾼다.
  // 종가 선과 실제 종가 수익률은 리포트 날짜 판단의 기준 가격 날짜까지만 그린다. 그 뒤 종가는 리포트를 만든 뒤에 확정됐다.
  // 그림 크기 단위의 선 굵기와 글자 크기는 matplotlib 포인트를 그림 해상도(200dpi)로 옮긴 값이다.
  function rewind(box, date, imgs) {
    const index = key.split("-")[1];
    const load = (src) => new Promise((ok, no) => Object.assign(new Image(), { onload() { ok(this); }, onerror: no, src }));
    const pt = 200 / 72;
    const font = '"Noto Sans CJK KR", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif';
    const mapper = (axes, w, h) => [
      (x) => (axes.left + (x - axes.xlim[0]) / (axes.xlim[1] - axes.xlim[0]) * axes.width) * w,
      (y) => (axes.top + (axes.ylim[1] - y) / (axes.ylim[1] - axes.ylim[0]) * axes.height) * h,
    ];
    // 슬라이더가 움직이는 동안 그림을 끊김 없이 바꾸려고, 그림 대신 같은 자리의 canvas에 바로 그린다.
    // 원래 그림은 숨겨 두고, 슬라이더가 멈추면 canvas 내용을 그림 주소로 옮겨 크게 보기가 같은 그림을 쓰게 한다.
    const surface = (img) => {
      const c = Object.assign(document.createElement("canvas"), { className: "live" });
      c.addEventListener("click", () => img.click());
      return c;
    };
    // 그림 좌표는 원래 그림의 픽셀로 두고, `width`가 있으면 canvas를 그 폭으로 줄여 그린다. `ratio`(높이÷폭)가 있으면
    // canvas를 그 비율로 두고 그림을 세로 가운데에 놓아, 날짜마다 그림 높이가 달라도 묶음 높이가 바뀌지 않게 한다.
    const paint = (c, image, axes, draw, width = image.naturalWidth, ratio = 0) => {
      const w = image.naturalWidth, h = image.naturalHeight, scale = width / w;
      const height = Math.round(Math.max(h * scale, width * ratio));
      if (c.width !== width || c.height !== height) Object.assign(c, { width, height });
      const g = c.getContext("2d");
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.fillStyle = "#000000";
      g.fillRect(0, 0, width, height);
      g.setTransform(scale, 0, 0, scale, 0, (height - h * scale) / 2);
      g.drawImage(image, 0, 0);
      if (!axes) return;
      const [px, py] = mapper(axes, w, h);
      draw(g, px, py, (inside) => {
        g.save();
        g.beginPath();
        g.rect(axes.left * w, axes.top * h, axes.width * w, axes.height * h);
        g.clip();
        inside();
        g.restore();
      });
    };
    const line = (g, points, color, width, dash = []) => {
      g.beginPath();
      points.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
      Object.assign(g, { strokeStyle: color, lineWidth: width, lineJoin: "round", lineCap: "round" });
      g.setLineDash(dash);
      g.stroke();
      g.setLineDash([]);
    };
    const dot = (g, x, y, r, color) => { g.beginPath(); g.arc(x, y, r, 0, 2 * Math.PI); g.fillStyle = color; g.fill(); };
    const label = (day) => `${day.slice(5, 7)}/${day.slice(8, 10)}`;

    // 슬라이더는 리포트 날짜와 그 앞 30일을 늘 같은 폭으로 보여 주고, 레버는 프레임이 있는 날짜에만 선다.
    const span = 30, offset = (day) => Math.round((Date.parse(day) - Date.parse(date)) / 864e5) + span;
    fetch(`r/rewind-${index}/frames.json`, { cache: "no-cache" }).then((r) => (r.ok ? r.json() : null)).then(async (data) => {
      if (!data) return;
      const frames = data.frames.filter((frame) => frame.day <= date && offset(frame.day) >= 0);
      const start = frames.findIndex((frame) => frame.day === date);
      if (start < 0) return;
      const last = frames[start].predict.x0;
      const base = data.predict;
      const backdrop = imgs.predict ? await load(base.src) : null;
      // 모든 날짜의 Montecarlo·권장 추종 배율 그림을 처음에 한꺼번에 받아 해독해 둔다.
      const sources = frames.map((frame) => Promise.all([load(frame.tree.src), load(frame.chart.src)]).then((pair) => Promise.all(pair.map((image) => image.decode().then(() => image)))));
      const ready = new Array(frames.length);
      sources.forEach((source, i) => source.then((pair) => { ready[i] = pair; }).catch(() => {}));
      const predict = (c, frame, width, ratio) => paint(c, backdrop, base, (g, px, py, clipped) => {
        // 기준 가격 날짜의 가로 위치에는 그 세션 종가가 놓이고, 기준 가격은 그 오른쪽 `start_offset` 거래일에 놓인다.
        const p = frame.predict, xs = p.q50.map((_, k) => px(p.x0 + (k || base.start_offset)));
        clipped(() => {
          line(g, [[px(base.xlim[0]), py(p.base)], [px(base.xlim[1]), py(p.base)]], "#3A3F4A", 0.8 * pt, [1.6 * pt, 1.6 * pt]);
          g.beginPath();
          xs.forEach((x, k) => (k ? g.lineTo(x, py(p.q25[k])) : g.moveTo(x, py(p.q25[k]))));
          xs.slice().reverse().forEach((x, k) => g.lineTo(x, py(p.q75[xs.length - 1 - k])));
          g.closePath();
          g.globalAlpha = 0.32;
          g.fillStyle = base.color;
          g.fill();
          g.globalAlpha = 1;
          // 종가 선은 기준 가격 날짜 종가에서 점선으로 출발점에 닿고, 그 뒤 종가는 출발점에서 다시 잇는다. 지난 날짜에서는
          // 리포트 날짜 판단의 기준 가격 날짜 종가 오른쪽 `start_offset` 거래일에 그 판단의 기준 가격을 놓고 점선으로 잇는다.
          const h = base.history, origin = [xs[0], py(p.base)], dash = [1.6 * pt, 1.6 * pt];
          line(g, h.slice(0, p.x0 + 1).map((v, k) => [px(k), py(v)]), base.price, 1.2 * pt);
          line(g, [[px(p.x0), py(h[p.x0])], origin], base.price, 1.2 * pt, dash);
          if (last > p.x0) {
            line(g, [origin, ...h.slice(p.x0 + 1, last + 1).map((v, k) => [px(p.x0 + 1 + k), py(v)])], base.price, 1.2 * pt);
            line(g, [[px(last), py(h[last])], [px(last + base.start_offset), py(frames[start].predict.base)]], base.price, 1.2 * pt, dash);
          }
          line(g, xs.map((x, k) => [x, py(p.q50[k])]), base.color, 2.2 * pt);
        });
        if (last > p.x0) dot(g, px(last + base.start_offset), py(frames[start].predict.base), 2.6 * pt, base.price);
        dot(g, xs[0], py(p.base), Math.sqrt(14) / 2 * pt, base.color);
        g.fillStyle = base.color;
        g.font = `${13.5 * pt}px ${font}`;
        g.textAlign = "left";
        g.textBaseline = "middle";
        const end = xs[xs.length - 1] + 5 * pt;
        ["q25", "q50", "q75"].forEach((q) => g.fillText(`$${Math.round(p[q][p[q].length - 1]).toLocaleString("en-US")}`, end, py(p[q][p[q].length - 1])));
        g.fillStyle = "#E5E7EB";
        g.font = `bold ${15.3 * pt}px ${font}`;
        g.textAlign = "center";
        g.textBaseline = "bottom";
        g.fillText(frame.day === date ? "TODAY" : label(frame.day), xs[0], py(p.base) - 8 * pt);
      }, width, ratio);
      const tree = (c, frame, image, width, ratio) => paint(c, image, frame.tree, (g, px, py, clipped) => {
        const points = frame.tree.actual.slice(0, last - frame.predict.x0 + 1).map((v, k) => [px(k), py(v)]);
        // 지난 날짜에서는 리포트 날짜 판단의 기준 가격 날짜 종가 오른쪽 `start_offset` 거래일에 그 판단의 기준 가격을 놓고 점선으로 잇는다.
        const today = frames[start].predict.base;
        const tail = frame.day !== date && points.length === last - frame.predict.x0 + 1
          ? [points[points.length - 1], [px(points.length - 1 + base.start_offset), py((today / frame.predict.base - 1) * 100)]] : null;
        clipped(() => {
          line(g, points, "rgba(0, 0, 0, 0.6)", 4.4 * pt);
          line(g, points, base.price, 2.2 * pt);
          if (tail) line(g, tail, base.price, 2.2 * pt, [2.2 * pt, 2.2 * pt]);
        });
        dot(g, ...(tail ? tail[1] : points[points.length - 1]), 2.6 * pt, base.price);
      }, width, ratio);
      // 슬라이더가 움직이는 동안에는 화면 해상도로, 멈춘 뒤 크게 보기용 그림은 원래 해상도로 그린다.
      const render = (target, i, width) => {
        const pair = ready[i], fixed = (name) => (width ? ratio[name] : 0);
        if (target.predict) predict(target.predict, frames[i], width && width("predict"), fixed("predict"));
        tree(target.tree, frames[i], pair[0], width && width("tree"), fixed("tree"));
        if (target.chart) paint(target.chart, pair[1], null, null, width && width("chart"), fixed("chart"));
      };
      // 화면의 canvas 비율은 날짜마다의 그림 가운데 가장 긴 비율로 고정한다. 모든 그림을 받은 뒤에 처음 그린다.
      await Promise.allSettled(sources);
      const tallest = (k) => Math.max(...ready.filter(Boolean).map((pair) => pair[k].naturalHeight / pair[k].naturalWidth));
      const ratio = { predict: backdrop && backdrop.naturalHeight / backdrop.naturalWidth, tree: tallest(0), chart: tallest(1) };
      const names = ["predict", "tree", "chart"].filter((name) => imgs[name] && (name !== "predict" || backdrop));
      const live = Object.fromEntries(names.map((name) => [name, surface(imgs[name])]));
      const control = document.createElement("div");
      control.className = "rewind";
      control.innerHTML = `<input type="range" min="0" max="${span}" step="1" value="${span}"><span></span>`;
      const [range, shown] = control.children;
      const first = offset(frames[0].day);
      range.style.setProperty("--from", first / span);
      let wanted = start, drawn = -1, frame = 0, settle;
      const draw = () => {
        frame = 0;
        const i = wanted, pair = ready[i];
        if (!pair || drawn === i) return;
        drawn = i;
        render(live, i, (name) => Math.round(imgs[name].parentElement.clientWidth * devicePixelRatio));
        names.forEach((name) => {
          if (live[name].isConnected) return;
          imgs[name].before(live[name]);
          imgs[name].style.display = "none";
        });
        clearTimeout(settle);
        settle = setTimeout(() => {
          const full = Object.fromEntries(names.filter((name) => name !== "chart").map((name) => [name, document.createElement("canvas")]));
          render(full, i);
          imgs.chart.src = frames[i].chart.src;
          Object.entries(full).forEach(([name, c]) => c.toBlob((blob) => {
            if (drawn !== i) return;
            if (imgs[name].src.startsWith("blob:")) URL.revokeObjectURL(imgs[name].src);
            imgs[name].src = URL.createObjectURL(blob);
          }, "image/jpeg", 0.92));
        }, 300);
      };
      // 레버를 잡고 있는 동안 레버 위에 날짜 말풍선을 띄운다. 레버 폭 18px를 빼고 남은 폭에서 레버 중심을 찾고,
      // 말풍선은 슬라이더 폭 안에 두되 꼬리는 레버 중심을 가리킨다.
      const show = (i) => {
        wanted = i;
        range.value = offset(frames[i].day);
        shown.textContent = label(frames[i].day);
        const half = shown.offsetWidth / 2, at = 9 + offset(frames[i].day) / span * (range.clientWidth - 18);
        shown.style.left = `${Math.min(range.clientWidth - half, Math.max(half, at))}px`;
        shown.style.setProperty("--tail", `${at - Math.min(range.clientWidth - half, Math.max(half, at))}px`);
        if (ready[i]) { if (!frame) frame = requestAnimationFrame(draw); }
        else sources[i].then(() => { if (wanted === i && !frame) frame = requestAnimationFrame(draw); }).catch(() => {});
      };
      // 레버를 첫 프레임보다 왼쪽으로 옮기면 첫 프레임에 세우고, 그 밖에는 가장 가까운 프레임 날짜로 붙인다.
      const nearest = () => {
        const at = Math.max(first, +range.value);
        return frames.reduce((best, frame, i) => (Math.abs(offset(frame.day) - at) <= Math.abs(offset(frames[best].day) - at) ? i : best), 0);
      };
      range.addEventListener("input", () => show(nearest()));
      const hold = (on) => () => { control.classList.toggle("held", on); if (on) show(nearest()); };
      range.addEventListener("pointerdown", hold(true));
      ["pointerup", "pointercancel", "change", "blur"].forEach((type) => range.addEventListener(type, hold(false)));
      box.querySelector(".dots").before(control);
      show(start);
    }).catch(() => {});
  }

  // 절 안의 `###` 항목을 하나씩 넘기는 묶음으로 바꾼다. 항목은 `###` 제목부터 다음 `###`·`##` 앞까지다.
  // 주요 이슈 해설에서는 템플릿이 검토했지만 비중을 낮춘 이슈를 번호 이슈 뒤에 두므로 그 항목이 마지막 슬라이드가 된다.
  // 넘기면 절 제목이 화면 위에 오도록 화면을 옮긴다.
  function section(title) {
    const head = [...report.querySelectorAll("h2")].find((h) => h.textContent.trim() === title);
    if (!head) return;
    head.classList.add("issues");
    const items = [];
    for (let node = head.nextElementSibling; node && node.tagName !== "H2"; node = node.nextElementSibling) {
      if (node.tagName === "H3") {
        items.push([node]);
      } else if (items.length) {
        items[items.length - 1].push(node);
      }
    }
    // 번호 없이 번호 이슈 뒤에 오는 항목(검토했지만 비중을 낮춘 이슈)에는 다음 번호를 붙인다.
    items.forEach(([h3], i) => {
      if (i && /^\d+\.\s/.test(items[i - 1][0].textContent.trim()) && !/^\d+\.\s/.test(h3.textContent.trim())) {
        h3.prepend(`${i + 1}. `);
      }
    });
    const moved = () => toTop(head);
    if (items.length > 1) slider(items, head, { fit: true, moved });
  }

  // 절 안의 `###` 소제목마다 소제목만 보이는 접기 상자를 만들고, 다음 `###`·`##` 앞까지의 문단을 그 안에 넣는다.
  function fold(title) {
    const head = [...report.querySelectorAll("h2")].find((h) => h.textContent.trim() === title);
    if (!head) return;
    const heads = [];
    for (let node = head.nextElementSibling; node && node.tagName !== "H2"; node = node.nextElementSibling) {
      if (node.tagName === "H3") heads.push(node);
    }
    heads.forEach((h3) => {
      const box = document.createElement("details");
      box.className = "fold";
      const summary = document.createElement("summary");
      h3.before(box);
      let node = h3.nextElementSibling;
      summary.appendChild(h3);
      box.appendChild(summary);
      while (node && node.tagName !== "H3" && node.tagName !== "H2") {
        const next = node.nextElementSibling;
        box.appendChild(node);
        node = next;
      }
    });
  }

  // 다가오는 이벤트를 발표일마다 한 장으로 모아 넘기는 묶음으로 바꾸고, 위에 날짜 띠를 둔다.
  // 날짜 띠에는 리포트 날짜 전 2일부터 뒤 7일까지 이벤트가 있는 날짜와 리포트 날짜를 둔다. 발표일은
  // `build.py`가 소제목에 단 `data-day`를 쓰고, 범위 밖 이벤트는 지운다. 처음에는 리포트 날짜를 보여 주고,
  // 그날 이벤트가 없으면 빈 안내 한 줄을 둔다. 날짜를 누르면 그 날짜로 넘어가고, 절 제목이 화면 위에 오도록 화면을 옮긴다.
  function events(date) {
    const head = [...report.querySelectorAll("h2")].find((h) => h.textContent.trim() === "다가오는 이벤트");
    if (!head) return;
    head.classList.add("events");
    const shift = (day, n) => new Date(Date.parse(day) + n * 864e5).toISOString().slice(0, 10);
    const first = shift(date, -2), last = shift(date, 7);
    const groups = new Map([[date, []]]);
    // 첫 소제목 앞의 노드는 그대로 두고, 소제목부터 다음 소제목 앞까지는 그 소제목의 날짜 묶음에 넣는다.
    let group;
    for (let node = head.nextElementSibling; node && node.tagName !== "H2";) {
      const next = node.nextElementSibling;
      if (node.tagName === "H3") {
        const day = node.dataset.day;
        group = day >= first && day <= last ? groups.get(day) || groups.set(day, []).get(day) : null;
      }
      if (group) group.push(node); else if (group === null) node.remove();
      node = next;
    }
    const days = [...groups.keys()].sort();
    if (!groups.get(date).length) {
      groups.get(date).push(Object.assign(document.createElement("div"), { className: "empty", textContent: "오늘 예정된 이벤트가 없습니다" }));
    }
    // 날짜 위 점: `build.py`가 소제목에 단 `data-level`을 중요도 순서로 센다.
    const marks = (nodes) => {
      const levels = nodes.filter((node) => node.tagName === "H3" && node.dataset.level).map((node) => node.dataset.level);
      const order = ["high", "mid", "low"].filter((level) => levels.includes(level));
      const dot = (level) => `<span class="lv-${level}"></span>`;
      const inner = levels.length > 5
        ? order.map((level) => dot(level) + `<em>${levels.filter((l) => l === level).length}</em>`).join("")
        : order.flatMap((level) => levels.filter((l) => l === level).map(dot)).join("");
      return `<i>${inner}</i>`;
    };
    const bar = document.createElement("div");
    bar.className = "days";
    bar.innerHTML = '<div class="strip"></div>';
    const strip = bar.firstChild;
    days.forEach((day) => {
      const [, m, d] = day.split("-");
      const button = document.createElement("button");
      button.innerHTML = `${marks(groups.get(day))}<b>${m}/${d}</b><small>${day === date ? "오늘" : "일월화수목금토"[new Date(day).getUTCDay()]}</small>`;
      strip.appendChild(button);
    });
    let offset = 0;
    const change = (i) => {
      [...strip.children].forEach((button, j) => button.classList.toggle("on", i === j));
      const button = strip.children[i], width = bar.clientWidth;
      if (button.offsetLeft + button.offsetWidth - offset > width) offset = button.offsetLeft + button.offsetWidth - width;
      if (button.offsetLeft < offset) offset = button.offsetLeft;
      strip.style.transform = `translateX(${-offset}px)`;
    };
    head.after(bar);
    const box = slider(days.map((day) => groups.get(day)), bar, { fit: true, start: days.indexOf(date), change, name: "events" });
    box.prepend(bar);
    [...strip.children].forEach((button, i) => button.addEventListener("click", () => {
      // 이 절이 리포트 끝이라 아래 내용이 화면보다 짧으면 절 제목이 위까지 오지 못하므로, 묶음에 그만큼 최소 높이를 준다.
      // 최소 높이가 줄면 문서가 짧아져 화면이 위로 당겨지므로, 최소 높이는 커질 때만 바꾼다.
      const rect = box.getBoundingClientRect(), after = document.documentElement.scrollHeight - (rect.bottom + scrollY);
      const margin = parseFloat(getComputedStyle(head).scrollMarginTop);
      const need = innerHeight - margin - (rect.top - head.getBoundingClientRect().top) - after;
      box.style.minHeight = `${Math.max(need, parseFloat(box.style.minHeight) || 0)}px`;
      toTop(head);
      box.go(i);
    }));
  }

  if (!/^\d{8}-[a-z]+$/.test(key)) {
    fail("열 리포트가 지정되지 않았다.");
  } else {
    Promise.all([
      fetch(`r/${key}/report.html`, { cache: "no-cache" }).then((r) => { if (!r.ok) throw new Error(r.status); return r.text(); }),
      fetch("r/index.json", { cache: "no-cache" }).then((r) => (r.ok ? r.json() : {})).catch(() => ({})),
    ]).then(([body, listing]) => {
      const entry = listing[key];
      if (entry) {
        document.getElementById("title").textContent = entry.title;
        document.title = `${entry.title} ${entry.day}`;
        // 처음 만든 날이 리포트 날짜와 같으면 시각만, 다르면 월/일까지 적는다.
        const [day, time] = entry.written.split(" ");
        const when = day === entry.date ? time : `${+day.slice(5, 7)}/${+day.slice(8)} ${time}`;
        document.getElementById("dated").textContent = `${entry.day} ${when} 작성`;
        if (entry.moves) {
          const pct = (v) => v === null ? "<b>—</b>"
            : `<b class="${v > 0 ? "up" : v < 0 ? "down" : ""}">${v > 0 ? "+" : v < 0 ? "−" : ""}${Math.abs(v).toFixed(2)}%</b>`;
          document.getElementById("moves").innerHTML =
            `전날 정규장${pct(entry.moves.session)}<span class="sep"></span>장 마감 후${pct(entry.moves.after)}`;
        }
      }
      const date = entry ? entry.date : `${key.slice(0, 4)}-${key.slice(4, 6)}-${key.slice(6, 8)}`;
      report.innerHTML = body;
      figures(date);
      fold("1개월 지수 방향 예측");
      // 이슈 제목의 방향 표식을 먼저 가려내고, 나머지 표식은 중요도로 칠한다.
      const tones = { "상승 요인": "tone-up", "하락 요인": "tone-down", "양방향": "tone-both" };
      report.querySelectorAll("h3 code").forEach((tag) => {
        const text = tag.textContent.trim();
        tag.classList.add(tones[text] || (text.includes("높음") ? "lv-high" : text.includes("보통") ? "lv-mid" : "lv-low"));
      });
      section("주요 이슈 해설");
      // 소제목의 표식을 제목 아래 한 줄로 옮긴다. 번호 이슈 뒤 항목의 번호는 `section`이 먼저 붙인다.
      report.querySelectorAll("h3").forEach((h3) => {
        const codes = h3.querySelectorAll("code");
        if (!codes.length) return;
        const tags = document.createElement("span");
        tags.className = "tags";
        tags.append(...codes);
        h3.append(tags);
        h3.normalize();
        h3.childNodes.forEach((node) => { if (node.nodeType === 3) node.textContent = node.textContent.replace(/\s+$/, ""); });
      });
      events(date);
      // Montecarlo처럼 글자가 작은 그림은 눌러서 미니 앱 안에서 화면 폭으로 띄우고, 두 손가락으로 키우고 줄이며
      // 키운 그림은 한 손가락으로 옮긴다. 원래 크기에서 좌우로 밀면 같은 묶음의 이전·다음 그림으로 넘긴다.
      // 손가락을 움직이지 않고 한 번 누르면 닫는다.
      report.querySelectorAll("img").forEach((img) => img.addEventListener("click", () => viewer(img)));
    }).catch(() => fail("리포트를 찾지 못했다."));
  }
  function viewer(img) {
    const box = document.createElement("div");
    box.className = "viewer";
    // 되감기 슬라이더가 원래 그림을 숨기고 canvas를 보이므로, 크게 보는 그림은 숨김을 풀어 띄운다.
    const large = img.cloneNode();
    large.style.display = "";
    box.append(large);
    document.body.append(box);
    const carousel = img.closest(".carousel");
    const group = carousel ? [...carousel.querySelectorAll("img")] : [img];
    let index = group.indexOf(img), swipe = null;
    let scale = 1, x = 0, y = 0, start = null, moved = false;
    const place = () => {
      const fit = (offset, size, room, at) => size * scale <= room ? (size - size * scale) / 2
        : Math.min(-at, Math.max(room - at - size * scale, offset));
      x = fit(x, large.offsetWidth, box.clientWidth, large.offsetLeft);
      y = fit(y, large.offsetHeight, box.clientHeight, large.offsetTop);
      large.style.transform = `translate(${x + (swipe ? swipe.dx : 0)}px, ${y}px) scale(${scale})`;
    };
    // 묶음의 i번 그림으로 바꾸고, 닫았을 때 그 그림이 보이도록 뒤의 묶음도 함께 넘긴다.
    const show = (i) => {
      index = i;
      large.src = group[i].src;
      scale = 1; x = 0; y = 0;
      large.style.transform = "";
      carousel.go([...carousel.querySelector(".track").children].indexOf(group[i].closest(".slide")));
    };
    const touches = (event) => {
      const [a, b = a] = event.touches;
      return { mid: [(a.clientX + b.clientX) / 2 - large.offsetLeft, (a.clientY + b.clientY) / 2 - large.offsetTop],
               gap: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), count: event.touches.length };
    };
    box.addEventListener("touchstart", (event) => {
      if (event.touches.length === 1) moved = false;
      start = { ...touches(event), scale, x, y };
      swipe = event.touches.length === 1 && scale === 1 && group.length > 1 ? { dx: 0, dy: 0 } : null;
    }, { passive: true });
    box.addEventListener("touchmove", (event) => {
      event.preventDefault();
      const now = touches(event);
      if (now.count !== start.count) { start = { ...now, scale, x, y }; swipe = null; }
      if (swipe) {
        swipe = { dx: now.mid[0] - start.mid[0], dy: now.mid[1] - start.mid[1] };
        if (Math.hypot(swipe.dx, swipe.dy) > 8) moved = true;
        place();
        return;
      }
      if (now.count === 2) scale = Math.min(5, Math.max(1, start.scale * now.gap / start.gap));
      const ratio = scale / start.scale;
      x = now.mid[0] - (start.mid[0] - start.x) * ratio;
      y = now.mid[1] - (start.mid[1] - start.y) * ratio;
      if (now.count === 2 || Math.hypot(now.mid[0] - start.mid[0], now.mid[1] - start.mid[1]) > 8) moved = true;
      place();
    }, { passive: false });
    box.addEventListener("touchend", (event) => {
      if (event.touches.length) { start = { ...touches(event), scale, x, y }; swipe = null; return; }
      if (!swipe) return;
      const next = index + (swipe.dx < 0 ? 1 : -1);
      const turn = Math.abs(swipe.dx) > 50 && Math.abs(swipe.dx) > Math.abs(swipe.dy) && group[next];
      swipe = null;
      if (turn) show(next); else place();
    });
    box.addEventListener("click", () => { if (!moved) box.remove(); });
  }
</script>
</body>
</html>
