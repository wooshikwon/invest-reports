          Object.assign(document.createElement("span"), { className: "n", textContent: names.length ? names.join(", ") : "예측 마지막 날" }));
        line.classList.toggle("go", names.length > 0);
        prev.disabled = pick === 0;
        next.disabled = pick === events.length - 1;
      };
      const draw = () => {
        s.replaceChildren();
        const f = frame, pct = f.tree.pct, n = pct["50"].length - 1;
        events = f.tree.events.at(-1)?.[0] === n ? f.tree.events : [...f.tree.events, [n, [], f.days[n].slice(5).split("-").map(Number).join("/")]];
        pick ??= 0;
        const actual = f.day === date ? [] : f.tree.actual.slice(0, (f.days.indexOf(data.base_date) + 1) || undefined);
        // 지난 날짜에서 실제 종가가 리포트 날짜 판단의 기준 가격 날짜까지 모두 있으면, 그 종가 네 시간 뒤(`BASE_AFTER`)에 리포트 날짜 판단의 기준 가격을 놓고 점선으로 잇는다.
        const tail = actual.length && f.days[actual.length - 1] === data.base_date ? [actual.length - 1 + BASE_AFTER, (data.base / f.base - 1) * 100] : null;
        const reach = Math.max(15, ...[pct["10"], pct["90"], actual].flat().map(Math.abs), tail ? Math.abs(tail[1]) : 0);
        const top = Math.ceil(reach / 5) * 5;
        const X = (d) => L + d / n * (R - L), Y = (v) => B - (Math.max(-top, Math.min(top, v)) + top) / (2 * top) * (B - T);
        const band = (a, b, opacity) => shape("path", { d: `${path(pct[a].map((v, d) => [X(d), Y(v)]))}L${pct[b].slice().reverse().map((v, d) => `${X(n - d)} ${Y(v)}`).join("L")}Z`, fill: color, opacity });
        s.append(band("10", "90", .14));
        s.append(shape("line", { x1: L, x2: R, y1: Y(0), y2: Y(0), stroke: "rgba(122, 130, 140, .55)" }));
        // 이웃 번호와 16px보다 가까운 번호는 한 줄 위에 그린다.
        let before = -99, row = 0;
        const hits = [];
        events.forEach(([d], i) => {
          row = X(d) - before < 16 && row === 0 ? 1 : 0;
          before = X(d);
          const cy = T - 9 - row * 17;
          s.append(shape("line", { x1: X(d), x2: X(d), y1: cy, y2: B, "stroke-width": 1, "stroke-dasharray": "2 3", "data-ev": i }));
          s.append(shape("circle", { cx: X(d), cy, r: 7.5, "data-ev": i }));
          s.append(shape("text", { x: X(d), y: cy + 3.5, "font-size": 9.5, "font-weight": 600, "text-anchor": "middle", "pointer-events": "none", "data-ev": i }, i + 1));
          // 번호 원과 그 아래 세로선 양옆 7px까지를 누르면 그 일정을 고른다. 누르는 면은 범위 띠에 가리지 않게 맨 마지막에 붙인다.
          const touch = { fill: "transparent", style: "cursor:pointer" };
          [shape("circle", { cx: X(d), cy, r: 13, ...touch }), shape("rect", { x: X(d) - 7, y: cy, width: 14, height: B - cy, ...touch })].forEach((hit) => {
            hit.addEventListener("click", () => { pick = i; mark(); });
            hits.push(hit);
          });
        });
        s.append(shape("line", { x1: L, x2: R, y1: B, y2: B, stroke: DIMS }));
        f.tree.ticks.forEach(([t, day]) => s.append(shape("text", { x: X(t), y: B + 17, "font-size": 11, fill: DIMS, "text-anchor": t === 0 ? "start" : t === n ? "end" : "middle" }, day)));
        s.append(shape("path", { d: `${path(pct["25"].map((v, d) => [X(d), Y(v)]))}L${pct["75"].slice().reverse().map((v, d) => `${X(n - d)} ${Y(v)}`).join("L")}Z`, fill: color, opacity: .22 }));
        s.append(shape("path", { d: path(pct["50"].map((v, d) => [X(d), Y(v)])), fill: "none", stroke: color, "stroke-width": 1.4, "stroke-linejoin": "round" }));
        if (actual.length) {
          const points = actual.map((v, d) => [X(d), Y(v)]), lineStyle = { fill: "none", "stroke-linejoin": "round", "stroke-linecap": "round" };
          s.append(shape("path", { d: path(points), ...lineStyle, stroke: "rgba(0, 0, 0, .6)", "stroke-width": 3.2 }));
          s.append(shape("path", { d: path(points), ...lineStyle, stroke: PRICE, "stroke-width": 1.6 }));
          const dot = tail ? [X(tail[0]), Y(tail[1])] : points[points.length - 1];
          if (tail) s.append(shape("path", { d: path([points[points.length - 1], dot]), ...lineStyle, stroke: PRICE, "stroke-width": 1.6, "stroke-dasharray": "2 2" }));
          s.append(shape("circle", { cx: dot[0], cy: dot[1], r: 2.5, fill: PRICE }));
        }
        s.append(shape("text", { x: L, y: Y(0) - 4, "font-size": 11, fill: DIMS, "pointer-events": "none" }, "0%"));
        scale = { X, Y, values: s.appendChild(shape("g", { "pointer-events": "none" })) };
        s.append(...hits);
        mark();
      };
      return {
        box: c.box,
        show(f) {
          if (frame?.day !== f.day) pick = null;
          frame = f;
          draw();
        },
      };
    })();

    // 권장 배율: 경로마다의 평균 배율 분포를 오늘 판단(판단 색)과 이슈가 없을 때의 기준(회색)으로 그리고, 평균 배율에 세로선을 긋는다.
    const chart = data.pre ? null : (() => {
      const c = card("지수 추종 = 1.0"), s = c.svg;
      const L = 6, R = W - 6, T = 22;
      return {
        box: c.box,
        show(f) {
          const den = f.chart, n = den.points, m = 1 + den.mean;
          c.head("", m.toFixed(3));
          const xs = Array.from({ length: n }, (_, i) => 1 + den.low + (den.high - den.low) * i / (n - 1));
          const X = (v) => L + (v - xs[0]) / (xs[n - 1] - xs[0]) * (R - L), peak = Math.max(...den.today, ...den.quiet);
          const Y = (v) => B - v / peak * (B - T);
          const area = (values) => `M${X(xs[0])} ${B}L${values.map((v, i) => `${X(xs[i])} ${Y(v)}`).join("L")}L${X(xs[n - 1])} ${B}Z`;
          s.replaceChildren();
          s.append(shape("path", { d: area(den.quiet), fill: "rgba(167, 171, 176, .14)" }));
          s.append(shape("path", { d: area(den.today), fill: color, opacity: .2 }));
          s.append(shape("line", { x1: X(1), x2: X(1), y1: T, y2: B, stroke: "#A7ABB0", "stroke-width": 1, "stroke-dasharray": "2 3" }));
          s.append(shape("line", { x1: X(m), x2: X(m), y1: T, y2: B, stroke: color, "stroke-width": 1.6 }));
          s.append(shape("line", { x1: L, x2: R, y1: B, y2: B, stroke: DIMS }));
          [[0.5, "E 큰 하락"], [0.75, "D 하락"], [1, "C 횡보"], [1.25, "B 상승"], [1.5, "A 큰 상승"]].forEach(([v, text]) => {
            s.append(shape("line", { x1: X(v), x2: X(v), y1: B, y2: B + 4, stroke: DIMS }));
            s.append(shape("text", { x: X(v), y: B + 18, "font-size": 11, fill: Math.abs(v - m) < 0.125 ? "#EAEAEA" : DIMS, "text-anchor": "middle" }, text));
          });
        },
      };
    })();

    const parts = [[index, "지수"], [predict, "예측"], ...(data.pre ? [] : [[tree, "일정"], [chart, "권장 배율"]])].filter(([part]) => part);
    const show = (frame) => parts.forEach(([part]) => part.show(frame));
    show(data);
    // 머리 상자 시세는 위 줄에 기준 가격 날짜의 정규장 종가를, 아래 줄에 리포트 날짜 판단의 기준 가격을 쓴다. 사전 리포트는 아래 줄을 두지 않는다.
    // `quote(early, afters)`는 리포트 날짜의 프리장 값(`r/premarket.json`)의 앞 세션이 기준 가격 날짜이고 지수 ETF 체결가가 있으면, 아래 줄에 기준 가격 대신
    // 정규장 종가에 지수 ETF의 프리장 등락 비율을 곱한 프리마켓 가격과 그 등락률을 쓴다. 그 값이 정규장 값이면 아래 줄을 두지 않고, 위 줄에 같은 방법으로 옮긴 정규장 가격과 그 등락률을 쓴다. 사전 리포트는 프리장 값이 없을 때 지수의 애프터장 값(`r/afterhours.json`)에서
    // 기준 가격 날짜의 지수 ETF 등락 비율을 정규장 종가에 곱한 애프터마켓 가격과 그 등락률을 쓴다. 위 줄 등락률은 반올림한 값으로 색을 정해 0.00%를 칠하지 않는다.
    const at = dates.indexOf(data.base_date), rate = (ratio) => Math.round(ratio * 1e4) / 100;
    const day = rate(hist[at] / hist[at - 1] - 1);
    const quote = (early, afters) => {
      const ahead = early?.session === data.base_date && early.ratio != null ? early : null;
      const behind = afters?.[data.base_date]?.ratio != null ? afters[data.base_date] : null;
      const line = (name, value) => `<small>${name} ${fmt(value)} ${signed(rate(value / hist[at] - 1), 2)}%</small>`;
      const open = ahead?.phase === "regular", value = open ? hist[at] * ahead.ratio : hist[at], move = open ? rate(ahead.ratio - 1) : day;
      const tail = open ? "" : ahead ? line("프리마켓", hist[at] * ahead.ratio) : !data.pre ? line("애프터마켓", data.base)
        : behind ? line("애프터마켓", hist[at] * behind.ratio) : "";
      return `<span class="row"><span>${INDEX_NAME[key.split("-")[1]]}</span><b class="price ${tone(move)}">${fmt(value)}</b>`
        + `<b class="${tone(move)}">${signed(move, 2)}%</b>${tail}</span>`;
    };
    const live = (earlies, afters) => [index, predict].forEach((part) => part?.live(earlies, afters));
    return { names: parts.map(([, name]) => name), slides: parts.map(([part]) => [part.box]), show, quote, live };
  }

  // 그림 카드 묶음 아래에 지난 판단 날짜로 되감는 슬라이더를 둔다(build.py `r/rewind-{지수}/cards.json`). 리포트 날짜와 그 앞 날짜만
  // 고를 수 있고, 리포트 날짜가 되감기 범위에 없으면 슬라이더를 두지 않는다. 날짜를 고르면 그날 판단으로 카드를 다시 그린다.
  // 사전 리포트는 그 카드 값(`own`)을 리포트 날짜 자리에 두고, 앞 날짜의 판단과 함께 고르게 한다.
  function cardRewind(box, date, set, own) {
    fetch(`r/rewind-${key.split("-")[1]}/cards.json`, { cache: "no-cache" }).then((r) => (r.ok ? r.json() : null)).then((data) => {
      if (!data) return;
      const frames = data.frames.filter((frame) => (own ? frame.day < date : frame.day <= date) && rewindOffset(frame.day, date) >= 0)
        .concat(own ? [own] : []);
      const start = frames.findIndex((frame) => frame.day === date);
      if (start < 0) return;
      let drawn = start, frame = 0;
      const draw = () => { frame = 0; set.show(frames[drawn]); };
      dial(box, date, frames.map((f) => f.day), start, (i) => {
        if (i === drawn) return;
        drawn = i;
        if (!frame) frame = requestAnimationFrame(draw);
      });
    }).catch(() => {});
  }

  // 이슈 제목의 방향 표식을 가려내 칠하고, 나머지 표식인 이벤트 중요도는 지운다. 중요도는 `build.py`가 소제목에 단 `data-level`로 그린다.
  const TONES = { "상승 요인": "tone-up", "하락 요인": "tone-down", "양방향": "tone-both" };
  function toneTags(scope) {
    scope.querySelectorAll("h3 code").forEach((tag) => {
      const tone = TONES[tag.textContent.trim()];
      if (tone) tag.classList.add(tone);
      else tag.remove();
    });
  }
  // 소제목의 방향 표식은 제목 끝으로 옮긴다.
  function trail(h3) {
    const codes = [...h3.querySelectorAll("code")];
    if (codes.length) {
      const tags = document.createElement("span");
      tags.className = "tags";
      tags.append(...codes);
      h3.append(Object.assign(document.createElement("span"), { className: "gap", textContent: " " }), tags);
    }
    h3.normalize();
    h3.childNodes.forEach((node) => { if (node.nodeType === 3) node.textContent = node.textContent.replace(/\s+$/, ""); });
  }

  // 이슈 화면과 종목 상세의 왼쪽 아래에 뒤로가기 단추를 띄운다.
  // 주소로 바로 연 화면의 단추는 주소에서 `names`를 지우고 리포트 화면의 `page`번 페이지를 맨 위부터 연다.
  function backward(names, page) {
    const back = document.body.appendChild(document.createElement("button"));
    back.className = "back";
    back.innerHTML = '<svg width="12" height="20" viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2 2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    // 단추 이름은 어디서 열었든 "뒤로가기"이고, 돌아가는 곳은 이 화면을 연 곳이다. 이슈 화면 안에서 다른 이슈로 넘겨도 돌아가는 곳은 바뀌지 않는다.
    back.setAttribute("aria-label", "뒤로가기");
    // 리포트 화면(이슈 목록이나 이벤트 캘린더, 지수 지도 말풍선의 "자세히 보기")에서 연 화면의 단추는 뒤로 가서, 떠날 때의 리포트 화면(페이지와 캘린더 날짜, 화면 위치)으로 돌아간다.
    // 주소로 바로 연 이슈 화면의 단추는 이슈 화면 기록을 이 이슈를 담은 리포트 화면으로 바꾸며 이슈 페이지를 맨 위부터 연다(`land`). 종목 상세는 시장 페이지를 연다. 깊이는 그대로 넘긴다.
    back.addEventListener("click", () => {
      feelPress();
      if (depth > 0 && from) return history.back();
      sessionStorage.setItem("land", `${key} ${page}`);
      if (depth > 0) sessionStorage.setItem("depth", depth);
      const params = new URLSearchParams(location.search);
      names.forEach((name) => params.delete(name));
      location.replace(`?${params}`);
    });
    // 화면 어디서든 오른쪽으로 60px 넘게, 세로 이동의 1.5배 넘게 밀고 손을 떼면 뒤로가기 단추를 누른 것과 같다.
    // 그림을 크게 본 화면과 설명 상자, 넘기기 묶음 안에서 민 것은 세지 않는다.
    let swipe = null;
    document.addEventListener("touchstart", (event) => {
      const { target, touches } = event;
      swipe = touches.length === 1 && !target.closest(".viewer, .help-card, .carousel") ? { x: touches[0].clientX, y: touches[0].clientY } : null;
    }, { passive: true });
    document.addEventListener("touchend", (event) => {
      if (!swipe) return;
      const touch = event.changedTouches[0], dx = touch.clientX - swipe.x, dy = touch.clientY - swipe.y;
      swipe = null;
      if (dx > 60 && dx > 1.5 * Math.abs(dy)) back.click();
    }, { passive: true });
    // 화면이 내용의 아래쪽으로 8px 넘게 내려가면 단추를 감추고, 위쪽으로 8px 넘게 올라가면 다시 띄운다.
    // 올라간 거리는 마지막으로 올라간 뒤 가장 깊이 내려간 위치부터, 내려간 거리는 마지막으로 내려간 뒤 가장 얕게 올라간 위치부터 잰다. 문서 양 끝을 넘어 튕긴 위치는 문서 끝으로 센다.
    let deepest = scrollY, shallowest = scrollY;
    addEventListener("scroll", () => {
      const y = Math.max(0, Math.min(scrollY, document.documentElement.scrollHeight - innerHeight));
      deepest = Math.max(deepest, y);
      shallowest = Math.min(shallowest, y);
      if (y < deepest - 8) {
        deepest = y;
        back.classList.remove("hide");
      }
      if (y > shallowest + 8) {
        shallowest = y;
        back.classList.add("hide");
      }
    }, { passive: true });
  }

  // 상세 이슈 해설을 이슈 목록으로 바꾼다. 이슈는 `###` 제목부터 다음 `###`·`##` 앞까지다.
  // 템플릿이 검토했지만 비중을 낮춘 이슈를 번호 이슈 뒤에 두므로, 그 항목은 목록 끝의 "비중이 낮은 이슈 N건" 상자가 된다.
  // 상자를 누르면 주소의 `issue`에 그 이슈 번호를 적어 이슈 화면을 새 페이지로 연다. 이슈 번호는 소제목 앞 번호이고, 번호가 없는 상자는 목록 순서다.
  // `focus`가 있으면 이슈 화면이다. 그 번호의 이슈 내용과 절 제목만 남기고 리포트의 다른 절은 지운다. 그 번호의 이슈가 없으면 리포트 화면을 다시 연다.
  // 왼쪽 아래의 뒤로가기 단추를 누르면 앞 페이지로 돌아가고, 앞 페이지가 없으면 같은 리포트의 리포트 화면을 연다.
  // `at`이 있으면 히스토리에서 그 날짜 항목을 고른 채로 연다.
  // 이슈 화면의 절 제목은 보고 있는 이슈의 번호로 "이슈 N위"라고 쓰고, 검토했지만 비중을 낮춘 이슈를 보는 동안에는 "검토했지만 비중을 낮춘 이슈"로 쓴다.
  // `analyzed`가 있으면 리포트 화면의 절 제목과 이슈 목록 사이에 "11/17 11:43 KST"처럼 그 시각을 쓴다. 값은 `r/index.json`의 `written`과 같은 서울 시각이다.
  function section(title, focus = 0, at = null, analyzed = "") {
    const head = [...report.querySelectorAll("h2")].find((h) => h.textContent.trim() === title);
    if (!head) return;
    // 절 제목 글자만 바꾸도록 글자를 따로 감싼다.
    const label = Object.assign(document.createElement("span"), { textContent: head.textContent.trim() });
    head.replaceChildren(label);
    const items = [];
    for (let node = head.nextElementSibling; node && node.tagName !== "H2"; node = node.nextElementSibling) {
      if (node.tagName === "H3") {
        items.push([node]);
      } else if (items.length) {
        items[items.length - 1].push(node);
      }
    }
    if (!items.length) return;
    // 이슈 제목 앞의 번호를 지운다.
    const unnumber = (h3) => {
      const text = [...h3.childNodes].find((node) => node.nodeType === 3 && node.textContent.trim());
      if (text) text.textContent = text.textContent.replace(/^\s*\d+\.\s*/, "");
    };
    const numbers = items.map(([h3], i) => +h3.textContent.match(/^\s*(\d+)\./)?.[1] || i + 1);
    items.forEach(([h3]) => unnumber(h3));
    const other = "검토했지만 비중을 낮춘 이슈", reviewed = items[items.length - 1][0].textContent.trim() === other;
    if (reviewed) items[items.length - 1].shift().remove();
    // 방향 표식의 등락 화살표. 선의 끝 방향으로 화살촉을 단다.
    const tip = ([x0, y0], [x, y]) => {
      const a = Math.atan2(y - y0, x - x0), wing = (t) => `${(x - 4.2 * Math.cos(a + t)).toFixed(2)} ${(y - 4.2 * Math.sin(a + t)).toFixed(2)}`;
      return `M${wing(0.6)} L${x} ${y} L${wing(-0.6)}`;
    };
    const arrows = {
      "tone-up": `M2 15 L6.5 8 L10 11 L16 3 ${tip([10, 11], [16, 3])}`,
      "tone-down": `M2 3 L6.5 10 L10 7 L16 15 ${tip([10, 7], [16, 15])}`,
      "tone-both": `M2 9 H6 C9.5 9 11 3.5 16 3.5 M6 9 C9.5 9 11 14.5 16 14.5 ${tip([12.5, 3.9], [16, 3.5])} ${tip([12.5, 14.1], [16, 14.5])}`,
    };
    const arrow = (tone) => `<svg class="${tone}" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="${arrows[tone]}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    // `step`은 이슈 화면에서 이웃 이슈로 넘기는 함수이고, `busy`는 넘기는 동안 켠다.
    let busy = false, step = null;
    const box = document.createElement("div");
    box.className = "issue-box";
    const list = box.appendChild(document.createElement("div"));
    list.className = "issue-list";
    const pages = items.map((nodes, i) => {
      const image = nodes.find((node) => node.matches?.("figure.issue-image"));
      const pick = list.appendChild(document.createElement("div"));
      const text = document.createElement("div");
      text.className = "text";
      let lead = null;
      if (reviewed && i === items.length - 1) {
        pick.className = "pick more";
        const names = [...(nodes[0]?.querySelectorAll("li") ?? [])].map((li) => (li.querySelector("strong") ?? li).textContent.trim());
        text.append(Object.assign(document.createElement("h3"), { textContent: `비중이 낮은 이슈 ${names.length}건` }));
        text.append(Object.assign(document.createElement("p"), { textContent: names.slice(0, 3).join(", ") + (names.length > 3 ? "\u00a0등" : "") }));
        pick.append(Object.assign(document.createElement("div"), { className: "lead" }));
        pick.lastChild.append(Object.assign(document.createElement("span"), { className: "num" }), text);
      } else {
        pick.className = "pick";
        for (const key of ["event", "eventLevel"]) if (nodes[0].dataset[key]) pick.dataset[key] = nodes[0].dataset[key];
        const title = nodes[0].cloneNode(true);
        title.removeAttribute("id");
        text.append(title);
        const now = nodes.map((node) => (node.tagName === "H4" ? node : node.querySelector?.("h4"))).find((h4) => ["이슈 해설", "현재 상태"].includes(h4?.querySelector("mark")?.textContent.trim()));
        if (now) text.append(Object.assign(document.createElement("p"), { textContent: [...now.childNodes].filter((n) => n.nodeName !== "MARK").map((n) => n.textContent).join("").trim() }));
        // 이슈 해설의 소제목은 목록 상자에만 쓰고, 이슈 문단에서는 말머리만 남긴다. 현재 상태 소제목은 접는 문단의 제목이므로 그대로 둔다.
        if (now?.querySelector("mark").textContent.trim() === "이슈 해설") [...now.childNodes].filter((n) => n.nodeName !== "MARK").forEach((n) => n.remove());
        if (now?.querySelector("mark").textContent.trim() === "이슈 해설") lead = now;
        const age = "new" in nodes[0].dataset ? "NEW" : nodes[0].dataset.age ? `${nodes[0].dataset.age}일 전` : "";
        if (age) text.append(Object.assign(document.createElement("div"), { className: age === "NEW" ? "age new" : "age", textContent: age }));
        const num = Object.assign(document.createElement("span"), { className: "num", textContent: i + 1 });
        const tone = [...title.querySelectorAll("code")].map((code) => Object.keys(arrows).find((t) => code.classList.contains(t))).find(Boolean);
        title.querySelectorAll("code").forEach((code) => code.remove());
        if (tone) num.insertAdjacentHTML("beforeend", arrow(tone));
        pick.append(Object.assign(document.createElement("div"), { className: "lead" }));
        pick.lastChild.append(num, text);
        if (image?.dataset.thumb) pick.append(Object.assign(document.createElement("img"), { className: "thumb", src: image.dataset.thumb, alt: "" }));
      }
      // 이슈 상자를 누르면 진동을 내고 그 이슈를 연다.
      pick.addEventListener("click", () => {
        feelPress();
        visit(key, { issue: numbers[i] });
      });
      const page = box.appendChild(document.createElement("div"));
      page.className = "issue-page";
      page.append(...nodes);
      if (lead) written(lead, nodes[0].dataset.written);
      if (image) gallery(image);
      const past = nodes.find((node) => node.matches?.("template.issue-history"));
      if (past) Object.assign(page, chronicle(page, past));
      return page;
    });
    // 이슈 문단마다 끝에 앞 이슈와 다음 이슈로 가는 칸을 붙인다. 검토했지만 비중을 낮춘 이슈 묶음은 이어 읽는 이슈에 넣지 않는다.
    // 칸에는 그 이슈의 그림과 목록 상자의 제목을 쓰고, 그림이 없는 이슈는 같은 크기의 빈 띠를 두고, 그림이 하나도 없는 리포트는 꼬리표와 제목만 쓴다. 칸을 누르면 진동을 내고 그 이슈로 넘긴다.
    const chain = reviewed ? pages.length - 1 : pages.length;
    const framed = pages.slice(0, chain).some((page) => page.querySelector(":scope > figure.issue-image img"));
    const pass = (i, k, side) => {
      if (k < 0 || k >= chain) return document.createElement("span");
      const cell = document.createElement("button");
      cell.type = "button";
      cell.className = side;
      const tag = Object.assign(document.createElement("span"), { className: "tag", textContent: side === "prev" ? "‹ 이전" : "다음 ›" });
      const src = pages[k].querySelector(":scope > figure.issue-image img")?.getAttribute("src");
      if (framed) {
        const shot = cell.appendChild(Object.assign(document.createElement("div"), { className: "shot" }));
        if (src) shot.append(Object.assign(document.createElement("img"), { className: "thumb", src, alt: "", loading: "lazy" }));
        shot.append(tag);
      } else {
        cell.append(tag);
      }
      cell.append(Object.assign(document.createElement("span"), { className: "title", textContent: list.children[k].querySelector("h3").textContent.trim() }));
      cell.addEventListener("click", () => {
        if (busy) return;
        feelPress();
        step(i, k);
      });
      return cell;
    };
    pages.slice(0, chain).forEach((page, i) => {
      const nav = page.appendChild(document.createElement("nav"));
      nav.className = "step";
      nav.append(pass(i, i - 1, "prev"), pass(i, i + 1, "next"));
    });
    // 이슈 해설 말머리 앞에 히스토리 상자를 넣는다. `build.py`가 넣은 `issue-history` 템플릿에는 같은 이슈를 다룬 앞 날짜 리포트의 이슈 조각과
    // 날짜마다 이슈 해설 소제목이 날짜 순으로 들고, 마지막 항목이 오늘이다. 상자에는 날짜와 소제목을 오늘부터 앞 날짜 순으로 한 줄씩 쓰고 보고 있는 날짜의 줄을 굵게 쓴다.
    // 최근 세 줄 아래의 앞선 줄은 접어 두고, 상자 아래 끝의 펼침 단추를 누르면 다섯 줄까지 펼친 뒤 나머지 줄은 목록 안에서 스크롤하게 한다.
    // 펼친 뒤 같은 단추(`이전 해설 숨기기`)나 최근 세 줄을 누르면 앞선 줄을 다시 접고, 앞선 줄을 누르면 펼친 채 둔다.
    // 줄을 누르면 진동을 내고, 상자 위의 제목·그림과 상자 아래의 해설·그래프를 그날 내용으로 바꿔 서서히 보이며 화면을 맨 위로 옮긴다.
    // 돌려준 `restore`는 이슈 문단을 오늘 내용으로 돌리고 앞선 줄을 다시 접으며, 이슈를 열 때마다 부른다.
    // 돌려준 `recall`은 `day` 날짜 항목을 고른다. 그 줄이 접힌 앞선 줄이면 목록을 펼치고 목록 안에서 그 줄이 보이게 스크롤한다.
    // 이슈 해설 말머리 바로 뒤에 해설을 쓴 날짜(YYYY-MM-DD)를 "2026.11.14"처럼 쓴 줄을 넣는다.
    function written(lead, date) {
      if (!date) return;
      const line = Object.assign(document.createElement("p"), { className: "written", textContent: date.replaceAll("-", ".") });
      lead.after(line);
    }
    function chronicle(page, template) {
      const entries = [...template.content.children], today = entries.length - 1;
      const isLead = (node) => node.tagName === "H4" && node.querySelector("mark")?.textContent.trim() === "이슈 해설";
      // 날짜마다 내용을 상자 위에 둘 노드와 상자 아래에 둘 노드로 나눈다. 이슈 해설 말머리부터 상자 아래에 둔다.
      const split = (nodes) => {
        const cut = nodes.findIndex(isLead);
        return cut < 0 ? [nodes, []] : [nodes.slice(0, cut), nodes.slice(cut)];
      };
      const contents = entries.map((_, k) => (k === today ? split([...page.children].filter((node) => node !== template)) : null));
      const day = (k) => `${+entries[k].dataset.day.slice(5, 7)}/${+entries[k].dataset.day.slice(8)}`;
      const prepare = (k) => {
        const part = document.importNode(entries[k], true);
        toneTags(part);
        const h3 = part.querySelector("h3");
        if (h3) { unnumber(h3); trail(h3); }
        const lead = [...part.children].find(isLead);
        if (lead) { [...lead.childNodes].filter((n) => n.nodeName !== "MARK").forEach((n) => n.remove()); written(lead, entries[k].dataset.day); }
        part.querySelectorAll("figure.issue-chart[data-card]").forEach(issueChart);
        part.querySelectorAll("figure.issue-image").forEach(gallery);
        part.querySelectorAll("img").forEach((img) => img.addEventListener("click", () => viewer(img)));
        return split([...part.children]);
      };
      const heading = document.createElement("h4");
      heading.className = "history";
      heading.append(Object.assign(document.createElement("mark"), { textContent: "히스토리" }));
      const shelf = document.createElement("div");
      shelf.className = "history";
      const list = shelf.appendChild(Object.assign(document.createElement("div"), { className: entries.length > 3 ? "rows shut" : "rows" }));
      let current = today;
      // 펼친 목록의 높이. 다섯 줄이 넘으면 다섯째 줄의 아래 끝까지만 보인다.
      const reach = () => (list.children.length > 5 ? list.children[5].offsetTop : list.scrollHeight);
      // 앞선 줄을 다시 접고 펼침 단추의 글을 펼치기로 돌린다. 펼쳐 둔 상태에서 최근 세 줄을 누르면 목록을 맨 위로 돌리고 높이를 서서히 줄인 뒤 앞선 줄을 감춘다.
      const fold = (move) => {
        if (!list.classList.contains("open")) return;
        const from = list.offsetHeight;
        list.scrollTop = 0;
        list.classList.remove("open");
        list.style.height = "";
        label(false);
        if (!move || motion.matches) return list.classList.add("shut");
        list.animate([{ height: `${from}px` }, { height: `${list.children[3].offsetTop}px` }], { duration: GLIDE, easing: EASE })
          .finished.then(() => list.classList.contains("open") || list.classList.add("shut"));
      };
      const show = (k, move) => {
        contents[k] ??= prepare(k);
        contents[current].flat().forEach((node) => node.remove());
        heading.before(...contents[k][0]);
        shelf.after(...contents[k][1]);
        rows[current].classList.remove("on");
        rows[k].classList.add("on");
        current = k;
        if (!move) return;
        const options = { duration: motion.matches ? 0 : GLIDE, easing: EASE };
        contents[k].flat().forEach((node) => node.animate([{ opacity: 0 }, { opacity: 1 }], options));
        const cancel = () => { stop(); removeEventListener("touchstart", cancel); removeEventListener("wheel", cancel); };
        const stop = glide(scrollY, 0, (top) => scrollTo(0, top), cancel);
        addEventListener("touchstart", cancel, { passive: true });
        addEventListener("wheel", cancel, { passive: true });
      };
      const rows = entries.map((entry, k) => {
        const row = document.createElement("button");
        row.type = "button";
        row.className = k === today ? "entry on" : "entry";
        row.append(Object.assign(document.createElement("span"), { className: "day", textContent: day(k) }),
                   Object.assign(document.createElement("span"), { className: "title", textContent: entry.dataset.title }));
        row.addEventListener("click", () => {
          if (busy || k === current) return;
          feelPress();
          if (k > today - 3) fold(true);
          show(k, true);
        });
        return row;
      });
      // 오늘부터 앞 날짜 순으로 줄을 쌓는다. 접어 둔 목록은 넷째 줄부터 감춘다.
      list.append(...[...rows].reverse());
      const unfold = entries.length > 3 && shelf.appendChild(document.createElement("button"));
      // 펼침 단추의 글과 화살표. 펼친 목록에서는 같은 단추가 앞선 줄을 다시 접는다.
      const label = (opened) => {
        unfold.innerHTML = `${opened ? "이전 해설 숨기기" : `이전 해설 ${today - 2}개 펼치기`}<svg width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="${opened ? "M1 5l4-4 4 4" : "M1 1l4 4 4-4"}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      };
      if (unfold) {
        unfold.type = "button";
        unfold.className = "unfold";
        label(false);
        unfold.addEventListener("click", () => {
          feelPress();
          if (list.classList.contains("open")) return fold(true);
          const from = list.offsetHeight;
          open();
          list.animate([{ height: `${from}px` }, { height: `${reach()}px` }], { duration: motion.matches ? 0 : GLIDE, easing: EASE });
        });
      }
      // 앞선 줄을 펼치고 목록 높이를 펼친 높이로 둔다.
      const open = () => {
        list.classList.remove("shut");
        list.classList.add("open");
        list.classList.toggle("long", list.children.length > 5);
        label(true);
        list.style.height = `${reach()}px`;
      };
      contents[today][0].at(-1).after(heading, shelf);
      return {
        restore: () => {
          if (current !== today) show(today, false);
          fold(false);
        },
        recall: (day) => {
          const k = entries.findIndex((entry) => entry.dataset.day === day);
          if (k < 0) return;
          if (k <= today - 3) {
            open();
            list.scrollTop += rows[k].getBoundingClientRect().top - list.getBoundingClientRect().top - (list.clientHeight - rows[k].offsetHeight) / 2;
          }
          if (k !== current) show(k, false);
        },
      };
    }
    head.classList.add("issues");
    head.after(box);
    if (analyzed) box.before(Object.assign(document.createElement("p"), { className: "issue-asof",
      textContent: `${analyzed.slice(5, 7)}/${analyzed.slice(8, 10)} ${analyzed.slice(11, 16)} KST` }));
    if (!focus) return;
    const shown = numbers.indexOf(focus);
    if (shown < 0) {
      const params = new URLSearchParams(location.search);
      params.delete("issue");
      params.delete("at");
      location.replace(`?${params}`);
      return;
    }
    [...report.children].forEach((node) => node === head || node === box || node.remove());
    backward(["issue", "at"], 1);
    const bar = document.getElementById("issue-bar");
    const rename = (next) => {
      if (label.textContent === next) return;
      label.textContent = next;
      label.animate([{ opacity: 0 }, { opacity: 1 }], { duration: motion.matches ? 0 : GLIDE });
    };
    // `i`번째 이슈 문단을 보이고, 히스토리를 오늘 내용으로 돌리고 접기 상자를 모두 닫는다.
    const enter = (i) => {
      pages.forEach((page, j) => page.classList.toggle("on", i === j));
      pages[i].restore?.();
      pages[i].querySelectorAll("details.fold").forEach((fold) => {
        fold.anim?.cancel();
        fold.want = undefined;
        fold.open = false;
        fold.lastElementChild.style.overflow = "";
      });
      rename(reviewed && i === pages.length - 1 ? other : `이슈 ${numbers[i]}위`);
      // 위쪽 한 줄 띠에는 이슈 제목만 쓰고 방향 표식은 뺀다. 비중을 낮춘 이슈 묶음은 묶음 이름을 쓴다.
      const title = reviewed && i === pages.length - 1 ? other : (() => {
        const copy = items[i][0].cloneNode(true);
        copy.querySelectorAll("code, .tags").forEach((node) => node.remove());
        return copy.textContent.trim();
      })();
      if (bar.textContent !== title) {
        bar.textContent = title;
        bar.animate([{ opacity: 0 }, { opacity: 1 }], { duration: motion.matches ? 0 : GLIDE });
      }
      return pages[i];
    };
    box.classList.add("inside");
    head.classList.add("inside");
    enter(shown);
    if (at) pages[shown].recall?.(at);
    // 보고 있는 `i`번째 이슈에서 `k`번째 이슈로 넘기고 주소의 이슈 번호를 바꾼다. 다음 이슈는 오른쪽에서, 앞 이슈는 왼쪽에서 들어온다.
    // 나가는 이슈와 들어오는 이슈를 화면 좌우 끝까지 채운 그림 사이에 10px을 두고 나란히 옮기며, 동시에 화면을 맨 위로 옮긴다. 옮기는 동안 묶음 높이를 지금 높이 아래로 줄이지 않아 화면이 튀지 않는다.
    step = (i, k) => {
      if (busy) return;
      busy = true;
      const dir = k > i ? 1 : -1, out = pages[i];
      const params = new URLSearchParams(location.search);
      params.set("issue", numbers[k]);
      params.delete("at");
      history.replaceState(history.state, "", `?${params}`);
      box.style.minHeight = `${box.offsetHeight}px`;
      box.classList.add("moving");
      out.classList.add("leaving");
      const shown = enter(k);
      const options = { duration: motion.matches ? 0 : GLIDE, easing: EASE };
      out.animate([{ transform: "none" }, { transform: `translateX(calc(${-dir} * (100vw + 10px)))` }], options);
      shown.animate([{ transform: `translateX(calc(${dir} * (100vw + 10px)))` }, { transform: "none" }], options);
      const cancel = () => { stop(); removeEventListener("touchstart", cancel); removeEventListener("wheel", cancel); };
      const stop = glide(scrollY, 0, (top) => scrollTo(0, top));
      addEventListener("touchstart", cancel, { passive: true });
      addEventListener("wheel", cancel, { passive: true });
      setTimeout(() => {
        out.classList.remove("leaving");
        box.classList.remove("moving");
        box.style.minHeight = "";
        removeEventListener("touchstart", cancel);
        removeEventListener("wheel", cancel);
        busy = false;
      }, options.duration);
    };
  }

  // 말머리만 단 요약 소제목 바로 아래의 목록은 그 소제목의 결론이므로, 접기 전에 목록을 소제목 안으로 옮긴다.
  function heads(title) {
    const head = [...report.querySelectorAll("h2")].find((h) => h.textContent.trim() === title);
    for (let node = head?.nextElementSibling; node && node.tagName !== "H2"; node = node.nextElementSibling) {
      const list = node.nextElementSibling;
      if (node.tagName === "H3" && node.textContent.trim() === node.querySelector("mark")?.textContent.trim() && list?.tagName === "UL") {
        list.className = "heads";
        node.append(list);
      }
    }
  }
  // 절 안의 `###`(depth 3)이나 `####`(depth 4) 소제목마다 접기 상자를 만든다. 말머리가 `keep`에 든 소제목은 접지 않는다.
  const level = (node) => (/^H\d$/.test(node.tagName) ? +node.tagName[1] : 9);
  function fold(title, depth = 3, keep = []) {
    const head = [...report.querySelectorAll("h2")].find((h) => h.textContent.trim() === title);
    if (!head) return;
    const heads = [];
    for (let node = head.nextElementSibling; node && node.tagName !== "H2"; node = node.nextElementSibling) {
      if (level(node) === depth && !keep.includes(node.querySelector("mark")?.textContent.trim())) heads.push(node);
    }
    wrap(heads, depth);
  }
  // 소제목마다 소제목만 보이는 접기 상자를 만들고, 같은 깊이나 더 얕은 다음 소제목 앞까지의 노드를 그 안에 넣는다.
  function wrap(heads, depth) {
    heads.forEach((h3) => {
      const box = document.createElement("details");
      box.className = "fold";
      const summary = document.createElement("summary");
      h3.before(box);
      let node = h3.nextElementSibling;
      summary.appendChild(h3);
      const body = Object.assign(document.createElement("div"), { className: "body" });
      box.append(summary, body);
      while (node && level(node) > depth) {
        const next = node.nextElementSibling;
        body.appendChild(node);
        node = next;
      }
      summary.addEventListener("click", (event) => {
        event.preventDefault();
        setFold(box, !(box.want ?? box.open));
      });

    },
    // 주별 선: 점마다 [날짜, 값, 글자]이고 세로축은 `min`에서 `max`까지다. 선은 회색이고 오늘 점만 흰 점으로 찍어 그 위에 값을 적는다.

    },
    // 일별 선: 점마다 [날짜, 값, 글자]이고, 지수 카드의 종가 선과 같은 모양으로 그린다. 가는 회색 선으로 점을 잇고, 가로축 아래에

    // 봉 비율과 봉 하나가 묶는 기간과 값 글자(`candle`, `{ ratios, unit, label }`)를 받으면 선 대신 봉을 그리고, 세로축을 봉의 고가와 저가까지 담는다.
    // 최고·최저 글자는 가장 높은 고가와 가장 낮은 저가를 봉 위아래에 적고, 정규장 다음 세션 값은 다음 거래일이 든 기간의 흐린 잠정 봉(`candleLate`)으로 그린다.
    daily({ points, extra = null, kind = "regular", reach = 0, candle = null, height = FIGURE }) {
      const L = 4, R = 312, T = 22, B = height - 24, s = frame(height), values = points.map(([, v]) => v), days = points.map(([day]) => day), last = points.length - 1;
      const groups = candle && candleGroups(days, values, candle.ratios, candle.unit, last);

      const ends = extra == null ? shown : [...shown, extra], span = Math.max(1, last + reach);

        const high = groups.reduce((a, b) => (b[3] > a[3] ? b : a)), lowest = groups.reduce((a, b) => (b[4] < a[4] ? b : a));
        [[high, high[3], -5, "최고"], [lowest, lowest[4], 13, "최저"]].forEach(([[a, b], v, dy, text]) => {
          s.append(shape("text", { x: Math.min(Math.max(X((a + b) / 2), L + 36), R - 36), y: Y(v) + dy, "font-size": 11, fill: DIMS, "text-anchor": "middle" }, `${text} ${candle.label(v)}`));

        [[values.indexOf(hi), -7, "최고"], [values.indexOf(low), 15, "최저"]].forEach(([i, dy, text]) => {
          s.append(shape("circle", { cx: X(i), cy: Y(values[i]), r: 2.5, fill: PRICE }));
          s.append(shape("text", { x: Math.min(Math.max(X(i), L + 36), R - 36), y: Y(values[i]) + dy, "font-size": 11, fill: DIMS, "text-anchor": "middle" }, `${text} ${points[i][2]}`));

    },
    // 묶음 막대: 묶음마다 [이름, [[값, 글자], ...]]이고 막대는 0 가로선에서 위나 아래로 그린다. 세로축은 `min`에서 `max`까지다.
    // 묶음 안 막대가 여럿이면 묶음마다 마지막 막대를 흰색, 나머지를 회색으로 칠하고 `items`의 막대 이름을 그림 위에 범례로 적는다.
    // 묶음마다 막대가 하나면 마지막 묶음의 막대만 흰색이다. 값 글자는 막대 끝 바깥에 적는다.
    // 값 글자가 들어갈 폭(묶음 안 막대가 여럿이면 막대 하나의 폭과 간격, 하나면 묶음 하나의 폭)보다 길면 값 뒤 단위를 떼고 숫자만 적는다.
    // 단위는 카드 머리의 값 뒤에 있다. 막대가 하나인 묶음에서 숫자만 적어도 폭을 넘으면 흰 막대에만 값을 적는다.

    // 묶음 이름은 그림 아래에 적고, 묶음 하나의 폭보다 길면 마지막 띄어쓰기에서 두 줄로 나눈다.
    bars({ items = [], groups, min, max }) {
      const x0 = 6, x1 = 314, top = items.length > 1 ? 44 : 30, s = canvas(FIGURE), n = groups[0][1].length;
      const slot = (x1 - x0) / groups.length, gap = 4, w = Math.min(40, (slot * 0.62 - gap * (n - 1)) / n);
      const wrap = groups.some(([name]) => name.includes(" ") && textWidth(name, 12) > slot - 6), bottom = wrap ? 134 : 146;
      const Y = (v) => top + (bottom - top) * (max - Math.min(max, Math.max(min, v))) / (max - min), zero = Y(0);
      const room = n > 1 ? w + gap : slot - 4, texts = groups.flatMap(([, bars]) => bars.map(([, text]) => text));
      const short = texts.some((text) => textWidth(text, 12.5) > room), bare = (text) => (short ? text.replace(/[^\d.%]+$/, "") : text);
      const lit = (g, k) => (n > 1 ? k === n - 1 : g === groups.length - 1), left = (g) => x0 + slot * g + (slot - (w * n + gap * (n - 1))) / 2;
      const end = (v) => (Math.abs(Y(v) - zero) < 2 ? zero + (v >= 0 ? -2 : 2) : Y(v));
      const every = texts.every((text) => textWidth(bare(text), 12.5) <= room), placed = [], shown = new Set();
      if (n > 1) {
        const order = groups.flatMap(([, bars], g) => bars.map(([v, text], k) => ({ g, k, v, text })))
          .sort((a, b) => lit(b.g, b.k) - lit(a.g, a.k) || b.g - a.g);
        order.forEach(({ g, k, v, text }) => {
          const x = left(g) + k * (w + gap) + w / 2, half = textWidth(bare(text), 12.5) / 2, y = v >= 0 ? end(v) - 8 : end(v) + 17;
          const box = [x - half - 2, x + half + 2, y - 13, y + 3];

      groups.forEach(([name, bars], g) => {
        bars.forEach(([v, text], k) => {
          const x = left(g) + k * (w + gap), up = v >= 0, on = lit(g, k), edge = end(v);
          const r = Math.min(4, Math.abs(edge - zero) / 2, w / 2), tip = up ? r : -r;
          const bar = shape("path", { d: `M${x} ${zero}V${edge + tip}Q${x} ${edge} ${x + r} ${edge}H${x + w - r}Q${x + w} ${edge} ${x + w} ${edge + tip}V${zero}Z`,
                                      fill: on ? "#EAEAEA" : "#7A828C", opacity: on ? 1 : 0.55 });

                                                    "font-weight": 700, fill: on ? "#EAEAEA" : "#7A828C" }, bare(text)));
        });
        const cut = wrap ? name.lastIndexOf(" ") : -1, lines = cut > 0 ? [name.slice(0, cut), name.slice(cut + 1)] : [name];
        lines.forEach((line, j) => s.append(shape("text", { x: x0 + slot * (g + 0.5), y: bottom + 18 + 15 * j + (lines.length < 2 && wrap ? 7 : 0),

      if (items.length > 1) legend(s, items.map((item, k) => (k === n - 1 ? [item, "#EAEAEA", "box"] : [item, "#7A828C", "box", 0.55])), x1);

    // 표: `columns`는 열 이름, `rows`는 줄마다 칸 글자다. `focus` 열은 흰 글씨로 쓴다.

      const table = document.createElement("table"), cell = (tag, text, j) => Object.assign(document.createElement(tag), {
        textContent: text, className: j === focus ? "focus" : "" });
      table.createTHead().insertRow().append(...columns.map((text, j) => cell("th", text, j)));
      const body = table.createTBody();
      rows.forEach((row) => body.insertRow().append(...row.map((text, j) => cell("td", text, j))));
      return table;
    },
    // 0 기준 위아래 막대: 열마다 [이름, 값, 글자]이고, 가운데 0 가로선에서 양수는 위로, 음수는 아래로 그린다. 첫 열 막대와 글자는 흰색,
    // 나머지 열은 회색이다. 값 글자는 막대 끝 바깥에, 열 이름은 그림 아래에 적는다. 세로축은 위아래로 `max`까지이고, 그 끝에서 그림 끝까지는
    // 값 글자 한 줄을 적을 여백으로 남기고, `max`를 넘는 막대는 축 끝에서 자른다. `max`는 날마다 같아서 `step` 높이와 `-step` 높이의
    // 점선 가로선은 날짜를 바꿔도 같은 높이에 있다. 세로축 오른쪽 여백에는 `step` 높이에 인상을, `-step` 높이에 인하를 적는다.
    diverge({ rows, max, step }) {
      const x0 = 6, x1 = 262, top = 8, base = 148, mid = (top + base) / 2, reach = (base - top) / 2 - 18, s = canvas(FIGURE);
      const slot = (x1 - x0) / rows.length, w = Math.min(40, slot * 0.5), Y = (v) => mid - reach * Math.min(1, Math.max(-1, v / max));
      [step, -step].forEach((v) => s.append(shape("line", { x1: x0, y1: Y(v), x2: x1, y2: Y(v), stroke: "#7A828C", "stroke-width": 1, "stroke-dasharray": "3 3", opacity: 0.7 })));
      rows.forEach(([name, v, text], i) => {
        const x = x0 + slot * i + (slot - w) / 2, up = v >= 0, end = Math.abs(Y(v) - mid) < 2 ? mid + (up ? -2 : 2) : Y(v), first = i === 0;
        const r = Math.min(4, Math.abs(end - mid) / 2), tip = up ? r : -r;
        const bar = shape("path", { d: `M${x} ${mid}V${end + tip}Q${x} ${end} ${x + r} ${end}H${x + w - r}Q${x + w} ${end} ${x + w} ${end + tip}V${mid}Z`,
                                    fill: first ? "#EAEAEA" : "#7A828C", opacity: first ? 1 : 0.55 });
        bar.append(shape("title", {}, `${name} ${text}`));
        s.append(bar);
        s.append(shape("text", { x: x + w / 2, y: up ? end - 8 : end + 17, "text-anchor": "middle", "font-size": 12.5, "font-weight": 700,
                                 fill: first ? "#EAEAEA" : "#7A828C" }, text));
        s.append(shape("text", { x: x + w / 2, y: base + 20, "text-anchor": "middle", "font-size": 12, fill: first ? "#EAEAEA" : "#A7ABB0" }, name));
      });
      s.append(shape("line", { x1: x0, y1: mid, x2: x1, y2: mid, stroke: "#7A828C", "stroke-width": 1.2 }));
      [[Y(step), "인상"], [Y(-step), "인하"]].forEach(([y, name]) =>
        s.append(shape("text", { x: x1 + 10, y: y + 4, "font-size": 11, fill: "#7A828C" }, name)));
      return s;
    },
    // 사건 연표: 사건마다 [날짜, 이름]이고 위에서 아래로 앞선 사건부터 적는다. 세로선 위에 사건마다 점을 찍고, 마지막 사건은 흰 점과 흰 글씨로,
    // 앞선 사건은 회색으로 적는다. 날짜는 세로선 왼쪽에 끝을 맞춰 적고, 사건 사이 간격은 사건이 많을수록 좁힌다.

      events.forEach(([day, name], i) => {
        const last = i === n - 1;
        s.append(shape("text", { x: x - 14, y: Y(i) + 4, "text-anchor": "end", "font-size": 12, fill: last ? "#EAEAEA" : DIMS }, day));
        s.append(shape("circle", last ? { cx: x, cy: Y(i), r: 5.5, fill: "#EAEAEA", stroke: "#1d1e21", "stroke-width": 2 }
          : { cx: x, cy: Y(i), r: 4, fill: DIMS, stroke: "#1d1e21", "stroke-width": 2 }));
        s.append(shape("text", { x: x + 14, y: Y(i) + 4.5, "font-size": 13, "font-weight": last ? 700 : 400, fill: last ? "#EAEAEA" : "#A7ABB0" }, name));
      });
      return s;
    },
    // 지도: `view`의 경계 파일을 받아 그림 위 범례 아래에 그린다. `categories`는 [이름, 색], `regions`는 [지역 코드, 분류 번호],
    // `points`는 [이름, 경도, 위도, 분류 번호]다. 경계 파일을 받는 동안 그림에 `data-pending`을 단다.
    map(figure) {
      const top = 28, tall = figure.view === "us-states" ? 200 : 220, s = shape("svg", { viewBox: `0 0 320 ${top + tall}`, "data-pending": "" });
      const used = new Set(figure.regions.map(([, k]) => k));
      legend(s, figure.categories.map(([name, color], k) => [name, color, used.has(k) ? "box" : "dot"]));
      mapOf(figure.view).then((data) => drawMap(s, figure, data, top, tall)).finally(() => s.removeAttribute("data-pending"));
      return s;
    },
  };

  // 카드 값 하나로 지표 카드를 만든다. 위 줄에 이름과 기준일, 가운데 줄에 값·상태·보조 값, 아래에 그림이나 표를 둔다.
  // 값이 없는 카드는 가운데 줄을 두지 않고, 상태가 없는 카드는 상태를 적지 않는다.
  function gauge(c) {
    const box = Object.assign(document.createElement("div"), { className: "gauge" });
    const top = box.appendChild(Object.assign(document.createElement("div"), { className: "top" }));
    const name = top.appendChild(Object.assign(document.createElement("span"), { className: "name", textContent: c.name }));
    top.append(Object.assign(document.createElement("span"), { className: "asof", textContent: c.asof }));
    if (c.value != null) {
      const val = box.appendChild(Object.assign(document.createElement("div"), { className: "val" }));
      const number = val.appendChild(Object.assign(document.createElement("b"), { textContent: c.value }));
      if (c.unit) number.append(Object.assign(document.createElement("small"), { textContent: c.unit }));
      if (c.state) {
        const state = val.appendChild(Object.assign(document.createElement("span"), { className: "state", style: `color:${c.state[1]}` }));
        state.append(document.createElement("i"), c.state[0]);
      }
      if (c.note) val.append(Object.assign(document.createElement("span"), { className: "note", textContent: c.note }));
    }
    if (c.figure) box.appendChild(GAUGES[c.figure.type](c.figure)).classList.add("figure");
    return [box, name];
  }

  // 종목 상세(`stock`)를 이슈 화면과 같은 틀에 그린다. `data`는 `build.py` `stock_pages`가 적는 `r/stocks/{티커}.json`이다.
  // 대표 이미지(`images`)가 있으면 절 제목 위에 이슈 그림과 같은 모양으로 싣고, 두 장 이상이면 넘기기 묶음에 담는다.
  // 절 제목은 "나스닥 시총 3위"처럼 지도 지수의 이름과 그 지수 안 시가총액 순위다. 위쪽 한 줄 띠와 창 제목에는 종목 이름을 쓴다.
  // 첫 상자에는 주가 카드와 기업 설명을 둔다. 주가 카드는 이름 자리에 종목 이름과 티커를 쓰고, 마지막 종가와 앞 세션 종가 대비 등락률을 쓰며,
  // 그림 아래 −·+ 단추로 1년, 6개월, 3개월 가운데 기간을 골라 일별 종가 선을 다시 그린다. 종가가 기간보다 짧으면 있는 종가를 모두 그리고, 같은 그림이 되는 기간은 하나만 둔다.
  // 단추 사이의 점 묶음은 누른 채 끌어 기간을 바로 고른다(`zoomDrag`). 봉 비율(`candles`)이 있으면 그 줄 오른쪽 끝에 선·봉 단추(`kindButton`)를 두고, 봉 그림이면 종가 선 대신 1년은 주봉, 6개월·3개월은 일봉을 그린다.
  // 처음에는 가장 짧은 기간을 그린다.
  // 카드 맨 위 줄에는 기준일 글씨를 쓰고, 그 아래 이름 줄에 종목 이름과 티커를 쓴다.
  // 마지막 종가 날짜의 애프터장 체결가(`r/market.json` 지도 값, 없으면 `r/afterhours.json`의 체결가)나 그 다음 프리장 체결가(`r/premarket.json`)가 있으면 이름 줄 오른쪽에
  // 정규장·애프터장이나 정규장·프리장 단추를 둔다. 두 값이 다 있으면 프리장 값을 쓴다.
  // 정규장 다음 단추를 고르면 값과 등락률을 그 체결가와 마지막 종가 대비 등락률로 바꿔 회색으로 쓰고, 그림에 그 체결가를 점선으로 잇는다.
  // 처음 고르는 세션은 주소의 `session`이고, 주소에 없으면 가장 늦은 세션이다.
  // 프리장 값이 리포트 날짜의 정규장 값이면 단추를 정규장 단추 하나로 줄이고, 그 체결가와 등락률을 등락률 색으로 쓰며 그림에 점선으로 잇는다.
  // 공시 상세 절은 탭 띠와 넘기기 묶음에 실적, 매출 구성, 최근 공시 카드를 담는다. 카드 이름 뒤 물음표 단추는 카드의 `help` 문단을 보여 주고, 그림 아래에 해설(`text`)을 둔다.
  // 재무 값이 없는 카드는 그림과 해설 대신 안내 문장(`empty`)을 쓴다. 카드가 없으면 공시 상세 절을 두지 않는다.
  function stockDetail(data) {
    document.title = data.name;
    document.getElementById("issue-bar").textContent = data.name;
    const head = Object.assign(document.createElement("h2"), { className: "issues inside" });
    const label = head.appendChild(Object.assign(document.createElement("span"), { textContent: `${INDEX_NAME[data.index]} 시총 ${data.rank}위` }));
    const box = Object.assign(document.createElement("div"), { className: "issue-box inside" });
    const page = box.appendChild(Object.assign(document.createElement("div"), { className: "issue-page on" }));
    report.replaceChildren(head, box);
    if (data.images?.length) {
      const figure = Object.assign(document.createElement("figure"), { className: "issue-image" });
      for (const image of data.images) {
        const photo = figure.appendChild(Object.assign(document.createElement("figure"), { className: "photo" }));
        const frame = photo.appendChild(Object.assign(document.createElement("div"), { className: "frame" }));
        const img = frame.appendChild(Object.assign(document.createElement("img"), { src: image.src, width: image.width, height: image.height, alt: "" }));
        img.addEventListener("click", () => viewer(img));
        frame.append(Object.assign(document.createElement("span"), { className: "ai", textContent: "AI 생성 이미지" }));
        photo.append(Object.assign(document.createElement("figcaption"), { textContent: image.caption }));
      }
      head.before(figure);
      gallery(figure);
    }
    backward(["stock", "session"], 2);
    const closes = data.closes, last = closes.length - 1;
    if (last > 0) {
      const [day, now] = closes[last], change = (now / closes[last - 1][1] - 1) * 100;
      const label = (v) => `$${Math.round(v).toLocaleString("en-US")}`, points = closes.map(([d, v]) => [d, v, label(v)]);
      const candles = data.candles?.some(Boolean) ? data.candles : null;
      const SPAN = [...new Set([252, 126, 63].map((days) => Math.min(days, closes.length)))];
      let span = SPAN.length - 1;
      // 그림 높이는 지수 카드의 그림 높이와 같다.
      const PLOT = 236;
      // 고른 기간의 봉 그림 설정. 선 그림이면 null이다.
      const candle = () => (candleOn && candles ? { ratios: candles.slice(-SPAN[span]), unit: candleUnit(SPAN[span]), label } : null);
      const color = change > 0 ? "#ff5c5c" : change < 0 ? "#5b9bff" : DIMS;
      const [card] = gauge({ name: `${data.name} ${data.symbol}`, asof: sessionAt("정규장", closeAt(day)), value: price(now, "달러"),
        state: [`${signed(change)}%`, color], figure: { type: "daily", points: points.slice(-SPAN[span]), candle: candle(), height: PLOT } });
      const top = card.querySelector(".top"), asof = card.querySelector(".asof"), value = card.querySelector(".val b"), state = card.querySelector(".state");
      top.classList.add("title");
      card.prepend(Object.assign(document.createElement("div"), { className: "top" }));
      card.firstChild.append(asof);
      asof.classList.add("kind");
      asof.dataset.kind = "regular";
      // `after`는 마지막 종가 날짜의 애프터장 마지막 체결가(`r/market.json` 지도 값)이고, `tail`은 그 체결가가 아직 없을 때 쓰는 애프터장 값이며,
      // `early`는 그 다음 프리장이나 정규장 값이다. 없으면 null이다.
      const asked = query.get("session"), date = `${key.slice(0, 4)}-${key.slice(4, 6)}-${key.slice(6, 8)}`;
      let late = asked !== "regular", after = null, tail = null, early = null;
      // 정규장 다음 세션의 종류와 [체결가, 기준 시각 글씨, 세션 종류]. 없으면 null이다.
      const kindOf = () => (early ? (early.regular ? "regular" : "pre") : "after");
      const extra = () => early ? [early.price, sessionAt(early.regular ? "정규장" : "프리마켓", early.time), kindOf()]
        : after != null ? [after, sessionAt("애프터마켓", afterEnd(day)), "after"]
        : tail ? [tail.price, sessionAt("애프터마켓", tail.time), "after"] : null;
      // 가로축은 단추와 관계없이 다음 세션 값이 있으면 다음 거래일까지 담아, 단추를 바꿔도 종가 선이 움직이지 않는다.
      const plot = () => {
        const shown = extra();
        return GAUGES.daily({ points: points.slice(-SPAN[span]), extra: late && shown ? shown[0] : null, kind: shown?.[2], reach: shown ? 1 : 0, candle: candle(), height: PLOT });
      };
      const seg = sessionSeg((on) => { late = on; repaint(); });
      const repaint = () => {
        if (early?.regular) late = true;
        const shown = extra(), on = late && shown, move = on ? (shown[0] / now - 1) * 100 : change;
        const kind = kindOf();
        seg.rename(kind);
        seg.mark(late);
        if (shown) top.append(seg.box); else seg.box.remove();
        asof.textContent = on ? shown[1] : sessionAt("정규장", closeAt(day));
        asof.dataset.kind = on ? kind : "regular";
        value.textContent = price(on ? shown[0] : now, "달러");
        card.classList.toggle("ext", !!on && !early?.regular);
        state.lastChild.textContent = `${signed(move)}%`;
        state.style.color = on && !early?.regular ? "" : move > 0 ? "#ff5c5c" : move < 0 ? "#5b9bff" : DIMS;
        card.querySelector(":scope > svg").replaceWith(plot());
      };
      const zoom = card.appendChild(Object.assign(document.createElement("div"), { className: "foot" }))
        .appendChild(Object.assign(document.createElement("div"), { className: "zoom" }));
      zoom.innerHTML = `<button type="button" aria-label="기간 늘리기">−</button><span class="steps">${"<i></i>".repeat(SPAN.length)}</span><button type="button" aria-label="기간 줄이기">+</button>`;
      const [wider, narrower] = zoom.querySelectorAll("button");
      const level = () => {
        wider.disabled = span === 0;
        narrower.disabled = span === SPAN.length - 1;
        zoom.querySelectorAll(".steps i").forEach((dot, i) => dot.classList.toggle("on", i === span));
      };
      const move = (by) => {
        const next = Math.max(0, Math.min(SPAN.length - 1, span + by));
        if (next === span) return;
        span = next;
        card.querySelector(":scope > svg").replaceWith(plot());
        level();
      };
      wider.addEventListener("click", () => { feelPress(); move(-1); });
      narrower.addEventListener("click", () => { feelPress(); move(1); });
      zoomDrag(zoom.querySelector(".steps"), () => span, (i) => move(i - span));
      level();
      if (candles) zoom.append(kindButton(() => card.querySelector(":scope > svg").replaceWith(plot())));
      page.append(card);
      marketed.then(({ map }) => {
        const own = map?.[data.index]?.stocks.find((stock) => stock.symbol === data.symbol);
        after = own?.after?.[map[data.index].dates.indexOf(day)] ?? null;
        repaint();
      });
      onLive((found) => {
        const own = found.early[data.index]?.[date], value = own?.session === day ? own.stocks[data.symbol] ?? null : null;
        const behind = found.after[data.index]?.[day], price = behind?.stocks[data.symbol] ?? null;
        if (value === early?.price && own?.time === early?.time && price === tail?.price && behind?.time === tail?.time) return;
        early = value == null ? null : { price: value, time: own.time, regular: own.phase === "regular" };
        tail = price == null ? null : { price, time: behind.time };
        repaint();
      });
    }
    if (data.about) page.append(Object.assign(document.createElement("h4"), { innerHTML: "<mark>기업 설명</mark>" }),
                               Object.assign(document.createElement("p"), { textContent: data.about }));
    if (!data.cards.length) return;
    const filings = Object.assign(document.createElement("h2"), { className: "issues inside", textContent: "공시 상세" });
    box.after(filings);
    const slides = data.cards.map((c) => {
      const [card, name] = gauge(c);
      name.append(question(c.name, () => c.help.map((text) => Object.assign(document.createElement("p"), { textContent: text }))));
      const text = c.empty || c.text;
      if (text) card.append(Object.assign(document.createElement("p"), { className: c.empty ? "empty" : "", textContent: text }));
      return [card];
    });
    const bar = Object.assign(document.createElement("div"), { className: "tabs glide" });
    bar.innerHTML = '<div class="strip"></div>';
    const strip = bar.firstChild;
    data.cards.forEach((c, i) => {
      const button = Object.assign(document.createElement("button"), { textContent: c.tab });
      button.addEventListener("click", () => carousel.go(i));
      strip.appendChild(button);
    });
    const change = (i) => [...strip.children].forEach((button, j) => button.classList.toggle("on", i === j));
    filings.after(bar);
    const carousel = slider(slides, bar, { fit: true, change, name: "filings", feel: true });
    carousel.prepend(bar);
    change(0);
  }

  // 이슈 그래프 자리에 카드를 그리고, 카드 값에 그래프 설명(`caption`)이 있으면 카드 아래에 사진 설명과 같은 글씨로 단다.
  // 카드 값은 `build.py`가 그림에 단 `data-card`다.
  function issueChart(figure) {
    const c = JSON.parse(figure.dataset.card);
    figure.append(gauge(c)[0]);
    if (c.caption) figure.append(Object.assign(document.createElement("figcaption"), { textContent: c.caption }));
  }

  // 상세 이슈 해설의 이슈 그래프 자리에 카드를 그린다.
  function issueCharts() {
    report.querySelectorAll("figure.issue-chart[data-card]").forEach(issueChart);
  }

  // 미국 거시 지표를 지표마다 한 장의 카드로 바꿔 넘기는 묶음으로 만들고, 위에 지표 이름 탭 띠를 둔다. 카드 값은 `build.py`가
  // 소제목에 단 `data-card`를 쓰고, 해설은 소제목 뒤 문단이며 해설이 없으면 카드에 해설 문단을 두지 않는다. 카드 값이 없는 소제목은 해설과 함께 지우고, 카드가 하나도 없으면 절을 지운다.
  // 탭을 누르면 그 지표로 넘기고, 넘기면 보고 있는 지표의 탭을 밝힌다. 카드 아래 점은 보고 있는 장을 따른다.
  // 카드 이름 뒤의 물음표 단추는 그 지표의 `help` 문단을 보여 준다. 카드의 그림과 해설 사이에는 날짜 슬라이더를 둔다(`indicatorRewind`).
  // 일별 선 그림(`daily`)을 그리는 유가 카드는 WTI 봉 비율(`r/candles.json`의 `oil`)이 오면 그림 아래 줄 오른쪽 끝에 선·봉 단추(`kindButton`)를 두고,
  // 봉 그림이면 그림이 담는 1년을 주봉으로 그린다(`candleUnit`). 봉 비율은 미국 장 날짜를 키로 적고 그림의 날짜는 그 하루 뒤이므로, 그림의 날짜에서 하루를 빼서 찾는다.
  function indicators(date) {
    const head = [...report.querySelectorAll("h2")].find((h) => h.textContent.trim() === "미국 거시 지표");
    if (!head) return;
    // 첫 소제목 앞의 노드는 그대로 두고 묶음을 그 뒤에 둔다.
    const cards = [];
    let card = null, started = false, anchor = head;
    for (let node = head.nextElementSibling; node && node.tagName !== "H2";) {
      const next = node.nextElementSibling;
      if (node.tagName === "H3") {
        started = true;
        card = node.dataset.card ? { name: node.textContent.trim(), ...JSON.parse(node.dataset.card), text: [] } : null;
        if (card) cards.push(card);
      } else if (card) card.text.push(node.textContent.trim());
      if (started) node.remove(); else anchor = node;
      node = next;
    }
    if (!cards.length) {
      for (let node = head.nextElementSibling; node && node.tagName !== "H2";) { const next = node.nextElementSibling; node.remove(); node = next; }
      head.remove();
      return;
    }
    let oil = null;
    const figureOf = (figure) => {
      const ratios = oil && candleOn && figure.type === "daily"
        ? figure.points.map(([day]) => oil[new Date(Date.parse(day) - 864e5).toISOString().slice(0, 10)] ?? null) : null;
      const drawn = GAUGES[figure.type](ratios ? { ...figure, candle: { ratios, unit: candleUnit(figure.points.length), label: (v) => `$${v.toFixed(2)}` } } : figure);
      drawn.classList.add("figure");
      return drawn;
    };
    // `paints[k](figure)`는 k번째 카드의 그림을 `figure`로 다시 그리고, `figure`를 주지 않으면 마지막으로 그린 값으로 다시 그린다.
    const spots = [], paints = [], daily = [];
    const slides = cards.map((c) => {
      const [box, name] = gauge(c);
      name.append(question(c.name, () => c.help.map((text) => Object.assign(document.createElement("p"), { textContent: text }))));
      let figure = c.figure;
      const paint = (next = figure) => { figure = next; box.querySelector(":scope > .figure")?.replaceWith(figureOf(figure)); };
      paints.push(paint);
      if (figure?.type === "daily") daily.push([box, paint]);
      spots.push(box.appendChild(document.createElement("div")));
      const text = c.text.filter(Boolean).join(" ");
      if (text) box.append(Object.assign(document.createElement("p"), { textContent: text }));
      return [box];
    });
    const bar = document.createElement("div");
    bar.className = "tabs glide";
    bar.innerHTML = '<div class="strip"></div>';
    const strip = bar.firstChild;
    cards.forEach((c, i) => {
      const button = Object.assign(document.createElement("button"), { textContent: c.tab });
      button.addEventListener("click", () => box.go(i));
      strip.appendChild(button);
    });
    let seen = 0;
    const change = (i) => {
      [...strip.children].forEach((button, j) => button.classList.toggle("on", i === j));
      const room = Math.max(0, strip.scrollWidth - (bar.clientWidth - 32));
      strip.style.transform = `translateX(${-Math.min(room, strip.children[(seen = i)].offsetLeft)}px)`;
    };
    anchor.after(bar);
    const box = slider(slides, bar, { fit: true, change, name: "indicators", area: head, feel: true });
    box.prepend(bar);
    change(seen);
    new ResizeObserver(() => {
      strip.style.transition = "none";
      change(seen);
      strip.getBoundingClientRect();
      strip.style.transition = "";
    }).observe(box);
    indicatorRewind(cards, spots, paints, date);
    candled.then((found) => {
      if (!found.oil) return;
      oil = found.oil;
      daily.forEach(([box, paint]) => {
        const foot = Object.assign(document.createElement("div"), { className: "foot" });
        box.querySelector(":scope > .figure").after(foot);
        foot.appendChild(Object.assign(document.createElement("div"), { className: "zoom" })).append(kindButton(() => paint()));
        if (candleOn) paint();
      });
    });
  }

  // 지표 카드마다 그림과 해설 사이의 자리 `spots`에 지난 리포트 날짜로 되감는 슬라이더를 둔다(build.py `r/rewind-{지수}/indicators.json`).
  // 리포트 날짜와 그 앞 날짜 가운데 그 지표의 카드 값이 있는 날짜만 고를 수 있고, 리포트 날짜에 카드 값이 없는 지표에는 슬라이더를 두지 않는다.
  // 날짜를 고르면 그날 카드 값으로 그 카드의 기준일·값·그림만 다시 그리고, 이름과 물음표 단추, 해설은 리포트 날짜의 것을 그대로 둔다.
  function indicatorRewind(cards, spots, paints, date) {
    fetch(`r/rewind-${key.split("-")[1]}/indicators.json`, { cache: "no-cache" }).then((r) => (r.ok ? r.json() : null)).then((data) => {
      if (!data) return;
      const frames = data.frames.filter((frame) => frame.day <= date && rewindOffset(frame.day, date) >= 0);
      cards.forEach((c, k) => {

    "상세 이슈 해설": [
      ["이슈를 고르는 기준", "주가 예측에 영향이 큰 이슈부터 보여줘요. 이슈 하나를 빼고 다시 계산했을 때 예측이 크게 바뀔수록 영향이 커요."],
      ["상승 요인과 하락 요인", "이슈 때문에 주가 예측이 올랐는지 내렸는지 보여줘요. 나쁜 소식도 반등 가능성을 높이면 상승 요인이에요."],
      ["히스토리", "같은 이슈를 다룬 지난 리포트의 해설 제목이에요. 제목을 누르면 그날의 해설이 나와요."],
    ],
    "이벤트 캘린더": [
      ["이벤트 확률표", "앞으로 35일 안에 발표되는 이벤트마다 가능한 결과와 확률을 보여줘요. 이벤트는 주가에 반영되는 거래일에 모아요. 장 마감 뒤나 휴일에 나온 발표는 다음 거래일에 두고 발표일을 함께 적어요. 주가 경로 2만 개를 만들 때 이벤트 확률을 써요."],
      ["확률 변화", "어제 리포트의 확률과 오늘 확률의 차이를 %p로 보여줘요."],
      ["실제 결과", "결과가 나온 다음 날에는 실제로 일어난 결과를 표시해요."],
    ],
  };
  const QUESTION = '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1"/>'
    + '<path d="M6.2 6.2a1.8 1.8 0 1 1 2.6 1.6c-.5.3-.8.6-.8 1.2v.4" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>'
    + '<circle cx="8" cy="11.6" r=".8" fill="currentColor"/></svg>';
  // 그림 카드가 없는 리포트의 지수와 예측 설명. 첫 항목 이름은 카드 탭과 같은 리포트 지수의 이름이다.
  const OUTLOOK_HELP = (name) => [
    [name, "파란 실선은 예측 중앙값이에요. 파란 면에는 25거래일 뒤 가격이 25~75% 확률로 들어와요. 회색 점과 면은 지난 리포트의 예측이에요."],
    ["일정", "이슈와 이벤트를 반영한 경로 2만 개의 등락률 분포예요. 두 파란 선 사이에 경로의 가운데 50%가 들어와요."],
    ["권장 배율", "경로 2만 개의 한 달 평균 등락을 배율로 바꾼 분포예요. 파란 실선이 1.0(지수 추종)보다 왼쪽이면 하락 쪽 판단이고, 오른쪽이면 상승 쪽 판단이에요."],
  ];
  // 그림 카드가 있는 리포트의 지수와 예측 설명. 판단 색 이름은 지수마다 다르다.
  const CARD_HELP = (ink, name) => [
    [name, `예측한 25거래일 뒤 가격 범위의 중앙값을 알려드려요. ${ink} 면에는 25거래일 뒤 가격이 50% 확률로 들어와요. 회색 점선과 면은 지난 리포트의 예측이에요.`],
    ["일정", `이슈와 이벤트를 반영한 주가 경로 2만 개로 거래일마다 등락률 범위를 계산해요. 진한 면에 경로의 가운데 50%가, 옅은 면에 가운데 80%가 들어와요.`],
    ["권장 배율", `${ink} 세로선이 권장 배율이에요. 권장 배율이 1.0(지수 추종)보다 작으면 리포트가 하락을 예상한다는 뜻이고, 크면 상승을 예상한다는 뜻이에요.`],
  ];
  const INK = { nasdaq: "하늘색", biotech: "보라색" };
  // 설명이 있는 절 제목 뒤에 물음표 단추를 넣는다. 단추는 글자를 담지 않으므로 절 제목 글자로 절을 찾는 `paginate`와 이벤트 캘린더 찾기가 그대로 동작한다. `section`이 절 제목 안을 바꿔 쓴 뒤에 부른다.
  function help() {
    report.querySelectorAll("h2").forEach((head) => {
      const title = head.textContent.trim(), index = key.split("-")[1];
      if (title !== "지수와 예측" && !HELP[title] && !(title === "한 눈에 보기" && GLANCE_HELP[index])) return;
      const items = title === "한 눈에 보기" ? GLANCE_HELP[index] : title !== "지수와 예측" ? HELP[title]
        : report.querySelector(".carousel.cards") ? CARD_HELP(INK[index] || "하늘색", INDEX_NAME[index]) : OUTLOOK_HELP(INDEX_NAME[index]);
      head.append(question(title, () => {
        const list = document.createElement("ul");
        items.forEach(([name, text]) => {
          const li = list.appendChild(document.createElement("li"));
          li.append(Object.assign(document.createElement("b"), { textContent: name }), text);
        });
        return [list];
      }));
    });
  }

  // 누르면 `title`을 제목으로, `body`가 돌려준 노드를 본문으로 쓴 설명 상자를 띄우는 물음표 단추.
  function question(title, body) {
    const button = document.createElement("button");
    button.className = "help";
    button.setAttribute("aria-label", `${title} 설명`);
    button.innerHTML = QUESTION;
    button.addEventListener("click", () => {
      const box = document.createElement("div");
      box.className = "help-card";
      const card = box.appendChild(document.createElement("div"));
      card.className = "card";
      const h3 = card.appendChild(document.createElement("h3"));
      h3.append(title);
      const close = h3.appendChild(Object.assign(document.createElement("button"), { textContent: "✕" }));
      close.setAttribute("aria-label", "닫기");
      card.append(...body());
      box.addEventListener("click", (event) => { if (event.target === box || close.contains(event.target)) box.remove(); });
      document.body.append(box);
    });
    return button;
  }

  // 이슈 그림 묶음에 그림이 두 장 이상이면 그림과 사진 설명을 넘기기 묶음에 싣고, 묶음 아래에 장마다 점을 찍는다.
  function gallery(figure) {
    const photos = [...figure.querySelectorAll(":scope > figure.photo")];
    if (photos.length < 2) return;
    const dots = document.createElement("div");
    dots.className = "dots";
    photos.forEach((_, k) => dots.appendChild(document.createElement("i")).addEventListener("click", () => box.go(k)));
    const mark = figure.insertBefore(document.createElement("span"), photos[0]);
    const box = slider(photos.map((photo) => [photo]), mark, { feel: true, change: (i) => [...dots.children].forEach((dot, k) => dot.classList.toggle("on", k === i)) });
    mark.remove();
    box.after(dots);
  }

  function viewer(img) {
    const box = document.createElement("div");
    box.className = "viewer";
    // 되감기 슬라이더가 원래 그림을 숨기고 canvas를 보이므로, 크게 보는 그림은 숨김을 풀어 띄운다.
    const large = img.cloneNode();
    large.style.display = "";
    box.append(large);
    document.body.append(box);
    const carousel = img.closest(".carousel");
    const group = carousel ? [...carousel.querySelectorAll("img")] : [img];
    let index = group.indexOf(img), swipe = null;
    let scale = 1, x = 0, y = 0, start = null, moved = false;
    const place = () => {
      const fit = (offset, size, room, at) => size * scale <= room ? (size - size * scale) / 2
        : Math.min(-at, Math.max(room - at - size * scale, offset));
      x = fit(x, large.offsetWidth, box.clientWidth, large.offsetLeft);
      y = fit(y, large.offsetHeight, box.clientHeight, large.offsetTop);
      large.style.transform = `translate(${x + (swipe ? swipe.dx : 0)}px, ${y}px) scale(${scale})`;
    };
    // 묶음의 i번 그림으로 바꾸고, 닫았을 때 그 그림이 보이도록 뒤의 묶음도 함께 넘긴다.
    const show = (i) => {
      index = i;
      large.src = group[i].src;
      scale = 1; x = 0; y = 0;
      large.style.transform = "";
      carousel.go([...carousel.querySelector(".track").children].indexOf(group[i].closest(".slide")));
    };
    const touches = (event) => {
      const [a, b = a] = event.touches;
      return { mid: [(a.clientX + b.clientX) / 2 - large.offsetLeft, (a.clientY + b.clientY) / 2 - large.offsetTop],
               gap: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), count: event.touches.length };
    };
    box.addEventListener("touchstart", (event) => {
      if (event.touches.length === 1) moved = false;
      start = { ...touches(event), scale, x, y };
      swipe = event.touches.length === 1 && scale === 1 && group.length > 1 ? { dx: 0, dy: 0 } : null;
    }, { passive: true });
    box.addEventListener("touchmove", (event) => {
      event.preventDefault();
      const now = touches(event);
      if (now.count !== start.count) { start = { ...now, scale, x, y }; swipe = null; }
      if (swipe) {
        swipe = { dx: now.mid[0] - start.mid[0], dy: now.mid[1] - start.mid[1] };
        if (Math.hypot(swipe.dx, swipe.dy) > 8) moved = true;
        place();
        return;
      }
      if (now.count === 2) scale = Math.min(5, Math.max(1, start.scale * now.gap / start.gap));
      const ratio = scale / start.scale;
      x = now.mid[0] - (start.mid[0] - start.x) * ratio;
      y = now.mid[1] - (start.mid[1] - start.y) * ratio;
      if (now.count === 2 || Math.hypot(now.mid[0] - start.mid[0], now.mid[1] - start.mid[1]) > 8) moved = true;
      place();
    }, { passive: false });
    box.addEventListener("touchend", (event) => {
      if (event.touches.length) { start = { ...touches(event), scale, x, y }; swipe = null; return; }
      if (!swipe) return;
      const next = index + (swipe.dx < 0 ? 1 : -1);
      const turn = Math.abs(swipe.dx) > 50 && Math.abs(swipe.dx) > Math.abs(swipe.dy) && group[next];
      swipe = null;
      if (turn) show(next); else place();
    });
    box.addEventListener("click", () => { if (!moved) box.remove(); });
  }
</script>
</body>
</html>
