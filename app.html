      const w = (x1 - x0 - gap * (bars.length - 1)) / bars.length, Y = (v) => base - (base - top) * Math.min(1, Math.max(0, v / max));
      const mark = Y(bars[bars.length - 1][1]) - 12;
      lines.filter(([v]) => Math.abs(Y(v) - mark) > 12).forEach(([v, name]) => {
        s.append(shape("line", { x1: x0, y1: Y(v), x2: x1, y2: Y(v), stroke: "#7A828C", "stroke-width": 1, "stroke-dasharray": "3 3", opacity: 0.7 }));
        s.append(shape("text", { x: x1 + 10, y: Y(v) + 4, "font-size": 11, fill: "#7A828C" }, name));
      });
      bars.forEach(([day, v, text], i) => {
        const x = x0 + i * (w + gap), y = Y(v), r = Math.min(4, (base - y) / 2, w / 2), last = i === bars.length - 1;
        const bar = shape("path", { d: `M${x} ${base}V${y + r}Q${x} ${y} ${x + r} ${y}H${x + w - r}Q${x + w} ${y} ${x + w} ${y + r}V${base}Z`,
                                    fill: last ? "#EAEAEA" : "#7A828C", opacity: last ? 1 : 0.55 });
        bar.append(shape("title", {}, `${day} ${text}`));
        s.append(bar);
        if (last) s.append(shape("text", { x: x + w / 2, y: y - 8, "text-anchor": "middle", "font-size": 12.5, "font-weight": 700, fill: "#EAEAEA" }, text));
      });
      s.append(shape("line", { x1: x0, y1: base, x2: x1, y2: base, stroke: "#7A828C", "stroke-width": 1.2 }));
      [[x0, "start", bars[0][0]], [x1, "end", bars[bars.length - 1][0]]].forEach(([x, anchor, text]) => s.append(shape("text", {
        x, y: base + 20, "font-size": 12, fill: "#7A828C", "text-anchor": anchor }, text)));
      return s;
    },
    // 주별 선: 점마다 [날짜, 값, 글자]이고 세로축은 `min`에서 `max`까지다. 선은 회색이고 오늘 점만 흰 점으로 찍어 그 위에 값을 적는다.
    // `lines`는 [값, 이름]이고 세로 막대처럼 점선을 긋고 오른쪽 여백에 이름을 적는다. 오늘 값 글자와 높이가 겹치는 선은 긋지 않는다.
    // 날짜는 처음과 마지막 점 아래에만 적고, 점마다 선보다 넓은 투명 원을 두어 누르거나 올리면 그 주의 날짜와 값을 보여 준다.
    line({ points, min, max, lines = [] }) {
      const x0 = 10, x1 = 254, top = 30, base = 146, s = canvas(FIGURE);
      const X = (i) => x0 + (x1 - x0) * i / Math.max(1, points.length - 1);
      const Y = (v) => base - (base - top) * Math.min(1, Math.max(0, (v - min) / (max - min)));
      // 선이 위에서 내려와 마지막 점에 닿으면 값 글자를 점 아래에, 그 밖에는 점 위에 적는다.
      const [lx, ly] = [X(points.length - 1), Y(points[points.length - 1][1])];
      const below = points.length > 1 && Y(points[points.length - 2][1]) < ly && ly + 22 <= base + 4, mark = below ? ly + 22 : ly - 14;
      lines.filter(([v]) => Math.abs(Y(v) - mark) > 12).forEach(([v, name]) => {
        s.append(shape("line", { x1: 6, y1: Y(v), x2: 262, y2: Y(v), stroke: "#7A828C", "stroke-width": 1, "stroke-dasharray": "3 3", opacity: 0.7 }));
        s.append(shape("text", { x: 272, y: Y(v) + 4, "font-size": 11, fill: "#7A828C" }, name));
      });
      s.append(shape("polyline", { points: points.map(([, v], i) => `${X(i)},${Y(v)}`).join(" "), fill: "none", stroke: "#A7ABB0",
                                   "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
      s.append(shape("circle", { cx: lx, cy: ly, r: 5, fill: "#EAEAEA", stroke: "#1d1e21", "stroke-width": 2 }));
      s.append(shape("text", { x: lx, y: mark, "text-anchor": "end", "font-size": 12.5, "font-weight": 700, fill: "#EAEAEA" }, points[points.length - 1][2]));
      points.forEach(([day, v, text], i) => {
        const hit = shape("circle", { cx: X(i), cy: Y(v), r: 11, fill: "transparent" });
        hit.append(shape("title", {}, `${day} ${text}`));
        s.append(hit);
      });
      [[x0, "start", points[0][0]], [x1, "end", points[points.length - 1][0]]].forEach(([x, anchor, text]) => s.append(shape("text", {
        x, y: base + 20, "font-size": 12, fill: "#7A828C", "text-anchor": anchor }, text)));
      return s;
    },
    // 일별 선: 점마다 [날짜, 값, 글자]이고, 주가와 예측 카드의 종가 선과 같은 모양으로 그린다. 가는 회색 선으로 점을 잇고, 가로축 아래에
    // 달이 바뀌는 점마다 달 이름을 적는다. 달 이름과 선 굵기는 주가와 예측 카드가 같은 기간을 그릴 때와 같게 정한다.
    // 기간 안 최고·최저 점에 점을 찍어 글자를 적고, 오늘 점은 흰 점으로 찍는다. 세로축은 값의 최저에서 최고까지이고,
    // 최저 글자가 들어가게 최저 점 아래에 20px을 비운다.
    daily({ points }) {
      const L = 4, R = 312, T = 22, B = 154, s = canvas(FIGURE), values = points.map(([, v]) => v), last = points.length - 1;
      const hi = Math.max(...values), low = Math.min(...values), lo = low - (hi - low) * 20 / (B - T - 20);
      const X = (i) => L + (R - L) * i / Math.max(1, last), Y = (v) => B - (v - lo) / (hi - lo || 1) * (B - T);
      const perMonth = 21 * (R - L) / Math.max(1, last), fade = (months) => Math.max(0, Math.min(1, (months * perMonth - 30) / 12));
      points.forEach(([day], i) => {
        if (i && day.slice(0, 7) === points[i - 1][0].slice(0, 7)) return;
        const m = +day.slice(5, 7), opacity = fade(m % 6 === 0 ? 6 : m % 3 === 0 ? 3 : 1);
        if (X(i) >= L + 12 && opacity > 0) s.append(shape("text", { x: X(i), y: B + 17, "font-size": 11, fill: DIMS, "text-anchor": "middle", opacity }, `${m}월`));
      });
      s.append(shape("line", { x1: L, x2: R, y1: B, y2: B, stroke: DIMS, "stroke-width": 1 }));
      s.append(shape("path", { d: `M${points.map(([, v], i) => `${X(i)} ${Y(v)}`).join("L")}`, fill: "none", stroke: PRICE,
                               "stroke-width": 1.4 - .4 * Math.max(0, Math.min(1, (last - 63) / 693)), "stroke-linejoin": "round" }));
      [[values.indexOf(hi), -7, "최고"], [values.indexOf(low), 15, "최저"]].forEach(([i, dy, text]) => {
        s.append(shape("circle", { cx: X(i), cy: Y(values[i]), r: 2.5, fill: PRICE }));
        s.append(shape("text", { x: Math.min(Math.max(X(i), L + 36), R - 36), y: Y(values[i]) + dy, "font-size": 11, fill: DIMS, "text-anchor": "middle" }, `${text} ${points[i][2]}`));
      });
      s.append(shape("circle", { cx: X(last), cy: Y(values[last]), r: 2.5, fill: "#EAEAEA", stroke: "#171719", "stroke-width": 1 }));
      return s;
    },
    // 묶음 막대: 묶음마다 [이름, [[값, 글자], ...]]이고 막대는 0 가로선에서 위나 아래로 그린다. 세로축은 `min`에서 `max`까지다.
    // 묶음 안 막대가 여럿이면 묶음마다 마지막 막대를 흰색, 나머지를 회색으로 칠하고 `items`의 막대 이름을 그림 위에 범례로 적는다.
    // 묶음마다 막대가 하나면 마지막 묶음의 막대만 흰색이다. 값 글자는 막대 끝 바깥에 적는다.
    // 값 글자가 들어갈 폭(묶음 안 막대가 여럿이면 막대 하나의 폭과 간격, 하나면 묶음 하나의 폭)보다 길면 값 뒤 단위를 떼고 숫자만 적는다.
    // 단위는 카드 머리의 값 뒤에 있다. 막대가 하나인 묶음에서 숫자만 적어도 폭을 넘으면 흰 막대에만 값을 적는다.
    // 묶음 이름은 그림 아래에 적고, 묶음 하나의 폭보다 길면 마지막 띄어쓰기에서 두 줄로 나눈다.
    bars({ items = [], groups, min, max }) {
      const x0 = 6, x1 = 314, top = items.length > 1 ? 44 : 30, s = canvas(FIGURE), n = groups[0][1].length;
      const slot = (x1 - x0) / groups.length, gap = 4, w = Math.min(40, (slot * 0.62 - gap * (n - 1)) / n);
      const width = (text, size) => [...text].reduce((sum, c) => sum + (/[\x00-\x7f]/.test(c) ? 0.6 : 1) * size, 0);
      const wrap = groups.some(([name]) => name.includes(" ") && width(name, 12) > slot - 6), bottom = wrap ? 134 : 146;
      const Y = (v) => top + (bottom - top) * (max - Math.min(max, Math.max(min, v))) / (max - min), zero = Y(0);
      const room = n > 1 ? w + gap : slot - 4, texts = groups.flatMap(([, bars]) => bars.map(([, text]) => text));
      const short = texts.some((text) => width(text, 12.5) > room), bare = (text) => (short ? text.replace(/[^\d.%]+$/, "") : text);
      const lit = (g, k) => (n > 1 ? k === n - 1 : g === groups.length - 1), every = n > 1 || texts.every((text) => width(bare(text), 12.5) <= room);
      groups.forEach(([name, bars], g) => {
        const left = x0 + slot * g + (slot - (w * n + gap * (n - 1))) / 2;
        bars.forEach(([v, text], k) => {
          const x = left + k * (w + gap), up = v >= 0, end = Math.abs(Y(v) - zero) < 2 ? zero + (up ? -2 : 2) : Y(v), on = lit(g, k);
          const r = Math.min(4, Math.abs(end - zero) / 2, w / 2), tip = up ? r : -r;
          const bar = shape("path", { d: `M${x} ${zero}V${end + tip}Q${x} ${end} ${x + r} ${end}H${x + w - r}Q${x + w} ${end} ${x + w} ${end + tip}V${zero}Z`,
                                      fill: on ? "#EAEAEA" : "#7A828C", opacity: on ? 1 : 0.55 });
          bar.append(shape("title", {}, `${name} ${items[k] ?? ""} ${text}`.replace(/\s+/g, " ")));
          s.append(bar);
          if (every || on) s.append(shape("text", { x: x + w / 2, y: up ? end - 8 : end + 17, "text-anchor": "middle", "font-size": 12.5,
                                                    "font-weight": 700, fill: on ? "#EAEAEA" : "#7A828C" }, bare(text)));
        });
        const cut = wrap ? name.lastIndexOf(" ") : -1, lines = cut > 0 ? [name.slice(0, cut), name.slice(cut + 1)] : [name];
        lines.forEach((line, j) => s.append(shape("text", { x: x0 + slot * (g + 0.5), y: bottom + 18 + 15 * j + (lines.length < 2 && wrap ? 7 : 0),
                                                           "text-anchor": "middle", "font-size": 12, fill: "#A7ABB0" }, line)));
      });
      s.append(shape("line", { x1: x0, y1: zero, x2: x1, y2: zero, stroke: "#7A828C", "stroke-width": 1.2 }));
      if (items.length > 1) {
        let x = x1;
        [...items].reverse().forEach((item, j) => {
          const on = j === 0, label = shape("text", { x, y: 14, "text-anchor": "end", "font-size": 11.5, fill: "#A7ABB0" }, item);
          s.append(label);
          x -= label.getComputedTextLength?.() || item.length * 11.5;
          s.append(shape("rect", { x: x - 14, y: 5, width: 9, height: 9, rx: 2, fill: on ? "#EAEAEA" : "#7A828C", opacity: on ? 1 : 0.55 }));
          x -= 26;
        });
      }
      return s;
    },
    // 표: `columns`는 열 이름, `rows`는 줄마다 칸 글자다. `focus` 열은 흰 글씨로 쓴다.
    table({ columns, rows, focus }) {
      const table = document.createElement("table"), cell = (tag, text, j) => Object.assign(document.createElement(tag), {
        textContent: text, className: j === focus ? "focus" : "" });
      table.createTHead().insertRow().append(...columns.map((text, j) => cell("th", text, j)));
      const body = table.createTBody();
      rows.forEach((row) => body.insertRow().append(...row.map((text, j) => cell("td", text, j))));
      return table;
    },
    // 0 기준 위아래 막대: 열마다 [이름, 값, 글자]이고, 가운데 0 가로선에서 양수는 위로, 음수는 아래로 그린다. 첫 열 막대와 글자는 흰색,
    // 나머지 열은 회색이다. 값 글자는 막대 끝 바깥에, 열 이름은 그림 아래에 적는다. 세로축은 위아래로 `max`까지이고, 그 끝에서 그림 끝까지는
    // 값 글자 한 줄을 적을 여백으로 남긴다. `step` 높이와 `-step` 높이에는 막대 뒤에 점선 가로선을 긋고, 세로축 오른쪽 여백에는
    // `step` 높이에 인상을, `-step` 높이에 인하를 적는다. `max`가 커서 `step` 높이가 0 가로선과 7px보다 가까우면
    // 인상과 인하 글자가 서로 겹치지 않게 0 가로선에서 7px 떨어진 높이에 적는다.
    diverge({ rows, max, step }) {
      const x0 = 6, x1 = 262, top = 8, base = 148, mid = (top + base) / 2, reach = (base - top) / 2 - 18, s = canvas(FIGURE);
      const slot = (x1 - x0) / rows.length, w = Math.min(40, slot * 0.5), Y = (v) => mid - reach * Math.min(1, Math.max(-1, v / max));
      [step, -step].forEach((v) => s.append(shape("line", { x1: x0, y1: Y(v), x2: x1, y2: Y(v), stroke: "#7A828C", "stroke-width": 1, "stroke-dasharray": "3 3", opacity: 0.7 })));
      rows.forEach(([name, v, text], i) => {
        const x = x0 + slot * i + (slot - w) / 2, up = v >= 0, end = Math.abs(Y(v) - mid) < 2 ? mid + (up ? -2 : 2) : Y(v), first = i === 0;
        const r = Math.min(4, Math.abs(end - mid) / 2), tip = up ? r : -r;
        const bar = shape("path", { d: `M${x} ${mid}V${end + tip}Q${x} ${end} ${x + r} ${end}H${x + w - r}Q${x + w} ${end} ${x + w} ${end + tip}V${mid}Z`,
                                    fill: first ? "#EAEAEA" : "#7A828C", opacity: first ? 1 : 0.55 });
        bar.append(shape("title", {}, `${name} ${text}`));
        s.append(bar);
        s.append(shape("text", { x: x + w / 2, y: up ? end - 8 : end + 17, "text-anchor": "middle", "font-size": 12.5, "font-weight": 700,
                                 fill: first ? "#EAEAEA" : "#7A828C" }, text));
        s.append(shape("text", { x: x + w / 2, y: base + 20, "text-anchor": "middle", "font-size": 12, fill: "#A7ABB0" }, name));
      });
      s.append(shape("line", { x1: x0, y1: mid, x2: x1, y2: mid, stroke: "#7A828C", "stroke-width": 1.2 }));
      [[Math.min(Y(step), mid - 7), "인상"], [Math.max(Y(-step), mid + 7), "인하"]].forEach(([y, name]) =>
        s.append(shape("text", { x: x1 + 10, y: y + 4, "font-size": 11, fill: "#7A828C" }, name)));
      return s;
    },
  };

  // 카드 값 하나로 지표 카드를 만든다. 위 줄에 이름과 기준일, 가운데 줄에 값·상태·보조 값, 아래에 그림이나 표를 둔다.
  // 값이 없는 카드는 가운데 줄을 두지 않고, 상태가 없는 카드는 상태를 적지 않는다.
  function gauge(c) {
    const box = Object.assign(document.createElement("div"), { className: "gauge" });
    const top = box.appendChild(Object.assign(document.createElement("div"), { className: "top" }));
    const name = top.appendChild(Object.assign(document.createElement("span"), { className: "name", textContent: c.name }));
    top.append(Object.assign(document.createElement("span"), { className: "asof", textContent: c.asof }));
    if (c.value != null) {
      const val = box.appendChild(Object.assign(document.createElement("div"), { className: "val" }));
      const number = val.appendChild(Object.assign(document.createElement("b"), { textContent: c.value }));
      if (c.unit) number.append(Object.assign(document.createElement("small"), { textContent: c.unit }));
      if (c.state) {
        const state = val.appendChild(Object.assign(document.createElement("span"), { className: "state", style: `color:${c.state[1]}` }));
        state.append(document.createElement("i"), c.state[0]);
      }
      if (c.note) val.append(Object.assign(document.createElement("span"), { className: "note", textContent: c.note }));
    }
    box.append(GAUGES[c.figure.type](c.figure));
    return [box, name];
  }

  // 상세 이슈 해설의 이슈 그래프 자리에 카드를 그린다. 카드 값은 `build.py`가 그림에 단 `data-card`다.
  function issueCharts() {
    report.querySelectorAll("figure.issue-chart[data-card]").forEach((figure) => figure.append(gauge(JSON.parse(figure.dataset.card))[0]));
  }

  // 미국 거시 지표를 지표마다 한 장의 카드로 바꿔 넘기는 묶음으로 만들고, 위에 지표 이름 탭 띠를 둔다. 카드 값은 `build.py`가
  // 소제목에 단 `data-card`를 쓰고, 해설은 소제목 뒤 문단이다. 카드 값이 없는 소제목은 해설과 함께 지우고, 카드가 하나도 없으면 절을 지운다.
  // 탭을 누르면 그 지표로 넘기고, 넘기면 보고 있는 지표의 탭을 밝힌다. 카드 아래 점은 보고 있는 장을 따른다.
  // 카드 이름 뒤의 물음표 단추는 그 지표의 `help` 문단을 보여 준다.
  function indicators() {
    const head = [...report.querySelectorAll("h2")].find((h) => h.textContent.trim() === "미국 거시 지표");
    if (!head) return;
    // 첫 소제목 앞의 노드는 그대로 두고 묶음을 그 뒤에 둔다.
    const cards = [];
    let card = null, started = false, anchor = head;
    for (let node = head.nextElementSibling; node && node.tagName !== "H2";) {
      const next = node.nextElementSibling;
      if (node.tagName === "H3") {
        started = true;
        card = node.dataset.card ? { name: node.textContent.trim(), ...JSON.parse(node.dataset.card), text: [] } : null;
        if (card) cards.push(card);
      } else if (card) card.text.push(node.textContent.trim());
      if (started) node.remove(); else anchor = node;
      node = next;
    }
    if (!cards.length) {
      for (let node = head.nextElementSibling; node && node.tagName !== "H2";) { const next = node.nextElementSibling; node.remove(); node = next; }
      head.remove();
      return;
    }
    const slides = cards.map((c) => {
      const [box, name] = gauge(c);
      name.append(question(c.name, () => c.help.map((text) => Object.assign(document.createElement("p"), { textContent: text }))));
      box.append(Object.assign(document.createElement("p"), { textContent: c.text.filter(Boolean).join(" ") }));
      return [box];
    });
    const bar = document.createElement("div");
    bar.className = "tabs glide";
    bar.innerHTML = '<div class="strip"></div>';
    const strip = bar.firstChild;
    cards.forEach((c, i) => {
      const button = Object.assign(document.createElement("button"), { textContent: c.tab });
      button.addEventListener("click", () => box.go(i));
      strip.appendChild(button);
    });
    let seen = 0;
    const change = (i) => {
      [...strip.children].forEach((button, j) => button.classList.toggle("on", i === j));
      const room = Math.max(0, strip.scrollWidth - (bar.clientWidth - 32));
      strip.style.transform = `translateX(${-Math.min(room, strip.children[(seen = i)].offsetLeft)}px)`;
    };
    anchor.after(bar);
    const box = slider(slides, bar, { fit: true, change, name: "indicators", area: head, feel: true });
    box.prepend(bar);
    change(seen);
    new ResizeObserver(() => {
      strip.style.transition = "none";
      change(seen);
      strip.getBoundingClientRect();
      strip.style.transition = "";
    }).observe(box);
  }

  // 머리말에 달력 단추를 단다. `listing`은 `r/index.json`이다. 달력은 보고 있는 리포트의 달부터 보여 주고, 단추를 누르거나 달력을 옆으로 밀어 그림 넘기기와 같은 속도와 곡선으로 달을 넘기고, 리포트가 있는 첫 달과 마지막 달 밖으로는 넘기지 않는다.
  // 리포트가 있는 날짜를 누르면 같은 지수의 그날 리포트를 연다. 정규장 등락률이 `null`이면 `—`로 적는다.
  const CALENDAR = '<svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">'
    + '<rect x="3" y="4.5" width="14" height="12.5" rx="2.5"/><path d="M3 8.5h14M7 2.8v3M13 2.8v3"/></svg>';
  const CHEVRON = (d) => `<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
  function calendar(listing, date) {
    const index = key.split("-")[1];
    const moves = new Map(Object.values(listing).filter((entry) => entry.index === index)
      .map((entry) => [entry.date, entry.moves ? entry.moves.session : null]));
    if (!moves.size) return;
    const months = [...moves.keys()].map((day) => day.slice(0, 7)).sort();
    const today = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
    const shift = (month, n) => { const d = new Date(`${month}-01T00:00:00Z`); d.setUTCMonth(d.getUTCMonth() + n); return d.toISOString().slice(0, 7); };
    const pct = (v) => v === null ? "<small>—</small>"
      : `<small class="${v > 0 ? "up" : v < 0 ? "down" : ""}">${v > 0 ? "+" : v < 0 ? "−" : ""}${Math.abs(v).toFixed(2)}%</small>`;
    const opener = Object.assign(document.createElement("button"), { className: "cal-open", innerHTML: CALENDAR });
    opener.setAttribute("aria-label", "다른 날짜 리포트");
    document.querySelector("header").append(opener);
    opener.addEventListener("click", () => {
      feelPress();
      let month = date.slice(0, 7);
      const layer = Object.assign(document.createElement("div"), { className: "cal-layer" });
      const card = Object.assign(document.createElement("div"), { className: "cal" });
      card.style.top = `${opener.offsetTop + opener.offsetHeight + 6}px`;
      card.style.right = getComputedStyle(opener).right;
      card.innerHTML = `<div class="head"><button class="prev" aria-label="이전 달">${CHEVRON("M10 3.5 5.5 8l4.5 4.5")}</button><b></b>`
        + `<button class="next" aria-label="다음 달">${CHEVRON("M6 3.5 10.5 8 6 12.5")}</button></div><div class="pane"><div class="strip"></div></div>`;
      const [prev, title, next] = card.querySelector(".head").children, pane = card.querySelector(".pane"), strip = pane.firstElementChild;
      const inside = (m) => m >= months[0] && m <= months.at(-1);
      // 달 하나의 날짜 판을 만든다. 리포트가 있는 달 범위 밖이면 빈 판을 만든다.
      const grid = (month) => {
        if (!inside(month)) return '<div class="grid"></div>';
        const [y, m] = month.split("-").map(Number);
        const first = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(), count = new Date(Date.UTC(y, m, 0)).getUTCDate();
        let cells = [..."일월화수목금토"].map((w) => `<span class="wd">${w}</span>`).join("") + '<span class="pad"></span>'.repeat(first);
        for (let d = 1; d <= count; d++) {
          const day = `${month}-${String(d).padStart(2, "0")}`, has = moves.has(day);
          const name = [has && "has", day === date && "on", day === today && "today"].filter(Boolean).join(" ");
          cells += `<button class="${name}" data-day="${day}"${has ? "" : " disabled"}><span>${d}</span>${has ? pct(moves.get(day)) : ""}</button>`;
        }
        return `<div class="grid">${cells}</div>`;
      };
      // 날짜 판은 이전 달, 보고 있는 달, 다음 달을 장 사이 10px을 두고 나란히 놓는다. `offset`은 보고 있는 달의 판이 제자리에서 옮겨 간 거리다.
      let offset = 0, aligning = null;
      const step = () => pane.clientWidth + 10;
      const place = (x) => { offset = x; strip.style.transform = `translateX(${x - step()}px)`; };
      // 넘기는 동안 화면에 걸친 두 판 가운데 더 높은 판만큼 날짜 판 높이를 바로 늘린다. 줄이는 것은 넘기기가 멈춘 뒤에 한다.
      const reveal = (dir) => {
        const need = Math.max(strip.children[1].offsetHeight, strip.children[1 + dir].offsetHeight);
        if (need <= pane.offsetHeight) return;
        pane.style.transition = "none";
        pane.style.height = `${need}px`;
        pane.offsetHeight;
        pane.style.transition = "";
      };
      const draw = () => {
        const [y, m] = month.split("-").map(Number);
        title.textContent = `${y}년 ${m}월`;
        prev.disabled = !inside(shift(month, -1));
        next.disabled = !inside(shift(month, 1));
        strip.innerHTML = grid(shift(month, -1)) + grid(month) + grid(shift(month, 1));
        place(0);
        pane.style.height = `${strip.children[1].offsetHeight}px`;
        strip.querySelectorAll(".grid button.has").forEach((button) => button.addEventListener("click", () => {
          feelPress();
          if (button.dataset.day === date) return close();
          visit(`${button.dataset.day.replaceAll("-", "")}-${index}`);
        }));
      };
      // `dir`이 1이면 다음 달로, -1이면 이전 달로, 0이면 보고 있는 달로 날짜 판을 그림 넘기기와 같은 `glide`로 옮긴다. 달을 넘기면 옮기기 시작할 때
      // 달 이름을 바꾸고, 이슈 제목처럼 같은 시간 동안 흐린 데서 선명하게 바꾼다.
      const go = (dir) => {
        aligning?.();
        if (dir && !inside(shift(month, dir))) dir = 0;
        if (dir) {
          reveal(dir);
          const [y, m] = shift(month, dir).split("-").map(Number);
          title.textContent = `${y}년 ${m}월`;
          title.animate([{ opacity: 0 }, { opacity: 1 }], { duration: motion.matches ? 0 : GLIDE });
        }
        aligning = glide(offset, -dir * step(), place, () => {
          aligning = null;
          if (!dir) return;
          month = shift(month, dir);
          draw();
        });
      };
      prev.addEventListener("click", () => go(-1));
      next.addEventListener("click", () => go(1));
      // 손가락이 가로로 먼저 움직이면 날짜 판이 손가락을 따라오고, 달 범위 밖으로는 민 거리의 1/3만 따라온다. 손을 떼면 판 폭의 1/5을 넘게 밀었거나
      // 민 방향으로 빠르게 튕기고 바로 뗀 경우 그 방향의 달로 넘기고, 그렇지 않으면 보고 있는 달로 되돌린다. 넘기는 동안 손을 다시 대면 그 위치에서 멈추고 이어서 민다.
      let touch = null, dragged = false;
      card.addEventListener("touchstart", (event) => {
        dragged = false;
        if (event.touches.length !== 1) { touch = null; return; }
        aligning?.();
        aligning = null;
        const { clientX: x, clientY: y } = event.touches[0], t = performance.now();
        touch = { x, y, base: offset, axis: null, last: { x, t }, speed: 0 };
      }, { passive: true });
      card.addEventListener("touchmove", (event) => {
        if (!touch || event.touches.length !== 1) return;
        const { clientX: x, clientY: y } = event.touches[0], dx = x - touch.x, dy = y - touch.y, t = performance.now();
        if (!touch.axis) {
          if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
          touch.axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
        }
        if (touch.axis !== "x") return;
        dragged = true;
        if (t > touch.last.t) touch.speed = (x - touch.last.x) / (t - touch.last.t);
        touch.last = { x, t };
        const at = touch.base + dx, dir = at < 0 ? 1 : -1;
        place(at && !inside(shift(month, dir)) ? at / 3 : at);
        if (offset) reveal(dir);
      }, { passive: true });
      const release = () => {
        if (!touch || touch.axis !== "x") { touch = null; return; }
        const speed = performance.now() - touch.last.t < 100 ? touch.speed : 0;
        touch = null;
        go(Math.abs(speed) > 0.4 ? -Math.sign(speed) : offset < -step() / 5 ? 1 : offset > step() / 5 ? -1 : 0);
      };
      card.addEventListener("touchend", release, { passive: true });
      card.addEventListener("touchcancel", release, { passive: true });
      card.addEventListener("click", (event) => { if (dragged) { event.stopPropagation(); dragged = false; } }, true);
      const close = () => { aligning?.(); layer.remove(); card.remove(); opener.classList.remove("on"); };
      layer.addEventListener("click", (event) => { if (event.target === layer) close(); });
      opener.classList.add("on");
      masthead.append(layer);
      opener.after(card);
      draw();
    });
  }

  // 머리말 달력 단추 왼쪽에 다른 지수의 리포트로 바꾸는 단추를 단다. 단추에는 바꿀 지수의 이름을 그 지수의 그라데이션으로 쓴다. 누르면 보고 있는 리포트와 같은 날짜의
  // 그 지수 리포트를 열고, 그 날짜의 리포트가 없으면 그 지수의 가장 늦은 리포트를 연다. 지수는 `INDEX`의 순서로 돌고, 리포트가 있는 지수가 하나뿐이면 단추를 달지 않는다.
  function switcher(listing, date) {
    const index = key.split("-")[1];
    const order = Object.keys(INDEX).filter((name) => latest(listing, name));
    if (order.length < 2 || !order.includes(index)) return;
    const other = order[(order.indexOf(index) + 1) % order.length];
    const same = `${date.replaceAll("-", "")}-${other}`;
    const target = listing[same] ? same : latest(listing, other);
    const button = Object.assign(document.createElement("button"), { className: "index-switch" });
    button.append(Object.assign(document.createElement("span"), { textContent: listing[target].title.replace(/ (투자 )?리포트$/, "") }));
    button.setAttribute("aria-label", `${listing[target].title} 열기`);
    button.style.setProperty("--index", INDEX[other][0]);
    button.style.setProperty("--index-to", INDEX[other][1]);
    document.querySelector("header").append(button);
    button.addEventListener("click", () => {
      feelPress();
      visit(target);
    });
  }

  // 리포트 키가 없거나 형식이 다르면 목록에서 가장 늦은 나스닥 리포트를 연다. 목록에 나스닥 리포트가 없으면 열 리포트를 찾지 못했다고 적는다.
  const listed = fetch("r/index.json", { cache: "no-cache" }).then((r) => (r.ok ? r.json() : {})).catch(() => ({}));
  (/^\d{8}-[a-z]+$/.test(key) ? Promise.resolve(key) : listed.then((listing) => latest(listing, "nasdaq"))).then((found) => {
    if (!found) throw new Error("no report");
    key = found;
    paint();
    return Promise.all([
      fetch(`r/${key}/report.html`, { cache: "no-cache" }).then((r) => { if (!r.ok) throw new Error(r.status); return r.text(); }),
      listed,
    ]);
  }).then(([body, listing]) => {
    const entry = listing[key];
    if (entry) {
      document.getElementById("title").textContent = entry.title;
      document.title = `${entry.title} ${entry.day}`;
      // 제목 위 날짜 줄은 "2026년 11월 13일 (금)"처럼 쓴다.
      const [year, month, mday] = entry.date.split("-");
      document.getElementById("day").textContent = `${+year}년 ${+month}월 ${+mday}일 (${"일월화수목금토"[new Date(entry.date).getUTCDay()]})`;
      // 날짜는 제목 위에 있으므로 작성 시각 줄에는 시각만 쓰고, 처음 만든 날이 리포트 날짜와 다르면 월/일을 앞에 붙인다.
      const [day, time] = entry.written.split(" ");
      const when = day === entry.date ? time : `${+day.slice(5, 7)}/${+day.slice(8)} ${time}`;
      document.getElementById("dated").textContent = `작성 시각 ${when}`;
      if (entry.moves) {
        const pct = (v) => v === null ? "<b>—</b>"
          : `<b class="${v > 0 ? "up" : v < 0 ? "down" : ""}">${v > 0 ? "+" : v < 0 ? "−" : ""}${Math.abs(v).toFixed(2)}%</b>`;
        const moves = document.getElementById("moves");
        moves.innerHTML = `정규장${pct(entry.moves.session)}<span class="sep"></span>(장 마감 후${pct(entry.moves.after)})`;
      }
    }
    const date = entry ? entry.date : `${key.slice(0, 4)}-${key.slice(4, 6)}-${key.slice(6, 8)}`;
    if (key !== latest(listing, key.split("-")[1])) {
      const today = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
      document.getElementById("past").textContent = `${Math.max(1, Math.round((Date.parse(today) - Date.parse(date)) / 864e5))}일 전 리포트 탐색 중`;
      document.documentElement.classList.add("past");
    }
    report.innerHTML = body;
    calendar(listing, date);
    switcher(listing, date);
    const focus = +query.get("issue") || 0;
    if (!focus) {
      figures(date);
      fold("1개월 지수 방향 예측");
      indicators();
    }
    issueCharts();
    toneTags(report);
    fold("상세 이슈 해설", 4, ["이슈 해설"]);
    section("상세 이슈 해설", focus, query.get("at"));
    // 번호 이슈 뒤 항목의 번호는 `section`이 먼저 붙인다.
    report.querySelectorAll("h3").forEach(trail);
    if (!focus) {
      // 노드를 옮기면 넘기기 묶음의 스크롤 위치가 처음으로 돌아가므로, 막을 씌울 상자는 묶음을 만들기 전에 만든다.
      if (document.documentElement.classList.contains("past")) freeze("다가오는 이벤트", latest(listing, key.split("-")[1]));
      events(date, listing);
      help();
      jump([["예측", "1개월 지수 방향 예측"], ["이슈", "상세 이슈 해설"], ["지표", "미국 거시 지표"], ["이벤트", "다가오는 이벤트"]]);
    }
    // Montecarlo처럼 글자가 작은 그림은 눌러서 미니 앱 안에서 화면 폭으로 띄우고, 두 손가락으로 키우고 줄이며
    // 키운 그림은 한 손가락으로 옮긴다. 원래 크기에서 좌우로 밀면 같은 묶음의 이전·다음 그림으로 넘긴다.
    // 손가락을 움직이지 않고 한 번 누르면 닫는다.
    // 이슈 목록 상자의 썸네일은 누르면 이슈를 열므로 띄우지 않는다.
    report.querySelectorAll("img:not(.thumb)").forEach((img) => img.addEventListener("click", () => viewer(img)));
    // 뒤로 가기로 돌아온 페이지는 머리 상자와 절 바로가기 알약을 띄워(`reveal`) 어느 날짜의 리포트로 돌아왔는지 보이게 한다.
    // 페이지를 새로 열었으면 그림을 모두 받아 문서 높이가 정해진 뒤 떠나기 전 화면 위치로 옮기고 띄운다. 그 사이에 사용자가 화면을 움직였으면 옮기지 않는다.
    // 옮긴 뒤에도 위쪽 카드가 다 그려지며 늘어나면 브라우저가 보던 내용을 제자리에 두려고 화면을 옮기므로, `STILL`ms 동안은 `hush`로 이 이동을 사용자가 옮긴 것으로 세지 않는다.
    // 그 사이에 사용자가 화면을 만지면 바로 다시 센다.
    // 브라우저가 떠나기 전 페이지를 그대로 보관했다가 되살렸으면(`persisted`) 위치는 그대로 두고 띄우기만 한다.
    if (performance.getEntriesByType("navigation")[0]?.type === "back_forward") {
      Promise.all([...report.querySelectorAll("img")].map((img) => img.complete
        || new Promise((done) => { img.addEventListener("load", done, { once: true }); img.addEventListener("error", done, { once: true }); })))
        .then(() => {
          const done = hush();
          if (scrollY === 0 && history.state?.y) scrollTo(0, history.state.y);
          dispatchEvent(new Event("reveal"));
          setTimeout(done, STILL);
          addEventListener("touchstart", done, { once: true, passive: true });
          addEventListener("wheel", done, { once: true, passive: true });
        });
    }
    addEventListener("pageshow", (event) => { if (event.persisted) dispatchEvent(new Event("reveal")); });
  }).catch(() => fail("리포트를 찾지 못했다."));
  // 미니 앱 안에서 다른 리포트로 옮겨 온 페이지(`depth`가 0보다 크면)는 화면 왼쪽 끝 18px 띠에서 오른쪽으로 밀어 앞 리포트로 돌아간다.
  // 이슈 화면은 띠를 48px로 넓히고, 앞 페이지가 없으면(주소로 바로 연 이슈 화면) 이슈 목록 단추처럼 같은 리포트의 리포트 화면을 연다.
  // 띠는 위아래 스크롤은 브라우저에 맡기고 가로 이동만 받는다. 미는 동안 손가락 높이에 뒤로 가기 원이 따라 나오고, 80px을 넘기면 원이 밝아지며
  // 선택 변경 진동을 낸다. 80px을 넘긴 채 손을 떼면 앞 페이지로 돌아가고, 못 넘기면 원을 거둔다. 움직이지 않고 누른 곳은 띠 아래 요소를 누른 것으로 넘긴다.
  if (depth > 0 || query.get("issue")) {
    const edge = Object.assign(document.createElement("div"), { className: "back-edge" });
    const ring = Object.assign(document.createElement("div"), { className: "back-ring" });
    ring.innerHTML = '<svg width="10" height="16" viewBox="0 0 10 16" aria-hidden="true"><path d="M8 2L2 8l6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    document.body.append(edge, ring);
    const REACH = 80;
    let start = null, ready = false;
    const place = (dx, y) => {
      const pull = Math.min(dx, REACH * 1.6);
      ring.style.transform = `translate(${pull * 0.6 - 44}px, ${y - 22}px)`;
      ring.style.opacity = Math.min(1, dx / 40);
    };
    edge.addEventListener("touchstart", (event) => {
      const touch = event.touches[0];
      start = { x: touch.clientX, y: touch.clientY, moved: false };
      ready = false;
      ring.classList.remove("ready", "rest");
    }, { passive: true });
    edge.addEventListener("touchmove", (event) => {
      if (!start) return;
      const touch = event.touches[0], dx = touch.clientX - start.x;
      if (Math.hypot(dx, touch.clientY - start.y) > 8) start.moved = true;
      place(Math.max(0, dx), touch.clientY);
      if (ready !== dx > REACH) {
        ready = dx > REACH;
        ring.classList.toggle("ready", ready);
        if (ready) feelSlide();
      }
    }, { passive: true });
    const end = (event) => {
      if (!start) return;
      const { moved } = start, touch = event.changedTouches[0];
      start = null;
      ring.classList.add("rest");
      if (ready) {
        if (depth > 0) return history.back();
        const params = new URLSearchParams(location.search);
        params.delete("issue");
        params.delete("at");
        location.replace(`?${params}`);
        return;
      }
      ring.style.opacity = 0;
      ring.style.transform = `translate(-44px, ${touch.clientY - 22}px)`;
      if (moved || event.type === "touchcancel") return;
      event.preventDefault();
      edge.hidden = true;
      const under = document.elementFromPoint(touch.clientX, touch.clientY);
      edge.hidden = false;
      under?.click();
    };
    edge.addEventListener("touchend", end);
    edge.addEventListener("touchcancel", end);
    // 뒤로 가기로 떠난 페이지가 브라우저 캐시에서 그대로 돌아오면 원을 거둔 상태로 되돌린다.
    addEventListener("pageshow", () => { ring.classList.remove("ready"); ring.style.opacity = 0; });
  }
  // 이름과 절 제목의 쌍마다 바로가기 단추를 만든다. 누르면 보던 위치에서 절 제목 글자가 문서 맨 위에서 본 첫 절 제목 글자보다 40px 높은 높이에 올 때까지
  // 화면을 부드럽게 움직인다. 제목 위의 띠는 화면 위쪽에 보인다. 문서 끝이 모자라 제목이 그 높이까지 오지 못하면 리포트 아래 여백을 그만큼 늘린다.
  // 단추를 만들 때 절마다 여백을 미리 늘려, 처음부터 마지막 절 제목까지 손으로 밀어 올릴 수 있다.
  // 화면을 움직일 때마다, 절 제목 글자가 화면 위에서 3분의 1 높이를 넘은 절 가운데 마지막 절의 단추를 굵게 쓰고 레버를 그 단추 뒤로 옮긴다.
  // 그 높이가 바로가기로 옮겼을 때의 높이보다 위에 있으면 바로가기로 옮겼을 때의 높이를 쓴다.
  // 문서 맨 위에서는 첫 절의 단추를, 문서 끝까지 내려 마지막 절 제목이 그 높이에 닿지 못하면 마지막 절의 단추를 굵게 쓴다.
  // 바로가기로 화면이 움직이는 동안에는 지나가는 절의 단추 대신 고른 단추를 굵게 쓴다. 고른 절에 닿거나, 알약 밖을 누르거나 휠을 굴리거나, 3초가 지나면 다시 읽는 절을 따른다.
  // 알약 위에서 누른 채 6px 넘게 움직이면 레버가 손가락을 따라 움직이고, 레버 가운데에서 가장 가까운 단추를 굵게 쓴다. 손을 떼면 그 단추를 누른 것과 같이 그 절로 간다.
  // 끈 뒤 손을 뗄 때 따라오는 단추 누름은 다음에 알약을 누를 때까지 무시한다.
  function jump(pairs) {
    const nav = document.createElement("nav");
    nav.className = "jump";
    const lever = document.createElement("i");
    lever.className = "lever";
    nav.append(lever);
    const marks = [];
    const textTop = (head) => {
      const band = getComputedStyle(head, "::before");
      return head.getBoundingClientRect().top + (band.content === "none" ? 0 : parseFloat(band.height) + parseFloat(band.marginBottom));
    };
    const gap = () => textTop(marks[0][0]) + scrollY - 40;
    const show = (on) => {
      marks.forEach(([, button], i) => button.classList.toggle("on", i === on));
      const button = marks[on]?.[1];
      lever.style.opacity = button ? 1 : 0;
      if (!button) return;
      lever.style.height = `${button.offsetHeight}px`;
      lever.style.transform = `translateY(${button.offsetTop}px)`;
    };
    let pending = false, held = null, release = 0, drag = null, idle = 0;
    // 알약을 띄우고 `STILL`ms 뒤에 감춘다. 알약을 끌고 있으면 감추지 않고, 손을 뗄 때 다시 시간을 센다. 뒤로 가기로 돌아온 페이지가 보내는 `reveal`에도 띄운다.
    const wake = () => {
      nav.classList.remove("idle", "fall");
      clearTimeout(idle);
      idle = setTimeout(() => { if (!drag) nav.classList.add("idle"); }, STILL);
    };
    addEventListener("reveal", wake);
    addEventListener("scroll", () => {
      if (falling) {
        if (!drag) { clearTimeout(idle); nav.classList.add("idle", "fall"); }
        return;
      }
      if (!nav.classList.contains("idle") || rising) wake();
    }, { passive: true });
    const mark = () => {
      pending = false;
      if (drag?.moved) return;
      const end = scrollY + innerHeight >= document.documentElement.scrollHeight - 2;
      let on = -1;
      const line = Math.max(gap() + 1, innerHeight / 3);
      marks.forEach(([head], i) => { if (textTop(head) <= line) on = i; });
      if (scrollY <= 0) on = 0;
      else if (end) on = marks.length - 1;
      if (held !== null && on === held) held = null;
      show(held ?? on);
    };
    const settle = () => { held = null; mark(); };
    addEventListener("scroll", () => { if (!pending) { pending = true; requestAnimationFrame(mark); } }, { passive: true });
    addEventListener("wheel", settle, { passive: true });
    addEventListener("touchstart", (event) => { if (!nav.contains(event.target)) settle(); }, { passive: true });
    addEventListener("resize", mark);
    // 절 제목 글자가 바로가기 높이에 오는 화면 위치를 돌려준다. 문서 끝이 모자라면 리포트 아래를 늘린다.
    const reach = (head) => {
      const top = Math.max(0, textTop(head) + scrollY - gap());
      const lack = top + innerHeight - document.documentElement.scrollHeight;
      if (lack > 0) report.style.paddingBottom = `${(parseFloat(report.style.paddingBottom) || 0) + lack}px`;
      return top;
    };
    const go = (i) => {
      const top = reach(marks[i][0]);
      held = i;
      clearTimeout(release);
      release = setTimeout(settle, 3000);
      show(i);
      scrollTo({ top, behavior: "smooth" });
    };
    pairs.forEach(([name, title]) => {
      const head = [...report.querySelectorAll("h2")].find((h) => h.textContent.trim() === title);
      if (!head) return;
      const button = document.createElement("button");
      button.textContent = name;
      button.dataset.name = name;
      const i = marks.length;
      marks.push([head, button]);
      head.reach = () => reach(head);
      button.addEventListener("click", () => { if (!nav.dataset.dragged) { feelPress(); go(i); } });
      nav.append(button);
    });
    const nearest = (y) => {
      let best = 0;
      marks.forEach(([, button], i) => {
        const centre = (b) => b.offsetTop + b.offsetHeight / 2;
        if (Math.abs(centre(button) - y) < Math.abs(centre(marks[best][1]) - y)) best = i;
      });
      return best;
    };
    nav.addEventListener("pointerdown", (event) => {
      delete nav.dataset.dragged;
      drag = { y: event.clientY, top: nav.getBoundingClientRect().top + nav.clientTop, moved: false, id: event.pointerId };
    });
    nav.addEventListener("pointermove", (event) => {
      if (!drag || event.pointerId !== drag.id) return;
      if (!drag.moved && Math.abs(event.clientY - drag.y) <= 6) return;
      if (!drag.moved) { drag.moved = true; nav.setPointerCapture(event.pointerId); lever.classList.add("drag"); }
      const first = marks[0][1], last = marks[marks.length - 1][1];
      const height = lever.offsetHeight;
      const y = Math.min(last.offsetTop + last.offsetHeight - height, Math.max(first.offsetTop, event.clientY - drag.top - height / 2));
      lever.style.opacity = 1;
      lever.style.transform = `translateY(${y}px)`;
      const on = nearest(y + height / 2);
      marks.forEach(([, button], i) => button.classList.toggle("on", i === on));
    });
    const end = (event) => {
      if (!drag || event.pointerId !== drag.id) return;
      const moved = drag.moved;
      drag = null;
      wake();
      if (!moved) return;
      nav.dataset.dragged = "1";
      lever.classList.remove("drag");
      const rect = lever.getBoundingClientRect();
      go(nearest(rect.top - nav.getBoundingClientRect().top - nav.clientTop + rect.height / 2));
    };
    nav.addEventListener("pointerup", end);
    nav.addEventListener("pointercancel", end);
    if (!marks.length) return;
    document.body.append(nav);
    marks.forEach(([head]) => reach(head));
    mark();
    wake();
  }

  // 절 제목마다 설명 상자에 쓸 항목을 둔다. 항목마다 이름을 굵게 쓰고 그 아래에 설명을 쓴다.
  const HELP = {
    "1개월 지수 방향 예측": [
      ["주가와 예측", "파란 실선은 예측 중앙값이에요. 파란 면에는 25거래일 뒤 가격이 25~75% 확률로 들어와요. 회색 점과 면은 지난 리포트의 예측이에요."],
      ["몬테카를로", "이슈와 이벤트를 반영한 경로 2만 개의 등락률 분포예요. 두 파란 선 사이에 경로의 가운데 50%가 들어와요."],
      ["권장 추종 배율", "경로 2만 개의 한 달 평균 등락을 배율로 바꾼 분포예요. 파란 실선이 1.0(지수 추종)보다 왼쪽이면 하락 쪽 판단이고, 오른쪽이면 상승 쪽 판단이에요."],
    ],
    "상세 이슈 해설": [
      ["이슈를 고르는 기준", "주가 예측에 영향이 큰 이슈부터 보여줘요. 이슈 하나를 빼고 다시 계산했을 때 예측이 크게 바뀔수록 영향이 커요."],
      ["상승 요인과 하락 요인", "이슈 때문에 주가 예측이 올랐는지 내렸는지 보여줘요. 나쁜 소식도 반등 가능성을 높이면 상승 요인이에요."],
      ["히스토리", "같은 이슈를 다룬 지난 리포트의 해설 제목이에요. 제목을 누르면 그날의 해설이 나와요."],
    ],
    "다가오는 이벤트": [
      ["이벤트 확률표", "앞으로 35일 안에 발표되는 이벤트마다 가능한 결과와 확률을 보여줘요. 몬테카를로 경로 2만 개를 만들 때 이벤트 확률을 써요."],
      ["확률 변화", "어제 리포트의 확률과 오늘 확률의 차이를 %p로 보여줘요."],
      ["실제 결과", "결과가 나온 다음 날에는 실제로 일어난 결과를 표시해요."],
    ],
  };
  const QUESTION = '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1"/>'
    + '<path d="M6.2 6.2a1.8 1.8 0 1 1 2.6 1.6c-.5.3-.8.6-.8 1.2v.4" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>'
    + '<circle cx="8" cy="11.6" r=".8" fill="currentColor"/></svg>';
  // 그림 카드가 있는 리포트의 1개월 지수 방향 예측 설명. 판단 색 이름은 지수마다 다르다.
  const CARD_HELP = (ink) => [
    ["주가와 예측", `${ink} 실선은 예측 중앙값이에요. ${ink} 면에는 25거래일 뒤 가격이 25~75% 확률로 들어와요. 회색 점선과 면은 지난 리포트의 예측이에요.`],
    ["몬테카를로", `이슈와 이벤트를 반영한 경로 2만 개의 등락률 분포예요. 진한 면에 경로의 가운데 50%가, 옅은 면에 가운데 80%가 들어와요. 번호나 그림 아래 꺽쇠를 누르면 그날의 등락률 범위와 일정이 나와요.`],
    ["권장 추종 배율", `경로 2만 개의 한 달 평균 등락을 배율로 바꾼 분포예요. ${ink} 세로선이 권장 추종 배율이에요. 세로선이 회색 점선 1.0(지수 추종)보다 왼쪽이면 하락 쪽 판단이고, 오른쪽이면 상승 쪽 판단이에요.`],
  ];
  const INK = { nasdaq: "파란", biotech: "보라" };
  // 설명이 있는 절 제목 뒤에 물음표 단추를 넣는다. 단추는 글자를 담지 않으므로 절 제목 글자로 절을 찾는 `jump`가 그대로 동작한다. `section`이 절 제목 안을 바꿔 쓴 뒤에 부른다.
  function help() {
    report.querySelectorAll("h2").forEach((head) => {
      const title = head.textContent.trim();
      if (!HELP[title]) return;
      const items = title === "1개월 지수 방향 예측" && report.querySelector(".carousel.cards") ? CARD_HELP(INK[key.split("-")[1]] || "파란") : HELP[title];
      head.append(question(title, () => {
        const list = document.createElement("ul");
        items.forEach(([name, text]) => {
          const li = list.appendChild(document.createElement("li"));
          li.append(Object.assign(document.createElement("b"), { textContent: name }), text);
        });
        return [list];
      }));
    });
  }

  // 누르면 `title`을 제목으로, `body`가 돌려준 노드를 본문으로 쓴 설명 상자를 띄우는 물음표 단추.
  function question(title, body) {
    const button = document.createElement("button");
    button.className = "help";
    button.setAttribute("aria-label", `${title} 설명`);
    button.innerHTML = QUESTION;
    button.addEventListener("click", () => {
      const box = document.createElement("div");
      box.className = "help-card";
      const card = box.appendChild(document.createElement("div"));
      card.className = "card";
      const h3 = card.appendChild(document.createElement("h3"));
      h3.append(title);
      const close = h3.appendChild(Object.assign(document.createElement("button"), { textContent: "✕" }));
      close.setAttribute("aria-label", "닫기");
      card.append(...body());
      box.addEventListener("click", (event) => { if (event.target === box || close.contains(event.target)) box.remove(); });
      document.body.append(box);
    });
    return button;
  }

  function viewer(img) {
    const box = document.createElement("div");
    box.className = "viewer";
    // 되감기 슬라이더가 원래 그림을 숨기고 canvas를 보이므로, 크게 보는 그림은 숨김을 풀어 띄운다.
    const large = img.cloneNode();
    large.style.display = "";
    box.append(large);
    document.body.append(box);
    const carousel = img.closest(".carousel");
    const group = carousel ? [...carousel.querySelectorAll("img")] : [img];
    let index = group.indexOf(img), swipe = null;
    let scale = 1, x = 0, y = 0, start = null, moved = false;
    const place = () => {
      const fit = (offset, size, room, at) => size * scale <= room ? (size - size * scale) / 2
        : Math.min(-at, Math.max(room - at - size * scale, offset));
      x = fit(x, large.offsetWidth, box.clientWidth, large.offsetLeft);
      y = fit(y, large.offsetHeight, box.clientHeight, large.offsetTop);
      large.style.transform = `translate(${x + (swipe ? swipe.dx : 0)}px, ${y}px) scale(${scale})`;
    };
    // 묶음의 i번 그림으로 바꾸고, 닫았을 때 그 그림이 보이도록 뒤의 묶음도 함께 넘긴다.
    const show = (i) => {
      index = i;
      large.src = group[i].src;
      scale = 1; x = 0; y = 0;
      large.style.transform = "";
      carousel.go([...carousel.querySelector(".track").children].indexOf(group[i].closest(".slide")));
    };
    const touches = (event) => {
      const [a, b = a] = event.touches;
      return { mid: [(a.clientX + b.clientX) / 2 - large.offsetLeft, (a.clientY + b.clientY) / 2 - large.offsetTop],
               gap: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), count: event.touches.length };
    };
    box.addEventListener("touchstart", (event) => {
      if (event.touches.length === 1) moved = false;
      start = { ...touches(event), scale, x, y };
      swipe = event.touches.length === 1 && scale === 1 && group.length > 1 ? { dx: 0, dy: 0 } : null;
    }, { passive: true });
    box.addEventListener("touchmove", (event) => {
      event.preventDefault();
      const now = touches(event);
      if (now.count !== start.count) { start = { ...now, scale, x, y }; swipe = null; }
      if (swipe) {
        swipe = { dx: now.mid[0] - start.mid[0], dy: now.mid[1] - start.mid[1] };
        if (Math.hypot(swipe.dx, swipe.dy) > 8) moved = true;
        place();
        return;
      }
      if (now.count === 2) scale = Math.min(5, Math.max(1, start.scale * now.gap / start.gap));
      const ratio = scale / start.scale;
      x = now.mid[0] - (start.mid[0] - start.x) * ratio;
      y = now.mid[1] - (start.mid[1] - start.y) * ratio;
      if (now.count === 2 || Math.hypot(now.mid[0] - start.mid[0], now.mid[1] - start.mid[1]) > 8) moved = true;
      place();
    }, { passive: false });
    box.addEventListener("touchend", (event) => {
      if (event.touches.length) { start = { ...touches(event), scale, x, y }; swipe = null; return; }
      if (!swipe) return;
      const next = index + (swipe.dx < 0 ? 1 : -1);
      const turn = Math.abs(swipe.dx) > 50 && Math.abs(swipe.dx) > Math.abs(swipe.dy) && group[next];
      swipe = null;
      if (turn) show(next); else place();
    });
    box.addEventListener("click", () => { if (!moved) box.remove(); });
  }
</script>
</body>
